/* ============ RENDER + STATE (localStorage + export/import JSON) ============ */
const STORE_KEY='edulms_tracker_v1';
const STATUS_ORDER=['todo','in_progress','done','blocked'];
const STATUS_LABEL={todo:'🔘 Chưa',in_progress:'⏳ Đang',done:'✅ Xong',blocked:'⛔ Chặn'};
let state={status:{},filter:'all',owner:'all',phase:'all'};
function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s)state=Object.assign(state,s);}catch(e){}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function taskPrompt(t){
  return `BẠN là lập trình viên thực hiện task ${t.id} — ${t.title} (Phase ${t.phaseName}, Week ${t.week}, ${t.pri}, owner ${t.owner}, ~${t.est} ngày) của EduCenter LMS.

━━ PROMPT_CONTEXT ━━
${PROJECT_CONTEXT}

━━ MỤC TIÊU ━━
${t.goal}

━━ ĐẦU VÀO (đọc trước) ━━
${t.input.map(x=>'• '+x).join('\n')}

━━ CÁC BƯỚC THỰC HIỆN ━━
${t.steps.map((x,i)=>`${i+1}. ${x}`).join('\n')}

━━ ĐẦU RA (Deliverable) ━━
${t.output.map(x=>'• '+x).join('\n')}

━━ TIÊU CHÍ NHẬN (DoD) ━━
${t.dod.map(x=>'[ ] '+x).join('\n')}

━━ PHỤ THUỘC ━━
${t.deps.length?t.deps.join(', '):'Không có'}

YÊU CẦU: Thực hiện đủ quy trình trong codebase. Khi xong trả về: (1) file/dir đã tạo-sửa, (2) xác nhận từng DoD (✓/✗), (3) lệnh test đã chạy + kết quả, (4) cập nhật trạng thái task. Nếu chặn, nêu blocker + điều cần quyết định.`;
}
function filtered(){return TASKS.filter(t=>{
  if(state.phase!=='all'&&t.phase!==state.phase)return false;
  if(state.owner!=='all'&&t.owner!==state.owner)return false;
  if(state.filter==='active')return (state.status[t.id]||'todo')!=='done';
  if(state.filter!=='all')return (state.status[t.id]||'todo')===state.filter;
  return true;});
}
function st(){const a={total:TASKS.length,done:0,ip:0,bl:0,td:0};TASKS.forEach(t=>{const s=state.status[t.id]||'todo';if(s==='done')a.done++;else if(s==='in_progress')a.ip++;else if(s==='blocked')a.bl++;else a.td++;});a.pct=TASKS.length?Math.round(a.done/TASKS.length*100):0;return a;}
function statusBar(t){const s=state.status[t.id]||'todo';return STATUS_ORDER.map(k=>`<button onclick="setStatus('${t.id}','${k}')" class="px-2 py-1 text-xs rounded border ${s===k?'bg-primary text-white border-primary':'bg-white border-gray-300 hover:bg-gray-100'}">${STATUS_LABEL[k]}</button>`).join(' ');}
function card(t){const s=state.status[t.id]||'todo';return `<div class="border rounded-lg bg-white p-3 ${s==='done'?'opacity-60':''}">
<div class="flex justify-between"><span class="font-bold text-teal-700">${t.id}</span><span class="text-xs text-gray-500">W${t.week} · ${t.pri} · ${t.owner}</span></div>
<div class="font-medium mt-1">${esc(t.title)}</div>
<div class="text-xs text-gray-500 mt-0.5">${esc(t.group)} · ~${t.est} ngày</div>
<div class="flex flex-wrap gap-1 mt-2">${statusBar(t)}</div>
<div class="mt-2 flex gap-2"><button onclick="showPrompt('${t.id}')" class="text-xs bg-teal-600 hover:bg-teal-700 text-white px-2 py-1 rounded">🔑 Prompt</button><button onclick="showDetail('${t.id}')" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded">📋 Quy trình</button></div>
</div>`;}
function render(){
  const st=st();const list=filtered();
  const filters=[['all','Tất cả'],['active','Chưa xong'],['in_progress','Đang'],['done','Xong'],['blocked','Chặn']];
  document.getElementById('app').innerHTML=`
  <div class="max-w-6xl mx-auto p-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div><h1 class="text-2xl font-bold">EduCenter LMS — Progress Tracker <span class="text-sm text-gray-500">(MVP 16 tuần / 2 dev)</span></h1>
      <p class="text-sm text-gray-600">Tổng ${st.total} · ✅ ${st.done} · ⏳ ${st.ip} · ⛔ ${st.bl} · 🔘 ${st.td} — <b>${st.pct}% hoàn thành</b></p></div>
      <div class="flex gap-2"><button onclick="exportJson()" class="bg-gray-700 text-white px-3 py-1 rounded text-sm">⬇ Export JSON</button>
      <button onclick="document.getElementById('importFile').click()" class="bg-gray-500 text-white px-3 py-1 rounded text-sm">⬆ Import</button>
      <input type="file" id="importFile" class="hidden" accept="application/json" onchange="importJson(event)">
      <button onclick="resetState()" class="bg-red-600 text-white px-3 py-1 rounded text-sm">Reset</button></div>
    </div>
    <div class="flex flex-wrap gap-2 mt-4 items-center">
      ${filters.map(([k,lb])=>`<button onclick="setFilter('${k}')" class="px-3 py-1 text-sm rounded ${state.filter===k?'bg-primary text-white':'bg-white border'}">${lb}</button>`).join(' ')}
      <select onchange="setPhase(this.value)" class="ml-2 text-sm border rounded px-2 py-1"><option value="all">All phase</option>${[...new Set(TASKS.map(t=>t.phase))].map(p=>`<option ${state.phase===p?'selected':''} value="${p}">${p} — ${TASKS.find(x=>x.phase===p).phaseName}</option>`).join('')}</select>
      <select onchange="setOwner(this.value)" class="text-sm border rounded px-2 py-1"><option value="all">All dev</option><option ${state.owner==='Dev1'?'selected':''}>Dev1</option><option ${state.owner==='Dev2'?'selected':''}>Dev2</option><option ${state.owner==='Both'?'selected':''}>Both</option></select>
    </div>
    <div class="mt-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">${list.map(card).join('')}</div>
    <p class="text-xs text-gray-400 mt-6">State lưu localStorage; Export JSON để lưu/đồng bộ từ xa, Import khôi phục. Mỗi task có <b>Prompt</b> (context chuyển hội thoại mới) và <b>Quy trình</b> (mục tiêu/đầu vào/bước/đầu ra/DoD).</p>
  </div>`;
}
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function showPrompt(id){const t=TASKS.find(x=>x.id===id);showModal(`
  <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-lg text-teal-700">🔑 PROMPT_CONTEXT — ${t.id} · ${esc(t.title)}</h2><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">×</button></div>
  <button onclick="copyText('${t.id}')" class="bg-teal-600 text-white px-3 py-1 rounded text-sm mb-3">📋 Copy toàn bộ</button>
  <pre class="bg-gray-50 border rounded p-3 text-xs whitespace-pre-wrap max-h-[60vh] overflow-auto" id="pc">${esc(taskPrompt(t))}</pre>`);
  document.getElementById('modal').classList.remove('hidden');
}
function showDetail(id){const t=TASKS.find(x=>x.id===id);showModal(`
  <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-lg text-teal-700">📋 ${t.id} — ${esc(t.title)}</h2><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">×</button></div>
  <p class="text-sm"><b>Phase:</b> ${t.phaseName} (Week ${t.week}) · <b>Owner:</b> ${t.owner} · <b>Est:</b> ${t.est} ngày · <b>Deps:</b> ${t.deps.length?t.deps.join(', '):'—'}</p>
  <div class="mt-3"><b class="text-sm">Mục tiêu:</b><p class="text-sm mt-1">${esc(t.goal)}</p></div>
  <div class="mt-3"><b class="text-sm">Đầu vào:</b><ul class="text-sm list-disc ml-5 mt-1">${t.input.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="mt-3"><b class="text-sm">Các bước:</b><ol class="text-sm list-decimal ml-5 mt-1">${t.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
  <div class="mt-3"><b class="text-sm">Đầu ra:</b><ul class="text-sm list-disc ml-5 mt-1">${t.output.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="mt-3"><b class="text-sm">Tiêu chí nhận (DoD):</b><ul class="text-sm list-disc ml-5 mt-1">${t.dod.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="mt-4"><button onclick="showPrompt('${t.id}')" class="bg-teal-600 text-white px-3 py-1 rounded text-sm">🔑 Xem Prompt</button></div>`);
}
function copyText(id){const t=TASKS.find(x=>x.id===id);navigator.clipboard.writeText(taskPrompt(t)).then(()=>alert('Đã copy prompt '+t.id)).catch(()=>{const ta=document.getElementById('pc');ta.select();document.execCommand('copy');});}
function setStatus(id,k){state.status[id]=k;save();render();}
function setFilter(k){state.filter=k;save();render();}
function setPhase(v){state.phase=v;save();render();}
function setOwner(v){state.owner=v;save();render();}
function resetState(){if(confirm('Xóa toàn bộ trạng thái tiến độ đã lưu?')){localStorage.removeItem(STORE_KEY);state={status:{},filter:'all',owner:'all',phase:'all'};render();}}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edulms-progress.json';a.click();}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s&&s.status){state.status=s.status;if(s.filter)state.filter=s.filter;if(s.owner)state.owner=s.owner;if(s.phase)state.phase=s.phase;save();render();alert('Đã import tiến độ');}}catch(err){alert('File JSON không hợp lệ');}};r.readAsText(f);e.target.value='';}
load();render();
</script>
