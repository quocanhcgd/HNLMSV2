mmediately after enrollment","trigger":"Enrollment record created and confirmed","actors":["System (automated), Finance Officer (verification)"],"actions":["Trigger Event","Auto-Generate Invoice","Invoice Details","Send to Student"],"criteria":["Invoice generated within 1 minute of enrollment","All line items accurate","Discounts applied correctly","Student receives invoice immediately"]},{"title":"Payment Collection (Multiple Methods)","objective":"Collect payment through convenient channels","trigger":"","actors":["Finance Officer, Student, Payment Gateway"],"actions":["System generates payment URL","Student enters payment details","LMS validates webhook signature","Enter payment details","Print receipt (2 copies)","System auto-matches transactions","For unmatched"],"criteria":[]},{"title":"Payment Recording & Receipt Generation","objective":"Accurately record payment and provide proof","trigger":"","actors":["System, Finance Officer"],"actions":[],"criteria":[]},{"title":"Daily Reconciliation","objective":"Ensure all transactions recorded accurately","trigger":"","actors":["Finance Officer"],"actions":["Compare with system records","If variance exists","Match transactions","For mismatches","Prepare cash for deposit","Record deposit in system"],"criteria":[]},{"title":"Monthly Close & Reporting","objective":"Consolidated financial reporting and analysis","trigger":"","actors":["Accountant, Finance Officer, Branch Manager"],"actions":["Full month reconciliation","Identify variances","Generate P&L (Profit & Loss)","Financial analysis","Discuss action items"],"criteria":[]}],"estimated":"Varies by transaction","scope":"MVP","nodes":[{"id":"Start","label":"Enrollment Confirmed","shape":"round","role":"","p":0},{"id":"GenInvoice","label":"Generate Invoice","shape":"rect","role":"","p":0},{"id":"InvoiceDetails","label":"Invoice Details","shape":"rect","role":"","p":0},{"id":"SendInvoice","label":"Send to Student","shape":"rect","role":"","p":0},{"id":"PaymentWait","label":"Awaiting Payment","shape":"diamond","role":"","p":1},{"id":"OnlineFlow","label":"Online Payment Flow","shape":"rect","role":"","p":1},{"id":"CashFlow","label":"Cash Payment Flow","shape":"rect","role":"","p":1},{"id":"BankFlow","label":"Bank Transfer Flow","shape":"rect","role":"","p":0},{"id":"PayGateway","label":"Payment Gateway","shape":"rect","role":"","p":1},{"id":"GatewayProcess","label":"Process Payment","shape":"rect","role":"","p":1},{"id":"Webhook","label":"Webhook Notification","shape":"rect","role":"","p":1},{"id":"VerifyWebhook","label":"Verify Signature","shape":"rect","role":"","p":1},{"id":"RecordPayment","label":"Record Payment","shape":"rect","role":"","p":2},{"id":"ReceiveCash","label":"Receive at Counter","shape":"rect","role":"","p":0},{"id":"CountCash","label":"Count & Verify","shape":"rect","role":"","p":0},{"id":"StudentTransfer","label":"Student Transfers","shape":"rect","role":"","p":0},{"id":"CheckStatement","label":"Check Bank Statement","shape":"rect","role":"","p":0},{"id":"MatchTransaction","label":"Match to Invoice","shape":"rect","role":"","p":0},{"id":"UpdateInvoice","label":"Update Invoice Status","shape":"rect","role":"","p":0},{"id":"GenReceipt","label":"Generate Receipt","shape":"rect","role":"","p":2},{"id":"SendReceipt","label":"Send Receipt","shape":"rect","role":"","p":2},{"id":"DailyRecon","label":"End of Day?","shape":"diamond","role":"","p":0},{"id":"Reconcile","label":"Daily Reconciliation","shape":"rect","role":"","p":3},{"id":"Continue","label":"Continue Operations","shape":"rect","role":"","p":0},{"id":"CashCount","label":"Count Cash Drawer","shape":"rect","role":"","p":3},{"id":"CompareRecords","label":"Compare with Records","shape":"rect","role":"","p":3},{"id":"DiscrepCheck","label":"Discrepancies?","shape":"diamond","role":"","p":0},{"id":"Investigate","label":"Investigate & Adjust","shape":"rect","role":"","p":0},{"id":"BankDeposit","label":"Prepare Bank Deposit","shape":"rect","role":"","p":3},{"id":"Resolve","label":"Resolve Discrepancy","shape":"rect","role":"","p":0},{"id":"CloseDay","label":"Close Day","shape":"rect","role":"","p":4},{"id":"DailyReport","label":"Generate Daily Report","shape":"rect","role":"","p":3},{"id":"MonthCheck","label":"Month End?","shape":"diamond","role":"","p":4},{"id":"MonthClose","label":"Monthly Close","shape":"rect","role":"","p":4},{"id":"End","label":"Complete","shape":"round","role":"","p":0},{"id":"MonthRecon","label":"Full Reconciliation","shape":"rect","role":"","p":3},{"id":"FinReports","label":"Financial Reports","shape":"rect","role":"","p":4}],"edges":[{"from":"Start","to":"GenInvoice","label":"","dashed":false},{"from":"GenInvoice","to":"InvoiceDetails","label":"","dashed":false},{"from":"InvoiceDetails","to":"SendInvoice","label":"","dashed":false},{"from":"SendInvoice","to":"PaymentWait","label":"","dashed":false},{"from":"PaymentWait","to":"OnlineFlow","label":"Online","dashed":false},{"from":"PaymentWait","to":"CashFlow","label":"Cash","dashed":false},{"from":"PaymentWait","to":"BankFlow","label":"Transfer","dashed":false},{"from":"OnlineFlow","to":"PayGateway","label":"","dashed":false},{"from":"PayGateway","to":"GatewayProcess","label":"","dashed":false},{"from":"GatewayProcess","to":"Webhook","label":"","dashed":false},{"from":"Webhook","to":"VerifyWebhook","label":"","dashed":false},{"from":"VerifyWebhook","to":"RecordPayment","label":"","dashed":false},{"from":"CashFlow","to":"ReceiveCash","label":"","dashed":false},{"from":"ReceiveCash","to":"CountCash","label":"","dashed":false},{"from":"CountCash","to":"RecordPayment","label":"","dashed":false},{"from":"BankFlow","to":"StudentTransfer","label":"","dashed":false},{"from":"StudentTransfer","to":"CheckStatement","label":"","dashed":false},{"from":"CheckStatement","to":"MatchTransaction","label":"","dashed":false},{"from":"MatchTransaction","to":"RecordPayment","label":"","dashed":false},{"from":"RecordPayment","to":"UpdateInvoice","label":"","dashed":false},{"from":"UpdateInvoice","to":"GenReceipt","label":"","dashed":false},{"from":"GenReceipt","to":"SendReceipt","label":"","dashed":false},{"from":"SendReceipt","to":"DailyRecon","label":"","dashed":false},{"from":"DailyRecon","to":"Reconcile","label":"Yes","dashed":false},{"from":"DailyRecon","to":"Continue","label":"No","dashed":false},{"from":"Reconcile","to":"CashCount","label":"","dashed":false},{"from":"CashCount","to":"CompareRecords","label":"","dashed":false},{"from":"CompareRecords","to":"DiscrepCheck","label":"","dashed":false},{"from":"DiscrepCheck","to":"Investigate","label":"Yes","dashed":false},{"from":"DiscrepCheck","to":"BankDeposit","label":"No","dashed":false},{"from":"Investigate","to":"Resolve","label":"","dashed":false},{"from":"Resolve","to":"BankDeposit","label":"","dashed":false},{"from":"BankDeposit","to":"CloseDay","label":"","dashed":false},{"from":"CloseDay","to":"DailyReport","label":"","dashed":false},{"from":"DailyReport","to":"MonthCheck","label":"","dashed":false},{"from":"MonthCheck","to":"MonthClose","label":"Yes","dashed":false},{"from":"MonthCheck","to":"End","label":"No","dashed":false},{"from":"MonthClose","to":"MonthRecon","label":"","dashed":false},{"from":"MonthRecon","to":"FinReports","label":"","dashed":false},{"from":"FinReports","to":"End","label":"","dashed":false},{"from":"Continue","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-03-financial-operations\">💰 WF-03: Financial Operations\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §3 · \u003cb>Scope\u003c/b>: ✅ MVP\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_03\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - Revenue Operations \u003cbr> \u003cb>Phases\u003c/b>: 5 stages \u003cbr> \u003cb>Duration\u003c/b>: Varies (1 hour - 5 days) \u003cbr> \u003cb>Frequency\u003c/b>: Daily \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Included\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Financial Operations workflow covers complete revenue cycle từ invoice generation đến payment collection, reconciliation, và reporting. Ensures accurate financial records và timely collections.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Direct revenue impact\u003c/li>\u003cli>Cash flow management\u003c/li>\u003cli>Financial compliance\u003c/li>\u003cli>Audit trail maintenance\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-1-invoice-generation-automated\">Phase 1: Invoice Generation (Automated)\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Create accurate invoice immediately after enrollment\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: Enrollment record created and confirmed\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: System (automated), \u003cspan class=\"wl\">Finance Officer\u003c/span> (verification)\u003c/p>\n\u003cp>\u003cb>Process\u003c/b>:\u003c/p>\n\u003col start=\"1\">\u003cli>\u003cb>Trigger Event\u003c/b>:\u003col start=\"1\">\u003cli>Student enrolled in class by \u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/li>\u003cli>Enrollment status: \u003ccode>Pending Payment\u003c/code>\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>2. \u003cb>Auto-Generate Invoice\u003c/b>:    ```typescript    async function generateInvoice(enrollmentId: string) {      const enrollment = await Enrollment.findOne(enrollmentId);      const class = await Class.findOne(enrollment.class_id);      const program = await Program.findOne(class.program_id);\u003c/p>\n\u003cp>     const invoice = {        invoice_number: generateInvoiceNumber(), // INV-2024-XXXX        enrollment_id: enrollmentId,        student\u003ci>id: enrollment.student\u003c/i>id,        branch\u003ci>id: class.branch\u003c/i>id,        issue_date: new Date(),        due_date: addDays(new Date(), 7), // 7 days to pay\u003c/p>\n\u003cp>       line_items: [          {            description: \u003ccode>Tuition - ${program.name}\u003c/code>,            quantity: 1,            unit\u003ci>price: program.tuition\u003c/i>fee,            amount: program.tuition_fee          },          {            description: 'Registration Fee',            quantity: 1,            unit_price: 500000,            amount: 500000          },          {            description: 'Learning Materials',            quantity: 1,            unit_price: 300000,            amount: 300000          }        ],\u003c/p>\n\u003cp>       subtotal: calculateSubtotal(),        discount: applyDiscount(enrollment.promotion_code),        tax: 0, // Educational services VAT-exempt in Vietnam        total: calculateTotal(),\u003c/p>\n\u003cp>       status: 'pending',        payment_method: null,        paid_amount: 0      };\u003c/p>\n\u003cp>     await Invoice.create(invoice);      await sendInvoiceEmail(invoice);\u003c/p>\n\u003cp>     return invoice;    }    ```\u003c/p>\n\u003cp>3. \u003cb>Invoice Details\u003c/b>:    ```    INVOICE #INV-2024-0234    Date: 2024-08-25    Due: 2024-09-01\u003c/p>\n\u003cp>   Bill To:    Nguyen Van A    Email: nguyenvana@email.com    Phone: 0912-345-678\u003c/p>\n\u003cp>   Description                    Amount    ─────────────────────────────────────    English Intermediate Program  5,000,000 VND    Registration Fee                500,000 VND    Learning Materials              300,000 VND    ─────────────────────────────────────    Subtotal                      5,800,000 VND    Discount (Early Bird -10%)     -580,000 VND    ─────────────────────────────────────    TOTAL DUE                     5,220,000 VND\u003c/p>\n\u003cp>   Payment due by: September 1, 2024    ```\u003c/p>\n\u003col start=\"1\">\u003cli>\u003cb>Send to Student\u003c/b>:\u003col start=\"1\">\u003cli>Email with PDF attachment\u003c/li>\u003cli>SMS with payment link (if configured)\u003c/li>\u003cli>Available in student portal\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Invoice generated within 1 minute of enrollment\u003c/li>\u003cli>All line items accurate\u003c/li>\u003cli>Discounts applied correctly\u003c/li>\u003cli>Student receives invoice immediately\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"phase-2-payment-collection-multiple-methods\">Phase 2: Payment Collection (Multiple Methods)\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Collect payment through convenient channels\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Finance Officer\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>, Payment Gateway\u003c/p>\n\u003ch3 id=\"method-a-online-payment-60-of-payments\">Method A: Online Payment (60% of payments)\u003c/h3>\n\u003cp>\u003cb>Flow\u003c/b>:\u003c/p>\u003cp>1. Student clicks \"Pay Online\" in email or portal 2. System generates payment URL:    ```typescript    const paymentLink = await generateVNPayLink({      invoice_id: 'INV-2024-0234',      amount: 5220000,      description: 'Học phí English Intermediate',      return_url: 'https://lms.school.vn/payment/return',      notify_url: 'https://lms.school.vn/api/webhooks/vnpay'    });    ``` 3. Redirect to VNPay/Momo gateway 4. Student enters payment details:    - Bank account / Card    - OTP verification 5. Gateway processes payment 6. Gateway sends webhook to LMS 7. LMS validates webhook signature:    ```typescript    function validateWebhook(data: any, signature: string) {      const secretKey = process.env.VNPAY\u003ci>SECRET\u003c/i>KEY;      const computedSignature = crypto        .createHmac('sha256', secretKey)        .update(JSON.stringify(data))        .digest('hex');\u003c/p>\n\u003cp>     return computedSignature === signature;    }    ```\u003c/p>\u003col start=\"1\">\u003cli>If valid, record payment\u003c/li>\u003cli>Redirect student to success page\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Webhook Handling\u003c/b> (Idempotent):\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function handlePaymentWebhook(payload: WebhookPayload) {\n  // Check if already processed\n  const existing = await PaymentTransaction.findOne({\n    gateway_transaction_id: payload.transaction_id\n  });\n  \n  if (existing) {\n    return { status: 'already_processed' }; // Idempotent\n  }\n  \n  // Validate signature\n  if (!validateWebhook(payload.data, payload.signature)) {\n    throw new Error('Invalid signature');\n  }\n  \n  // Record payment\n  const payment = await PaymentTransaction.create({\n    invoice_id: payload.invoice_id,\n    amount: payload.amount,\n    payment_method: 'online_vnpay',\n    gateway_transaction_id: payload.transaction_id,\n    status: 'completed',\n    paid_at: new Date()\n  });\n  \n  // Update invoice\n  await updateInvoiceStatus(payload.invoice_id, payment.amount);\n  \n  // Generate receipt\n  await generateReceipt(payment.id);\n  \n  return { status: 'success' };\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch3 id=\"method-b-cash-payment-25-of-payments\">Method B: Cash Payment (25% of payments)\u003c/h3>\n\u003cp>\u003cb>Flow\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Student comes to branch with cash\u003c/li>\u003cli>\u003cspan class=\"wl\">Finance Officer\u003c/span> or \u003cspan class=\"wl\">Receptionist\u003c/span> receives payment:\u003col start=\"1\">\u003cli>Navigate to \u003cb>Finance → Record Payment\u003c/b>\u003c/li>\u003cli>Search invoice: \u003ccode>INV-2024-0234\u003c/code>\u003c/li>\u003cli>Verify student identity\u003c/li>\u003cli>Count cash carefully\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Cash Handling\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface CashTransaction {\n  date: Date;\n  receipt_number: string;\n  student_name: string;\n  amount: number;\n  received_by: string;\n  notes: string;\n}\n\n// Cash log example\n{\n  date: '2024-08-25',\n  receipt_number: 'RCP-2024-0156',\n  student_name: 'Nguyen Van A',\n  amount: 5220000,\n  received_by: 'Ms. Lan (Finance)',\n  notes: 'English Intermediate tuition'\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch3 id=\"method-c-bank-transfer-15-of-payments\">Method C: Bank Transfer (15% of payments)\u003c/h3>\n\u003cp>\u003cb>Flow\u003c/b>:\u003c/p>\u003cp>1. Student transfers money to school bank account 2. Include invoice number in transfer description 3. \u003cspan class=\"wl\">Finance Officer\u003c/span> checks bank statement daily:    - Download bank statement CSV    - Navigate to \u003cb>Finance → Reconciliation → Bank Transfer\u003c/b>    - Upload statement 4. System auto-matches transactions:    ```typescript    function matchBankTransfer(transaction: BankTransaction) {      // Try to find invoice number in description      const invoiceMatch = transaction.description.match(/INV-\\d{4}-\\d{4}/);\u003c/p>\n\u003cp>     if (invoiceMatch) {        return Invoice.findOne({ invoice_number: invoiceMatch[0] });      }\u003c/p>\n\u003cp>     // Try to match by amount and date range      return Invoice.findOne({        total: transaction.amount,        issue_date: Between(          subtractDays(transaction.date, 7),          transaction.date        ),        status: 'pending'      });    }    ```\u003c/p>\u003col start=\"1\">\u003cli>Review matched và unmatched transactions\u003c/li>\u003cli>For unmatched:\u003col start=\"1\">\u003cli>Manually search by student name\u003c/li>\u003cli>Call student to confirm\u003c/li>\u003cli>Match manually\u003c/li>\u003c/ol>\u003c/li>\u003cli>Generate receipts\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"phase-3-payment-recording-receipt-generation\">Phase 3: Payment Recording &amp; Receipt Generation\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Accurately record payment and provide proof\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: System, \u003cspan class=\"wl\">Finance Officer\u003c/span>\u003c/p>\n\u003cp>\u003cb>Recording Payment\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function recordPayment(data: PaymentData) {\n  // Start transaction\n  await db.transaction(async (trx) =&gt; {\n    // 1. Create payment record\n    const payment = await PaymentTransaction.create({\n      invoice_id: data.invoice_id,\n      amount: data.amount,\n      payment_method: data.method,\n      reference_number: data.reference,\n      paid_at: new Date(),\n      recorded_by: data.user_id\n    }, { transaction: trx });\n    \n    // 2. Update invoice\n    const invoice = await Invoice.findOne(data.invoice_id);\n    invoice.paid_amount += data.amount;\n    \n    if (invoice.paid_amount &gt;= invoice.total) {\n      invoice.status = 'paid';\n      invoice.paid_at = new Date();\n    } else if (invoice.paid_amount &gt; 0) {\n      invoice.status = 'partially_paid';\n    }\n    \n    await invoice.save({ transaction: trx });\n    \n    // 3. Update enrollment status\n    if (invoice.status === 'paid') {\n      const enrollment = await Enrollment.findOne({\n        id: invoice.enrollment_id\n      });\n      enrollment.status = 'active';\n      await enrollment.save({ transaction: trx });\n      \n      // Activate student access\n      await activateStudentAccess(enrollment.student_id);\n    }\n    \n    // 4. Generate receipt\n    const receipt = await generateReceipt({\n      payment_id: payment.id,\n      invoice_id: invoice.id\n    }, { transaction: trx });\n    \n    // 5. Send receipt\n    await sendReceiptEmail(receipt);\n    \n    // 6. Log audit trail\n    await AuditLog.create({\n      action: 'payment_recorded',\n      entity: 'payment',\n      entity_id: payment.id,\n      user_id: data.user_id,\n      details: {\n        amount: data.amount,\n        method: data.method,\n        invoice: invoice.invoice_number\n      }\n    }, { transaction: trx });\n    \n    return { payment, receipt };\n  });\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Receipt Generation\u003c/b> (PDF):\u003c/p>\u003cpre>\u003ccode class=\"lang-txt\">╔═══════════════════════════════════════════════╗\n║           OFFICIAL RECEIPT                    ║\n║       [School Name &amp; Logo]                    ║\n╠═══════════════════════════════════════════════╣\n║                                               ║\n║  Receipt No: RCP-2024-0156                    ║\n║  Date: August 25, 2024                        ║\n║  Payment Method: Cash                         ║\n║                                               ║\n║  Received From:                               ║\n║  Nguyen Van A                                 ║\n║  Email: nguyenvana@email.com                  ║\n║                                               ║\n║  For:                                         ║\n║  Invoice #INV-2024-0234                       ║\n║  English Intermediate Program                 ║\n║                                               ║\n║  Amount: 5,220,000 VND                        ║\n║  (Five million two hundred twenty thousand    ║\n║   Vietnamese Dong)                            ║\n║                                               ║\n║  ─────────────────────────────────────────   ║\n║  Received by: ____________                    ║\n║  Finance Officer                              ║\n║                                               ║\n║  [School Stamp]                               ║\n║                                               ║\n║  Thank you for your payment!                  ║\n╚═══════════════════════════════════════════════╝\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-4-daily-reconciliation\">Phase 4: Daily Reconciliation\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Ensure all transactions recorded accurately\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Finance Officer\u003c/span>\u003c/p>\n\u003cp>\u003cb>Daily Reconciliation Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Step 1: Cash Reconciliation\u003c/b>\u003c/p>\u003cp>1. Navigate to \u003cb>Finance → Daily Close\u003c/b> 2. Count physical cash in drawer 3. Compare with system records:    ```    Opening Balance:     500,000 VND\u003c/p>\n\u003cp>   Today's Collections:    RCP-001: 5,220,000 VND    RCP-002: 3,000,000 VND    RCP-003: 4,500,000 VND    Total Collected:    12,720,000 VND\u003c/p>\n\u003cp>   Expected Balance:   13,220,000 VND    Actual Count:       13,220,000 VND    Variance:                0 VND ✓    ```\u003c/p>\u003col start=\"1\">\u003cli>If variance exists:\u003col start=\"1\">\u003cli>Recount carefully\u003c/li>\u003cli>Check receipts for errors\u003c/li>\u003cli>Review cash log\u003c/li>\u003cli>Document discrepancy\u003c/li>\u003cli>Report to \u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 2: Online Payment Reconciliation\u003c/b>\u003c/p>\u003cp>1. Export online payments from system 2. Compare with gateway dashboard 3. Match transactions:    ```    System Record          Gateway Record      Status    ───────────────────────────────────────────────────    5,220,000 VND         5,220,000 VND       ✓ Matched    3,000,000 VND         3,000,000 VND       ✓ Matched    4,500,000 VND         [Missing]           ⚠️ Investigate    [None]                2,000,000 VND       ⚠️ Not recorded    ``` 4. For mismatches:    - Check webhook logs    - Query gateway API for status    - Manual reconciliation if needed\u003c/p>\n\u003cp>\u003cb>Step 3: Bank Deposit\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Prepare cash for deposit:\u003col start=\"1\">\u003cli>Total cash: 13,220,000 VND\u003c/li>\u003cli>Keep petty cash: 500,000 VND\u003c/li>\u003cli>Deposit amount: 12,720,000 VND\u003c/li>\u003c/ol>\u003c/li>\u003cli>Deposit at bank\u003c/li>\u003cli>Record deposit in system:\u003col start=\"1\">\u003cli>Date: Today\u003c/li>\u003cli>Amount: 12,720,000 VND\u003c/li>\u003cli>Bank: VCB Account XXX\u003c/li>\u003cli>Deposit slip: Photo/scan\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 4: Generate Daily Report\u003c/b>\u003c/p>\u003cpre>\u003ccode class=\"lang-txt\">DAILY FINANCIAL REPORT\nDate: August 25, 2024\nBranch: HN Central\n\nREVENUE BREAKDOWN:\nCash Payments:          12,720,000 VND (3 transactions)\nOnline Payments:         8,220,000 VND (2 transactions)\nBank Transfers:          5,000,000 VND (1 transaction)\n──────────────────────────────────────────────\nTotal Revenue:          25,940,000 VND\n\nOUTSTANDING INVOICES:\nPending Payment:        18 invoices, 89,500,000 VND\nOverdue (1-7 days):      5 invoices, 23,000,000 VND\nOverdue (&gt;7 days):       2 invoices,  9,500,000 VND\n\nRECONCILIATION STATUS:\nCash: ✓ Balanced\nOnline: ✓ Balanced\nBank: ⏳ Pending confirmation\n\nPrepared by: Ms. Lan (Finance Officer)\nReviewed by: _______________ (Branch Manager)\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-5-monthly-close-reporting\">Phase 5: Monthly Close &amp; Reporting\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Consolidated financial reporting and analysis\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Accountant\u003c/span>, \u003cspan class=\"wl\">Finance Officer\u003c/span>, \u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/p>\n\u003cp>\u003cb>Monthly Close Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Week 1 of New Month\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Day 1-2: Collection &amp; Verification\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>\u003cspan class=\"wl\">Accountant\u003c/span> requests data from \u003cspan class=\"wl\">Finance Officer\u003c/span>s:\u003col start=\"1\">\u003cli>All invoices issued\u003c/li>\u003cli>All payments received\u003c/li>\u003cli>Bank statements\u003c/li>\u003cli>Reconciliation reports\u003c/li>\u003c/ol>\u003c/li>\u003cli>Request corrections for discrepancies\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Day 3-4: Reconciliation\u003c/b>\u003c/p>\u003cp>1. Full month reconciliation:    ```typescript    async function monthlyReconciliation(month: string) {      const invoices = await Invoice.find({        issue_date: Between(startOfMonth, endOfMonth)      });\u003c/p>\n\u003cp>     const payments = await PaymentTransaction.find({        paid_at: Between(startOfMonth, endOfMonth)      });\u003c/p>\n\u003cp>     const report = {        total_invoiced: sum(invoices.map(i =&gt; i.total)),        total_collected: sum(payments.map(p =&gt; p.amount)),        outstanding: calculateOutstanding(invoices, payments),\u003c/p>\n\u003cp>       by\u003ci>branch: groupBy(invoices, 'branch\u003c/i>id'),        by\u003ci>program: groupBy(invoices, 'program\u003c/i>id'),        by\u003ci>payment\u003c/i>method: groupBy(payments, 'payment_method'),\u003c/p>\n\u003cp>       collection\u003ci>rate: (total\u003c/i>collected / total_invoiced) * 100      };\u003c/p>\n\u003cp>     return report;    }    ```\u003c/p>\n\u003col start=\"1\">\u003cli>Identify variances:\u003col start=\"1\">\u003cli>Uncollected receivables\u003c/li>\u003cli>Unreconciled transactions\u003c/li>\u003cli>Refunds processed\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Day 5: Financial Statements\u003c/b>\u003c/p>\u003cp>1. Generate P&amp;L (Profit &amp; Loss):    ```    PROFIT &amp; LOSS STATEMENT    Month: August 2024\u003c/p>\n\u003cp>   REVENUE:    Tuition Revenue              285,000,000 VND    Registration Fees             12,500,000 VND    Materials Sales                8,200,000 VND    ───────────────────────────────────────────    Total Revenue               305,700,000 VND\u003c/p>\n\u003cp>   COST OF REVENUE:    Teacher Salaries             120,000,000 VND    Teaching Materials             5,200,000 VND    ───────────────────────────────────────────    Gross Profit                180,500,000 VND\u003c/p>\n\u003cp>   OPERATING EXPENSES:    Staff Salaries                45,000,000 VND    Rent &amp; Utilities              25,000,000 VND    Marketing                     12,000,000 VND    Administrative                 8,000,000 VND    ───────────────────────────────────────────    Total Operating Exp          90,000,000 VND\u003c/p>\n\u003cp>   NET PROFIT                   90,500,000 VND    Net Margin                        29.6%    ```\u003c/p>\n\u003col start=\"1\">\u003cli>Generate Balance Sheet\u003c/li>\u003cli>Generate Cash Flow Statement\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Day 6-7: Analysis &amp; Reporting\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Financial analysis:\u003col start=\"1\">\u003cli>Revenue trends\u003c/li>\u003cli>Collection efficiency\u003c/li>\u003cli>Cost analysis\u003c/li>\u003cli>Profitability by branch/program\u003c/li>\u003c/ol>\u003c/li>\u003cli>Present to \u003cspan class=\"wl\">Organization Admin\u003c/span> and \u003cspan class=\"wl\">Branch Manager\u003c/span>s\u003c/li>\u003cli>Discuss action items:\u003col start=\"1\">\u003cli>Collection improvements\u003c/li>\u003cli>Cost optimizations\u003c/li>\u003cli>Growth opportunities\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"payment-collection\">Payment Collection\u003c/h3>\u003cul>\u003cli>\u003cb>Collection Rate\u003c/b>: 92% (Target: 90%+)\u003c/li>\u003cli>\u003cb>Payment Success Rate\u003c/b>: 98% (Target: 95%+)\u003c/li>\u003cli>\u003cb>Average Days to Collect\u003c/b>: 4 days (Target: &lt;7 days)\u003c/li>\u003c/ul>\n\u003ch3 id=\"accuracy\">Accuracy\u003c/h3>\u003cul>\u003cli>\u003cb>Reconciliation Accuracy\u003c/b>: 99.8% (Target: 99%+)\u003c/li>\u003cli>\u003cb>Invoice Error Rate\u003c/b>: 0.2% (Target: &lt;1%)\u003c/li>\u003cli>\u003cb>Payment Recording Errors\u003c/b>: &lt;0.1% (Target: &lt;0.5%)\u003c/li>\u003c/ul>\n\u003ch3 id=\"efficiency\">Efficiency\u003c/h3>\u003cul>\u003cli>\u003cb>Time to Issue Invoice\u003c/b>: &lt;1 min (Target: &lt;5 min)\u003c/li>\u003cli>\u003cb>Time to Record Payment\u003c/b>: 3 min (Target: &lt;5 min)\u003c/li>\u003cli>\u003cb>Time to Issue Receipt\u003c/b>: &lt;1 min (Target: &lt;2 min)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-01 Enrollment Journey\u003c/span> - Invoice generation trigger\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-11 Monthly Financial Close\u003c/span> - Detailed month-end process\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-12 Refund Processing\u003c/span> - Handling refunds\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Finance Officer\u003c/span> - Primary processor\u003c/li>\u003cli>\u003cspan class=\"wl\">Accountant\u003c/span> - Reporting and analysis\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> - Oversight and approvals\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - Payment source\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Finance Officer, Accountant \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_03","file":"WF-04 HR & Payroll.md","title":"WF-04: HR & Payroll","category":"addon","phases":[{"title":"Daily Attendance & Time Tracking","objective":"Record employee work hours accurately","trigger":"","actors":["Employees, HR Manager, System"],"actions":[],"criteria":[]},{"title":"Leave Management","objective":"Handle leave requests efficiently","trigger":"","actors":["Employee, HR Manager, Branch Manager"],"actions":["Review request details","Check impact","Decision"],"criteria":[]},{"title":"Monthly Payroll Calculation","objective":"Calculate accurate salaries for all employees","trigger":"","actors":["Payroll Officer, HR Manager, Accountant"],"actions":[],"criteria":[]},{"title":"Payment & Closing","objective":"Execute payment and close payroll cycle","trigger":"","actors":["Step 1: Review & Approve** (Day 7)","HR Manager reviews all payslips","Check for:","Calculation accuracy","Policy compliance","Unusual amounts","Request corrections if needed","Approve payroll run","Step 2: Prepare Payment File** (Day 8)","Step 3: Execute Payment** (Day 9-10)","Finance Officer downloads payment file","Login to corporate banking","Upload payment file","Review summary:","Authori"],"actions":["Check for","Review summary","Update system","System sends email to all employees"],"criteria":[]}],"estimated":"Monthly cycle","scope":"P3","nodes":[{"id":"Start","label":"Month Begins","shape":"round","role":"","p":0},{"id":"DailyAtt","label":"Daily Attendance","shape":"rect","role":"","p":0},{"id":"CheckIn","label":"Check In/Out","shape":"rect","role":"","p":1},{"id":"TeachHours","label":"Log Teaching Hours","shape":"rect","role":"","p":0},{"id":"LeaveReq","label":"Leave Request?","shape":"diamond","role":"","p":1},{"id":"ReviewLeave","label":"Manager Review","shape":"rect","role":"","p":1},{"id":"Continue","label":"Continue Work","shape":"rect","role":"","p":0},{"id":"LeaveApprove","label":"Approved?","shape":"diamond","role":"","p":0},{"id":"DeductLeave","label":"Deduct Leave Balance","shape":"rect","role":"","p":1},{"id":"Notify","label":"Notify Employee","shape":"rect","role":"","p":0},{"id":"NextDay","label":"Next Day?","shape":"diamond","role":"","p":0},{"id":"MonthEnd","label":"Month-End Processing","shape":"rect","role":"","p":0},{"id":"CollectData","label":"Collect Attendance Data","shape":"rect","role":"","p":0},{"id":"CalcHours","label":"Calculate Total Hours","shape":"rect","role":"","p":0},{"id":"CalcSalary","label":"Calculate Salaries","shape":"rect","role":"","p":2},{"id":"BaseCalc","label":"Base Salary","shape":"rect","role":"","p":0},{"id":"HourlyCalc","label":"Teaching Hours × Rate","shape":"rect","role":"","p":0},{"id":"BonusCalc","label":"Bonuses & Allowances","shape":"rect","role":"","p":0},{"id":"DeductCalc","label":"Deductions","shape":"rect","role":"","p":0},{"id":"Insurance","label":"Insurance","shape":"rect","role":"","p":0},{"id":"Tax","label":"Tax","shape":"rect","role":"","p":0},{"id":"Other","label":"Other Deductions","shape":"rect","role":"","p":0},{"id":"NetCalc","label":"Calculate Net Pay","shape":"rect","role":"","p":2},{"id":"GenPayslip","label":"Generate Payslips","shape":"rect","role":"","p":0},{"id":"HRReview","label":"HR Manager Review","shape":"rect","role":"","p":1},{"id":"ReviewOK","label":"Approved?","shape":"diamond","role":"","p":0},{"id":"SendPayslips","label":"Send Payslips","shape":"rect","role":"","p":0},{"id":"PrepPayment","label":"Prepare Payment","shape":"rect","role":"","p":3},{"id":"BankTransfer","label":"Bank Transfer","shape":"rect","role":"","p":0},{"id":"ConfirmPaid","label":"Confirm Payment","shape":"rect","role":"","p":3},{"id":"ClosePayroll","label":"Close Payroll","shape":"rect","role":"","p":2},{"id":"Archive","label":"Archive Records","shape":"rect","role":"","p":0},{"id":"End","label":"Complete","shape":"round","role":"","p":0}],"edges":[{"from":"Start","to":"DailyAtt","label":"","dashed":false},{"from":"DailyAtt","to":"CheckIn","label":"","dashed":false},{"from":"CheckIn","to":"TeachHours","label":"","dashed":false},{"from":"TeachHours","to":"LeaveReq","label":"","dashed":false},{"from":"LeaveReq","to":"ReviewLeave","label":"Yes","dashed":false},{"from":"LeaveReq","to":"Continue","label":"No","dashed":false},{"from":"ReviewLeave","to":"LeaveApprove","label":"","dashed":false},{"from":"LeaveApprove","to":"DeductLeave","label":"Yes","dashed":false},{"from":"LeaveApprove","to":"Notify","label":"No","dashed":false},{"from":"DeductLeave","to":"Continue","label":"","dashed":false},{"from":"Notify","to":"Continue","label":"","dashed":false},{"from":"Continue","to":"NextDay","label":"","dashed":false},{"from":"NextDay","to":"DailyAtt","label":"Yes","dashed":false},{"from":"NextDay","to":"MonthEnd","label":"Month End","dashed":false},{"from":"MonthEnd","to":"CollectData","label":"","dashed":false},{"from":"CollectData","to":"CalcHours","label":"","dashed":false},{"from":"CalcHours","to":"CalcSalary","label":"","dashed":false},{"from":"CalcSalary","to":"BaseCalc","label":"","dashed":false},{"from":"BaseCalc","to":"HourlyCalc","label":"","dashed":false},{"from":"HourlyCalc","to":"BonusCalc","label":"","dashed":false},{"from":"BonusCalc","to":"DeductCalc","label":"","dashed":false},{"from":"DeductCalc","to":"Insurance","label":"","dashed":false},{"from":"Insurance","to":"Tax","label":"","dashed":false},{"from":"Tax","to":"Other","label":"","dashed":false},{"from":"Other","to":"NetCalc","label":"","dashed":false},{"from":"NetCalc","to":"GenPayslip","label":"","dashed":false},{"from":"GenPayslip","to":"HRReview","label":"","dashed":false},{"from":"HRReview","to":"ReviewOK","label":"","dashed":false},{"from":"ReviewOK","to":"CalcSalary","label":"Changes Needed","dashed":false},{"from":"ReviewOK","to":"SendPayslips","label":"Approved","dashed":false},{"from":"SendPayslips","to":"PrepPayment","label":"","dashed":false},{"from":"PrepPayment","to":"BankTransfer","label":"","dashed":false},{"from":"BankTransfer","to":"ConfirmPaid","label":"","dashed":false},{"from":"ConfirmPaid","to":"ClosePayroll","label":"","dashed":false},{"from":"ClosePayroll","to":"Archive","label":"","dashed":false},{"from":"Archive","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-04-hr-payroll\">💼 WF-04: HR &amp; Payroll\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §4 · \u003cb>Scope\u003c/b>: 🚧 Roadmap P3 (Addon HRM)\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_04\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: HR Operations (Addon) \u003cbr> \u003cb>Phases\u003c/b>: 4 recurring stages \u003cbr> \u003cb>Duration\u003c/b>: Monthly cycle \u003cbr> \u003cb>Frequency\u003c/b>: Monthly (payroll), Daily (attendance) \u003cbr> \u003cb>License Requirement\u003c/b>: HRM &amp; Payroll Addon\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>HR &amp; Payroll workflow quản lý employee lifecycle, attendance tracking, leave management, và monthly payroll processing. Đảm bảo accurate và timely compensation cho staff.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Employee satisfaction\u003c/li>\u003cli>Labor law compliance\u003c/li>\u003cli>Accurate cost tracking\u003c/li>\u003cli>Staff retention\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-1-daily-attendance-time-tracking\">Phase 1: Daily Attendance &amp; Time Tracking\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Record employee work hours accurately\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: Employees, \u003cspan class=\"wl\">HR Manager\u003c/span>, System\u003c/p>\n\u003cp>\u003cb>Daily Attendance Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>For Office Staff\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">// Check-in flow\nasync function checkIn(employeeId: string) {\n  const now = new Date();\n  const today = startOfDay(now);\n  \n  // Check if already checked in\n  const existing = await Attendance.findOne({\n    employee_id: employeeId,\n    date: today,\n    check_out: null\n  });\n  \n  if (existing) {\n    throw new Error('Already checked in');\n  }\n  \n  // Create attendance record\n  const attendance = await Attendance.create({\n    employee_id: employeeId,\n    date: today,\n    check_in: now,\n    status: 'present',\n    work_type: 'office'\n  });\n  \n  return attendance;\n}\n\n// Check-out flow\nasync function checkOut(employeeId: string) {\n  const now = new Date();\n  const today = startOfDay(now);\n  \n  const attendance = await Attendance.findOne({\n    employee_id: employeeId,\n    date: today,\n    check_out: null\n  });\n  \n  if (!attendance) {\n    throw new Error('No check-in found');\n  }\n  \n  // Calculate hours worked\n  const hoursWorked = differenceInHours(now, attendance.check_in);\n  \n  attendance.check_out = now;\n  attendance.hours_worked = hoursWorked;\n  await attendance.save();\n  \n  return attendance;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>For Teachers\u003c/b> (Teaching Hours):\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">// Log teaching hours after class\nasync function logTeachingHours(data: TeachingHoursData) {\n  const session = await ClassSession.findOne(data.session_id);\n  const teacher = await Employee.findOne(data.teacher_id);\n  \n  // Calculate hours (session duration)\n  const duration = differenceInHours(\n    session.end_time,\n    session.start_time\n  );\n  \n  const teachingHours = await TeachingHours.create({\n    employee_id: data.teacher_id,\n    class_id: session.class_id,\n    session_id: session.id,\n    date: session.date,\n    hours: duration,\n    hourly_rate: teacher.hourly_rate,\n    status: 'confirmed'\n  });\n  \n  return teachingHours;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Attendance Status\u003c/b>:\u003c/p>\u003cul>\u003cli>✅ \u003cb>Present\u003c/b>: Checked in on time\u003c/li>\u003cli>⏰ \u003cb>Late\u003c/b>: Checked in &gt;15 min after start time\u003c/li>\u003cli>❌ \u003cb>Absent\u003c/b>: No check-in\u003c/li>\u003cli>🏥 \u003cb>Sick Leave\u003c/b>: Approved sick leave\u003c/li>\u003cli>🏖️ \u003cb>Annual Leave\u003c/b>: Approved vacation\u003c/li>\u003cli>📅 \u003cb>Unpaid Leave\u003c/b>: Approved unpaid leave\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"phase-2-leave-management\">Phase 2: Leave Management\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Handle leave requests efficiently\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: Employee, \u003cspan class=\"wl\">HR Manager\u003c/span>, \u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/p>\n\u003cp>\u003cb>Leave Request Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Step 1: Employee Submits Request\u003c/b>\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface LeaveRequest {\n  employee_id: string;\n  leave_type: 'annual' | 'sick' | 'unpaid' | 'maternity' | 'emergency';\n  start_date: Date;\n  end_date: Date;\n  days_count: number;\n  reason: string;\n  status: 'pending' | 'approved' | 'rejected';\n  requested_at: Date;\n}\n\n// Submit leave request\nasync function submitLeaveRequest(data: LeaveRequestInput) {\n  const employee = await Employee.findOne(data.employee_id);\n  \n  // Check leave balance\n  if (data.leave_type === 'annual') {\n    const balance = await getLeaveBalance(employee.id);\n    if (balance &lt; data.days_count) {\n      throw new Error('Insufficient leave balance');\n    }\n  }\n  \n  // Check for conflicts\n  const conflicts = await Attendance.find({\n    employee_id: employee.id,\n    date: Between(data.start_date, data.end_date),\n    status: Not('absent')\n  });\n  \n  if (conflicts.length &gt; 0) {\n    throw new Error('Leave dates conflict with existing records');\n  }\n  \n  const request = await LeaveRequest.create({\n    ...data,\n    status: 'pending'\n  });\n  \n  // Notify manager\n  await notifyManager(employee.manager_id, request);\n  \n  return request;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Step 2: Manager Reviews\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>\u003cspan class=\"wl\">HR Manager\u003c/span> or \u003cspan class=\"wl\">Branch Manager\u003c/span> receives notification\u003c/li>\u003cli>Review request details:\u003col start=\"1\">\u003cli>Employee: Nguyen Van B\u003c/li>\u003cli>Type: Annual Leave\u003c/li>\u003cli>Dates: Sep 15-20 (5 days)\u003c/li>\u003cli>Reason: Family vacation\u003c/li>\u003cli>Balance: 8 days remaining\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 3: Apply Leave\u003c/b>\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function approveLeave(requestId: string, approverId: string) {\n  const request = await LeaveRequest.findOne(requestId);\n  const employee = await Employee.findOne(request.employee_id);\n  \n  // Update request status\n  request.status = 'approved';\n  request.approved_by = approverId;\n  request.approved_at = new Date();\n  await request.save();\n  \n  // Create attendance records for leave days\n  const dates = getDatesInRange(request.start_date, request.end_date);\n  \n  for (const date of dates) {\n    await Attendance.create({\n      employee_id: employee.id,\n      date: date,\n      status: request.leave_type,\n      hours_worked: 0,\n      note: `Leave: ${request.reason}`\n    });\n  }\n  \n  // Deduct from leave balance\n  if (request.leave_type === 'annual') {\n    employee.leave_balance -= request.days_count;\n    await employee.save();\n  }\n  \n  // Notify employee\n  await notifyEmployee(employee.id, 'Leave request approved');\n  \n  return request;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-3-monthly-payroll-calculation\">Phase 3: Monthly Payroll Calculation\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Calculate accurate salaries for all employees\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Payroll Officer\u003c/span>, \u003cspan class=\"wl\">HR Manager\u003c/span>, \u003cspan class=\"wl\">Accountant\u003c/span>\u003c/p>\n\u003cp>\u003cb>Payroll Calculation Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Step 1: Collect Attendance Data\u003c/b> (Day 1-2 of new month)\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function collectMonthlyAttendance(month: string, year: number) {\n  const startDate = new Date(year, month - 1, 1);\n  const endDate = endOfMonth(startDate);\n  \n  const attendance = await Attendance.find({\n    date: Between(startDate, endDate)\n  });\n  \n  // Group by employee\n  const byEmployee = groupBy(attendance, 'employee_id');\n  \n  const summary = {};\n  for (const [employeeId, records] of Object.entries(byEmployee)) {\n    summary[employeeId] = {\n      total_days: records.length,\n      present: records.filter(r =&gt; r.status === 'present').length,\n      late: records.filter(r =&gt; r.status === 'late').length,\n      absent: records.filter(r =&gt; r.status === 'absent').length,\n      leave: records.filter(r =&gt; r.status.includes('leave')).length,\n      hours_worked: sum(records.map(r =&gt; r.hours_worked))\n    };\n  }\n  \n  return summary;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Step 2: Calculate Salaries\u003c/b> (Day 3-5)\u003c/p>\n\u003cp>\u003cb>For Full-time Staff\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function calculateFullTimeSalary(employee: Employee, month: string) {\n  const attendance = await getMonthlyAttendance(employee.id, month);\n  const workingDays = 22; // Standard working days per month\n  \n  // Base salary (fixed)\n  let grossSalary = employee.base_salary;\n  \n  // Attendance deductions\n  const absentDays = attendance.absent + attendance.unpaid_leave;\n  const dailyRate = employee.base_salary / workingDays;\n  const absentDeduction = absentDays * dailyRate;\n  \n  grossSalary -= absentDeduction;\n  \n  // Allowances\n  const transportAllowance = 500000; // 500K VND/month\n  const mealAllowance = 750000; // 750K VND/month\n  grossSalary += transportAllowance + mealAllowance;\n  \n  // Bonuses\n  if (employee.performance_rating === 'excellent') {\n    grossSalary += employee.base_salary * 0.1; // 10% bonus\n  }\n  \n  // Calculate deductions\n  const socialInsurance = grossSalary * 0.08; // 8%\n  const healthInsurance = grossSalary * 0.015; // 1.5%\n  const unemploymentInsurance = grossSalary * 0.01; // 1%\n  \n  const totalInsurance = socialInsurance + healthInsurance + unemploymentInsurance;\n  \n  // Tax calculation (progressive)\n  const taxableIncome = grossSalary - totalInsurance - 11000000; // 11M personal deduction\n  const tax = calculateTax(taxableIncome);\n  \n  const netSalary = grossSalary - totalInsurance - tax;\n  \n  return {\n    employee_id: employee.id,\n    month: month,\n    base_salary: employee.base_salary,\n    allowances: transportAllowance + mealAllowance,\n    bonuses: 0,\n    gross_salary: grossSalary,\n    insurance_deductions: totalInsurance,\n    tax_deductions: tax,\n    other_deductions: 0,\n    net_salary: netSalary,\n    attendance_summary: attendance\n  };\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>For Teachers\u003c/b> (Base + Hourly):\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function calculateTeacherSalary(teacher: Employee, month: string) {\n  const attendance = await getMonthlyAttendance(teacher.id, month);\n  const teachingHours = await getTeachingHours(teacher.id, month);\n  \n  // Base salary\n  let grossSalary = teacher.base_salary;\n  \n  // Teaching hours compensation\n  const totalTeachingHours = sum(teachingHours.map(h =&gt; h.hours));\n  const hourlyEarnings = totalTeachingHours * teacher.hourly_rate;\n  \n  grossSalary += hourlyEarnings;\n  \n  // Performance bonus\n  const avgStudentRating = await getAvgStudentRating(teacher.id, month);\n  if (avgStudentRating &gt;= 4.5) {\n    grossSalary += 2000000; // 2M VND excellence bonus\n  }\n  \n  // Calculate deductions (same as full-time)\n  const { insurance, tax } = calculateDeductions(grossSalary);\n  \n  const netSalary = grossSalary - insurance - tax;\n  \n  return {\n    employee_id: teacher.id,\n    month: month,\n    base_salary: teacher.base_salary,\n    teaching_hours: totalTeachingHours,\n    hourly_rate: teacher.hourly_rate,\n    teaching_earnings: hourlyEarnings,\n    bonuses: avgStudentRating &gt;= 4.5 ? 2000000 : 0,\n    gross_salary: grossSalary,\n    insurance_deductions: insurance,\n    tax_deductions: tax,\n    net_salary: netSalary,\n    attendance_summary: attendance,\n    teaching_summary: {\n      total_hours: totalTeachingHours,\n      classes_taught: teachingHours.length,\n      avg_rating: avgStudentRating\n    }\n  };\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Vietnam Tax Brackets\u003c/b> (2024):\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">function calculateTax(taxableIncome: number): number {\n  if (taxableIncome &lt;= 0) return 0;\n  \n  const brackets = [\n    { limit: 5000000, rate: 0.05 },    // Up to 5M: 5%\n    { limit: 10000000, rate: 0.10 },   // 5M-10M: 10%\n    { limit: 18000000, rate: 0.15 },   // 10M-18M: 15%\n    { limit: 32000000, rate: 0.20 },   // 18M-32M: 20%\n    { limit: 52000000, rate: 0.25 },   // 32M-52M: 25%\n    { limit: 80000000, rate: 0.30 },   // 52M-80M: 30%\n    { limit: Infinity, rate: 0.35 }    // &gt;80M: 35%\n  ];\n  \n  let tax = 0;\n  let remaining = taxableIncome;\n  let previousLimit = 0;\n  \n  for (const bracket of brackets) {\n    const bracketAmount = Math.min(remaining, bracket.limit - previousLimit);\n    if (bracketAmount &lt;= 0) break;\n    \n    tax += bracketAmount * bracket.rate;\n    remaining -= bracketAmount;\n    previousLimit = bracket.limit;\n  }\n  \n  return Math.round(tax);\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Step 3: Generate Payslips\u003c/b> (Day 6)\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function generatePayslip(payrollData: PayrollData) {\n  const employee = await Employee.findOne(payrollData.employee_id);\n  \n  const payslip = await Payslip.create({\n    employee_id: employee.id,\n    month: payrollData.month,\n    year: payrollData.year,\n    \n    // Earnings\n    base_salary: payrollData.base_salary,\n    allowances: payrollData.allowances,\n    bonuses: payrollData.bonuses,\n    overtime: payrollData.overtime || 0,\n    teaching_earnings: payrollData.teaching_earnings || 0,\n    gross_salary: payrollData.gross_salary,\n    \n    // Deductions\n    social_insurance: payrollData.social_insurance,\n    health_insurance: payrollData.health_insurance,\n    unemployment_insurance: payrollData.unemployment_insurance,\n    tax: payrollData.tax,\n    other_deductions: payrollData.other_deductions || 0,\n    total_deductions: payrollData.total_deductions,\n    \n    // Net\n    net_salary: payrollData.net_salary,\n    \n    // Status\n    status: 'pending_approval',\n    generated_at: new Date()\n  });\n  \n  return payslip;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Payslip Template\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-txt\">╔════════════════════════════════════════════════╗\n║             PAYSLIP - September 2024           ║\n║          [School Name]                         ║\n╠════════════════════════════════════════════════╣\n║                                                ║\n║  Employee: Nguyen Van B                        ║\n║  ID: EMP-001                                   ║\n║  Position: English Teacher                     ║\n║  Department: Academic                          ║\n║  Bank Account: VCB 1234567890                  ║\n║                                                ║\n║  ──────────────────────────────────────────   ║\n║  EARNINGS                                      ║\n║  ──────────────────────────────────────────   ║\n║  Base Salary               8,000,000 VND       ║\n║  Teaching Hours (80h)     12,000,000 VND       ║\n║  Performance Bonus         2,000,000 VND       ║\n║  ──────────────────────────────────────────   ║\n║  Gross Salary             22,000,000 VND       ║\n║                                                ║\n║  ──────────────────────────────────────────   ║\n║  DEDUCTIONS                                    ║\n║  ──────────────────────────────────────────   ║\n║  Social Insurance (8%)     1,760,000 VND       ║\n║  Health Insurance (1.5%)     330,000 VND       ║\n║  Unemployment (1%)           220,000 VND       ║\n║  Personal Income Tax       1,850,000 VND       ║\n║  ──────────────────────────────────────────   ║\n║  Total Deductions          4,160,000 VND       ║\n║                                                ║\n║  ════════════════════════════════════════════ ║\n║  NET SALARY               17,840,000 VND       ║\n║  ════════════════════════════════════════════ ║\n║                                                ║\n║  Attendance: 22/22 days                        ║\n║  Teaching Hours: 80 hours                      ║\n║                                                ║\n║  Generated: September 30, 2024                 ║\n║  Payment Date: October 5, 2024                 ║\n║                                                ║\n╚════════════════════════════════════════════════╝\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-4-payment-closing\">Phase 4: Payment &amp; Closing\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Execute payment and close payroll cycle\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Payroll Officer\u003c/span>, \u003cspan class=\"wl\">HR Manager\u003c/span>, \u003cspan class=\"wl\">Finance Officer\u003c/span>\u003c/p>\n\u003cp>\u003cb>Step 1: Review &amp; Approve\u003c/b> (Day 7)\u003c/p>\u003col start=\"1\">\u003cli>\u003cspan class=\"wl\">HR Manager\u003c/span> reviews all payslips\u003c/li>\u003cli>Check for:\u003col start=\"1\">\u003cli>Calculation accuracy\u003c/li>\u003cli>Policy compliance\u003c/li>\u003cli>Unusual amounts\u003c/li>\u003c/ol>\u003c/li>\u003cli>Approve payroll run\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 2: Prepare Payment File\u003c/b> (Day 8)\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function generatePaymentFile(payrollRunId: string) {\n  const payslips = await Payslip.find({\n    payroll_run_id: payrollRunId,\n    status: 'approved'\n  });\n  \n  // Bank transfer format (CSV)\n  const paymentRecords = payslips.map(slip =&gt; ({\n    account_number: slip.employee.bank_account,\n    account_name: slip.employee.full_name,\n    amount: slip.net_salary,\n    reference: `Salary-${slip.month}-${slip.employee.employee_code}`,\n    bank_code: slip.employee.bank_code\n  }));\n  \n  const csv = generateCSV(paymentRecords);\n  \n  return {\n    file: csv,\n    total_amount: sum(paymentRecords.map(r =&gt; r.amount)),\n    employee_count: paymentRecords.length\n  };\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Step 3: Execute Payment\u003c/b> (Day 9-10)\u003c/p>\u003cp>1. \u003cspan class=\"wl\">Finance Officer\u003c/span> downloads payment file 2. Login to corporate banking 3. Upload payment file 4. Review summary:    ```    Payment Summary:    Number of transactions: 25    Total amount: 243,000,000 VND    Payment date: October 5, 2024    ``` 5. Authorize payment 6. Bank processes (may take 1-2 days) 7. Confirm all payments successful 8. Update system:    ```typescript    async function markPayrollPaid(payrollRunId: string) {      await Payslip.update(        { payroll\u003ci>run\u003c/i>id: payrollRunId },        {           status: 'paid',          paid_at: new Date(),          payment\u003ci>method: 'bank\u003c/i>transfer'        }      );    }    ```\u003c/p>\n\u003cp>\u003cb>Step 4: Send Payslips\u003c/b> (Day 10)\u003c/p>\u003cp>1. System sends email to all employees:    ```    Subject: Your Payslip for September 2024\u003c/p>\n\u003cp>   Dear [Name],\u003c/p>\n\u003cp>   Your salary for September 2024 has been processed    and transferred to your bank account.\u003c/p>\n\u003cp>   Please find attached your payslip.\u003c/p>\n\u003cp>   Net Amount: 17,840,000 VND    Payment Date: October 5, 2024\u003c/p>\n\u003cp>   If you have any questions, please contact HR.\u003c/p>\n\u003cp>   Best regards,    HR Department    ```\u003c/p>\u003col start=\"1\">\u003cli>Payslip PDF attached\u003c/li>\u003cli>Record delivery status\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 5: Close Payroll\u003c/b> (Day 11)\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function closePayrollRun(payrollRunId: string) {\n  const run = await PayrollRun.findOne(payrollRunId);\n  \n  // Verify all paid\n  const unpaid = await Payslip.count({\n    payroll_run_id: payrollRunId,\n    status: Not('paid')\n  });\n  \n  if (unpaid &gt; 0) {\n    throw new Error('Cannot close: unpaid payslips exist');\n  }\n  \n  // Mark as closed\n  run.status = 'closed';\n  run.closed_at = new Date();\n  run.closed_by = getCurrentUserId();\n  await run.save();\n  \n  // Archive records\n  await archivePayrollData(payrollRunId);\n  \n  // Generate final report\n  await generatePayrollReport(payrollRunId);\n  \n  return run;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"accuracy\">Accuracy\u003c/h3>\u003cul>\u003cli>\u003cb>Payroll Accuracy\u003c/b>: 99.9% (Target: 99%+)\u003c/li>\u003cli>\u003cb>Attendance Accuracy\u003c/b>: 99.5% (Target: 99%+)\u003c/li>\u003cli>\u003cb>Leave Balance Accuracy\u003c/b>: 100% (Target: 100%)\u003c/li>\u003c/ul>\n\u003ch3 id=\"timeliness\">Timeliness\u003c/h3>\u003cul>\u003cli>\u003cb>Payroll Processing Time\u003c/b>: 8 days (Target: &lt;10 days)\u003c/li>\u003cli>\u003cb>Payment Date Consistency\u003c/b>: 95% on-time (Target: 90%+)\u003c/li>\u003cli>\u003cb>Leave Request Response\u003c/b>: &lt;24 hours (Target: &lt;48 hours)\u003c/li>\u003c/ul>\n\u003ch3 id=\"compliance\">Compliance\u003c/h3>\u003cul>\u003cli>\u003cb>Tax Calculation Accuracy\u003c/b>: 100% (Target: 100%)\u003c/li>\u003cli>\u003cb>Insurance Compliance\u003c/b>: 100% (Target: 100%)\u003c/li>\u003cli>\u003cb>Labor Law Compliance\u003c/b>: 100% (Target: 100%)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-29 Recruitment Process\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-30 Performance Review Cycle\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-31 Leave Management\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-32 Monthly Payroll Run\u003c/span>\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">HR Manager\u003c/span> - Oversight and approval\u003c/li>\u003cli>\u003cspan class=\"wl\">Payroll Officer\u003c/span> - Processing\u003c/li>\u003cli>\u003cspan class=\"wl\">Finance Officer\u003c/span> - Payment execution\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> - Leave approvals\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: HR Manager, Payroll Officer \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_04","file":"WF-05 Online & Hybrid Learning.md","title":"WF-05: Online & Hybrid Learning Management","category":"critical","phases":[{"title":"Class Setup & Configuration","objective":"Configure class delivery mode and prepare resources","trigger":"","actors":["Academic Manager, Branch Manager, System Admin"],"actions":[],"criteria":[]},{"title":"Session Preparation (Per Session)","objective":"Prepare for each individual class session","trigger":"","actors":["Teacher, Students, System"],"actions":[],"criteria":[]},{"title":"Session Delivery","objective":"Conduct the actual class session","trigger":"","actors":["Teacher, Students, System"],"actions":[],"criteria":[]},{"title":"Emergency Mode Switch","objective":"Quickly switch from offline to online in emergency situations","trigger":"","actors":["Branch Manager, Academic Manager, System"],"actions":[],"criteria":[]},{"title":"Post-Session & Analytics","objective":"Process session data and provide insights","trigger":"","actors":["Teacher, Academic Manager, System"],"actions":[],"criteria":[]}],"estimated":"Varies by delivery mode","scope":"P2","nodes":[{"id":"Start","label":"Class Created","shape":"round","role":"","p":0},{"id":"SetMode","label":"Choose Delivery Mode","shape":"diamond","role":"","p":2},{"id":"OfflineSetup","label":"Setup Physical Class","shape":"rect","role":"","p":0},{"id":"OnlineSetup","label":"Setup Virtual Class","shape":"rect","role":"","p":0},{"id":"HybridSetup","label":"Setup Hybrid Class","shape":"rect","role":"","p":0},{"id":"FlexibleSetup","label":"Setup Flexible Class","shape":"rect","role":"","p":0},{"id":"AssignRoom","label":"Assign Physical Room","shape":"rect","role":"","p":0},{"id":"OfflineReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"ChoosePlatform","label":"Choose Platform","shape":"rect","role":"","p":0},{"id":"CreateMeeting","label":"Create Meeting Room","shape":"rect","role":"","p":0},{"id":"TestLink","label":"Test Meeting Link","shape":"rect","role":"","p":0},{"id":"OnlineReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"DefineSchedule","label":"Define Hybrid Schedule","shape":"rect","role":"","p":0},{"id":"HybridExample","label":"\"Mon/Wed: Online Tue/Thu: Offline\"","shape":"rect","role":"","p":3},{"id":"HybridReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"PrepBoth","label":"Prepare Both Options","shape":"rect","role":"","p":0},{"id":"FlexibleReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"SessionStart","label":"Session Day","shape":"rect","role":"","p":1},{"id":"SessionType","label":"Session Type?","shape":"diamond","role":"","p":1},{"id":"OfflineSession","label":"Physical Class","shape":"rect","role":"","p":0},{"id":"OnlineSession","label":"Virtual Class","shape":"rect","role":"","p":0},{"id":"TeacherArrive","label":"Teacher Arrives","shape":"rect","role":"","p":0},{"id":"SetupRoom","label":"Setup Room","shape":"rect","role":"","p":0},{"id":"AttendanceOffline","label":"Attendance","shape":"rect","role":"","p":0},{"id":"TeachOffline","label":"Teach","shape":"rect","role":"","p":0},{"id":"TeacherLogin","label":"Teacher Login","shape":"rect","role":"","p":0},{"id":"StartMeeting","label":"▶ Start Meeting","shape":"rect","role":"","p":0},{"id":"StartRecording","label":"Start Recording","shape":"rect","role":"","p":0},{"id":"AttendanceOnline","label":"Attendance from Meeting","shape":"rect","role":"","p":3},{"id":"TeachOnline","label":"Teach via Video","shape":"rect","role":"","p":0},{"id":"ClassEnd","label":"Class Ends","shape":"rect","role":"","p":0},{"id":"StopRecording","label":"Stop Recording","shape":"rect","role":"","p":0},{"id":"SaveRecording","label":"Save Recording","shape":"rect","role":"","p":0},{"id":"SessionNotes","label":"Session Notes","shape":"rect","role":"","p":1},{"id":"NextSession","label":"More Sessions?","shape":"diamond","role":"","p":0},{"id":"CourseComplete","label":"Course Complete","shape":"rect","role":"","p":0},{"id":"FinalReview","label":"Final Review","shape":"rect","role":"","p":0},{"id":"Analytics","label":"Analytics","shape":"rect","role":"","p":4},{"id":"End","label":"Complete","shape":"round","role":"","p":0},{"id":"EmergencySwitch","label":"Emergency Switch","shape":"rect","role":"","p":3},{"id":"QuickOnline","label":"Quick Online Setup","shape":"rect","role":"","p":0},{"id":"NotifyStudents","label":"Notify All Students","shape":"rect","role":"","p":0}],"edges":[{"from":"Start","to":"SetMode","label":"","dashed":false},{"from":"SetMode","to":"OfflineSetup","label":"Offline","dashed":false},{"from":"SetMode","to":"OnlineSetup","label":"Online","dashed":false},{"from":"SetMode","to":"HybridSetup","label":"Hybrid","dashed":false},{"from":"SetMode","to":"FlexibleSetup","label":"Flexible","dashed":false},{"from":"OfflineSetup","to":"AssignRoom","label":"","dashed":false},{"from":"AssignRoom","to":"OfflineReady","label":"","dashed":false},{"from":"OnlineSetup","to":"ChoosePlatform","label":"","dashed":false},{"from":"ChoosePlatform","to":"CreateMeeting","label":"","dashed":false},{"from":"CreateMeeting","to":"TestLink","label":"","dashed":false},{"from":"TestLink","to":"OnlineReady","label":"","dashed":false},{"from":"HybridSetup","to":"DefineSchedule","label":"","dashed":false},{"from":"DefineSchedule","to":"HybridExample","label":"","dashed":false},{"from":"HybridExample","to":"HybridReady","label":"","dashed":false},{"from":"FlexibleSetup","to":"PrepBoth","label":"","dashed":false},{"from":"PrepBoth","to":"FlexibleReady","label":"","dashed":false},{"from":"OfflineReady","to":"SessionStart","label":"","dashed":false},{"from":"OnlineReady","to":"SessionStart","label":"","dashed":false},{"from":"HybridReady","to":"SessionStart","label":"","dashed":false},{"from":"FlexibleReady","to":"SessionStart","label":"","dashed":false},{"from":"SessionStart","to":"SessionType","label":"","dashed":false},{"from":"SessionType","to":"OfflineSession","label":"Offline","dashed":false},{"from":"SessionType","to":"OnlineSession","label":"Online","dashed":false},{"from":"OfflineSession","to":"TeacherArrive","label":"","dashed":false},{"from":"TeacherArrive","to":"SetupRoom","label":"","dashed":false},{"from":"SetupRoom","to":"AttendanceOffline","label":"","dashed":false},{"from":"AttendanceOffline","to":"TeachOffline","label":"","dashed":false},{"from":"OnlineSession","to":"TeacherLogin","label":"","dashed":false},{"from":"TeacherLogin","to":"StartMeeting","label":"","dashed":false},{"from":"StartMeeting","to":"StartRecording","label":"","dashed":false},{"from":"StartRecording","to":"AttendanceOnline","label":"","dashed":false},{"from":"AttendanceOnline","to":"TeachOnline","label":"","dashed":false},{"from":"TeachOffline","to":"ClassEnd","label":"","dashed":false},{"from":"TeachOnline","to":"StopRecording","label":"","dashed":false},{"from":"StopRecording","to":"SaveRecording","label":"","dashed":false},{"from":"SaveRecording","to":"ClassEnd","label":"","dashed":false},{"from":"ClassEnd","to":"SessionNotes","label":"","dashed":false},{"from":"SessionNotes","to":"NextSession","label":"","dashed":false},{"from":"NextSession","to":"SessionStart","label":"Yes","dashed":false},{"from":"NextSession","to":"CourseComplete","label":"No","dashed":false},{"from":"CourseComplete","to":"FinalReview","label":"","dashed":false},{"from":"FinalReview","to":"Analytics","label":"","dashed":false},{"from":"Analytics","to":"End","label":"","dashed":false},{"from":"OfflineSession","to":"EmergencySwitch","label":"Emergency","dashed":true},{"from":"EmergencySwitch","to":"QuickOnline","label":"","dashed":false},{"from":"QuickOnline","to":"NotifyStudents","label":"","dashed":false},{"from":"NotifyStudents","to":"OnlineSession","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-05-online-hybrid-learning-management\">🎥 WF-05: Online &amp; Hybrid Learning Management\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §5 · \u003cb>Scope\u003c/b>: 🚧 Roadmap P2\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_05\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - Modern Learning Delivery \u003cbr> \u003cb>Phases\u003c/b>: 5 stages \u003cbr> \u003cb>Duration\u003c/b>: Ongoing (per class lifecycle) \u003cbr> \u003cb>Frequency\u003c/b>: Daily \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Phase 2 (Enhanced Features)\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Online &amp; Hybrid Learning workflow quản lý toàn bộ quy trình giảng dạy linh hoạt từ lớp offline truyền thống đến online hoàn toàn, bao gồm cả chế độ hybrid và flexible cho phép học viên tự chọn.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Mở rộng thị trường (học viên xa)\u003c/li>\u003cli>Linh hoạt trong khủng hoảng (COVID-19)\u003c/li>\u003cli>Tăng doanh thu (không giới hạn phòng học)\u003c/li>\u003cli>Học viên hài lòng hơn (linh hoạt)\u003c/li>\u003cli>Giảm chi phí cơ sở hạ tầng\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-1-class-setup-configuration\">Phase 1: Class Setup &amp; Configuration\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Configure class delivery mode and prepare resources\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Academic Manager\u003c/span>, \u003cspan class=\"wl\">Branch Manager\u003c/span>, \u003cspan class=\"wl\">System Admin\u003c/span>\u003c/p>\n\u003ch3 id=\"step-1-choose-delivery-mode\">Step 1: Choose Delivery Mode\u003c/h3>\n\u003cp>Khi tạo class mới, \u003cspan class=\"wl\">Academic Manager\u003c/span> chọn delivery mode:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">enum ClassDeliveryMode {\n  OFFLINE = 'offline',      // Traditional classroom\n  ONLINE = 'online',        // Fully virtual\n  HYBRID = 'hybrid',        // Mix of both (scheduled)\n  FLEXIBLE = 'flexible'     // Student chooses each session\n}\n\ninterface ClassConfiguration {\n  class_id: string;\n  delivery_mode: ClassDeliveryMode;\n  \n  // Offline settings\n  branch_id?: string;\n  default_room_id?: string;\n  \n  // Online settings\n  meeting_platform?: 'zoom' | 'google_meet' | 'ms_teams';\n  meeting_room_id?: string;\n  permanent_meeting_link?: string;\n  recording_enabled: boolean;\n  \n  // Hybrid settings\n  hybrid_schedule?: {\n    online_days: number[];    // [1, 3, 5] = Mon, Wed, Fri\n    offline_days: number[];   // [2, 4] = Tue, Thu\n  };\n  \n  // Flexible settings\n  student_choice_enabled: boolean;\n  choice_deadline_hours: number;  // Must choose 24h before\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2a-offline-class-setup\">Step 2A: Offline Class Setup\u003c/h3>\n\u003cp>\u003cb>Requirements\u003c/b>:\u003c/p>\u003cul>\u003cli>Physical room at branch\u003c/li>\u003cli>Projector, whiteboard, etc.\u003c/li>\u003cli>Teacher can physically attend\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Configuration\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function setupOfflineClass(classId: string) {\n  const classData = await Class.findOne(classId);\n  \n  // Assign room\n  const availableRooms = await findAvailableRooms({\n    branch_id: classData.branch_id,\n    capacity: classData.max_students,\n    schedule: classData.schedule\n  });\n  \n  if (availableRooms.length === 0) {\n    throw new Error('No rooms available');\n  }\n  \n  classData.room_id = availableRooms[0].id;\n  classData.delivery_mode = ClassDeliveryMode.OFFLINE;\n  await classData.save();\n  \n  // Notify teacher of room assignment\n  await notifyTeacher(classData.teacher_id, {\n    message: `Lớp ${classData.name} được giao phòng ${availableRooms[0].name}`,\n    room_location: availableRooms[0].location\n  });\n  \n  return classData;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2b-online-class-setup\">Step 2B: Online Class Setup\u003c/h3>\n\u003cp>\u003cb>Requirements\u003c/b>:\u003c/p>\u003cul>\u003cli>Video conferencing platform account\u003c/li>\u003cli>Meeting room creation\u003c/li>\u003cli>Test meeting link\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Configuration\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function setupOnlineClass(\n  classId: string,\n  platform: 'zoom' | 'google_meet' | 'ms_teams'\n) {\n  const classData = await Class.findOne(classId);\n  \n  // Create meeting room\n  const meetingRoom = await createMeetingRoom({\n    platform: platform,\n    title: `${classData.name} - Online Class`,\n    recurring: true,\n    schedule: classData.schedule,\n    duration: classData.session_duration,\n    host_email: classData.teacher_email\n  });\n  \n  classData.delivery_mode = ClassDeliveryMode.ONLINE;\n  classData.meeting_platform = platform;\n  classData.meeting_room_id = meetingRoom.id;\n  classData.permanent_meeting_link = meetingRoom.join_url;\n  classData.recording_enabled = true;\n  await classData.save();\n  \n  // Send guide to teacher\n  await sendOnlineTeachingGuide(classData.teacher_id, {\n    platform: platform,\n    meeting_link: meetingRoom.join_url,\n    host_key: meetingRoom.host_key,\n    instructions: getTeacherInstructions(platform)\n  });\n  \n  // Send guide to students\n  const students = await getEnrolledStudents(classId);\n  for (const student of students) {\n    await sendOnlineLearningGuide(student.id, {\n      platform: platform,\n      meeting_link: meetingRoom.join_url,\n      how_to_join: getStudentInstructions(platform),\n      system_requirements: getSystemRequirements(platform)\n    });\n  }\n  \n  return classData;\n}\n\n// Platform-specific meeting creation\nasync function createMeetingRoom(config: MeetingConfig) {\n  switch (config.platform) {\n    case 'zoom':\n      return await zoomAPI.createMeeting({\n        topic: config.title,\n        type: 8, // Recurring with fixed time\n        start_time: config.schedule.start_time,\n        duration: config.duration,\n        settings: {\n          host_video: true,\n          participant_video: true,\n          join_before_host: false,\n          mute_upon_entry: true,\n          waiting_room: true,\n          auto_recording: 'cloud'\n        }\n      });\n      \n    case 'google_meet':\n      return await googleMeetAPI.createSpace({\n        displayName: config.title,\n        config: {\n          entryPointAccess: 'ALL',\n          accessType: 'TRUSTED'\n        }\n      });\n      \n    case 'ms_teams':\n      return await teamsAPI.createOnlineMeeting({\n        subject: config.title,\n        startDateTime: config.schedule.start_time,\n        endDateTime: calculateEndTime(config.schedule, config.duration),\n        participants: {\n          organizer: config.host_email\n        }\n      });\n  }\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2c-hybrid-class-setup\">Step 2C: Hybrid Class Setup\u003c/h3>\n\u003cp>\u003cb>Configuration\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function setupHybridClass(\n  classId: string,\n  hybridSchedule: HybridSchedule\n) {\n  const classData = await Class.findOne(classId);\n  \n  // Setup offline component\n  await setupOfflineClass(classId);\n  \n  // Setup online component\n  await setupOnlineClass(classId, hybridSchedule.online_platform);\n  \n  // Configure hybrid schedule\n  classData.delivery_mode = ClassDeliveryMode.HYBRID;\n  classData.hybrid_config = {\n    online_days: hybridSchedule.online_days,\n    offline_days: hybridSchedule.offline_days,\n    student_choice: false\n  };\n  await classData.save();\n  \n  // Generate schedule for students\n  const schedule = await generateHybridSchedule(classData);\n  \n  // Example:\n  // Mon (1): Online via Zoom\n  // Tue (2): Offline at Room 301\n  // Wed (3): Online via Zoom\n  // Thu (4): Offline at Room 301\n  // Fri (5): Online via Zoom\n  \n  // Notify all students\n  await notifyStudents(classId, {\n    title: 'Lịch học Hybrid của bạn',\n    schedule: schedule,\n    online_link: classData.permanent_meeting_link,\n    offline_location: `${classData.branch_name}, Phòng ${classData.room_name}`\n  });\n  \n  return { classData, schedule };\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2d-flexible-class-setup\">Step 2D: Flexible Class Setup\u003c/h3>\n\u003cp>\u003cb>Configuration\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">async function setupFlexibleClass(classId: string) {\n  const classData = await Class.findOne(classId);\n  \n  // Prepare both options\n  await setupOfflineClass(classId);\n  await setupOnlineClass(classId, 'zoom');\n  \n  classData.delivery_mode = ClassDeliveryMode.FLEXIBLE;\n  classData.hybrid_config = {\n    student_choice: true,\n    choice_deadline_hours: 24, // Must choose 24h before session\n    online_days: [],\n    offline_days: []\n  };\n  await classData.save();\n  \n  // Notify students about flexibility\n  await notifyStudents(classId, {\n    title: 'Lớp học linh hoạt - Bạn chọn!',\n    message: `\nBạn có thể chọn học Online hoặc Offline cho mỗi buổi học.\n\n📍 Offline: ${classData.branch_name}, Phòng ${classData.room_name}\n🎥 Online: ${classData.permanent_meeting_link}\n\n⏰ Vui lòng chọn trước 24 giờ trước giờ học.\n    `\n  });\n  \n  return classData;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-2-session-preparation-per-session\">Phase 2: Session Preparation (Per Session)\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Prepare for each individual class session\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, Students, System\u003c/p>\n\u003ch3 id=\"for-offline-sessions\">For Offline Sessions\u003c/h3>\n\u003cp>\u003cb>Teacher Preparation\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">// Day before session\nasync function prepareOfflineSession(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n  const teacher = await Teacher.findOne(session.teacher_id);\n  \n  // Check room availability\n  const room = await Room.findOne(session.room_id);\n  if (!room.available) {\n    // Find alternative room\n    const alternatives = await findAvailableRooms({\n      date: session.date,\n      time: session.start_time,\n      capacity: session.expected_students\n    });\n    \n    if (alternatives.length &gt; 0) {\n      // Reassign room\n      session.room_id = alternatives[0].id;\n      await session.save();\n      \n      // Notify teacher and students\n      await notifyRoomChange(sessionId, alternatives[0]);\n    } else {\n      // No room available - suggest online\n      await suggestOnlineAlternative(sessionId);\n    }\n  }\n  \n  // Remind teacher\n  await sendReminder(teacher.id, {\n    title: 'Nhắc nhở: Buổi học ngày mai',\n    session: session,\n    room: room,\n    materials_checklist: [\n      'Giáo án',\n      'Tài liệu in',\n      'USB/laptop',\n      'Điểm danh'\n    ]\n  });\n}\u003c/code>\u003c/pre>\u003ch3 id=\"for-online-sessions\">For Online Sessions\u003c/h3>\n\u003cp>\u003cb>Teacher Preparation\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">// 1 hour before session\nasync function prepareOnlineSession(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n
