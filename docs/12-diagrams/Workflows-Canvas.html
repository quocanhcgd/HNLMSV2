riority","shape":"rect","role":"","p":0},{"id":"HighPriority","label":"High Priority","shape":"rect","role":"","p":1},{"id":"UrgentPriority","label":"Urgent","shape":"rect","role":"","p":0},{"id":"AIRoute","label":"AI Route to Staff","shape":"rect","role":"","p":0},{"id":"RouteDecision","label":"Route to?","shape":"diamond","role":"","p":3},{"id":"AcademicStaff","label":"Academic Manager","shape":"rect","role":"","p":0},{"id":"FinanceStaff","label":"Finance Officer","shape":"rect","role":"","p":0},{"id":"BranchStaff","label":"Branch Manager","shape":"rect","role":"","p":0},{"id":"SupportStaff","label":"Customer Support","shape":"rect","role":"","p":1},{"id":"StaffResponse","label":"Staff Responds","shape":"rect","role":"","p":0},{"id":"AISuggestReply","label":"AI Suggest Reply","shape":"rect","role":"","p":0},{"id":"SendResponse","label":"Send Response","shape":"rect","role":"","p":0},{"id":"ParentReceive","label":"Parent Receives","shape":"rect","role":"","p":2},{"id":"Satisfied","label":"Satisfied?","shape":"diamond","role":"","p":0},{"id":"CloseTicket","label":"Close","shape":"rect","role":"","p":0},{"id":"Escalate","label":"Escalate","shape":"rect","role":"","p":0},{"id":"Manager","label":"Manager Handles","shape":"rect","role":"","p":0},{"id":"BroadcastType","label":"Broadcast Type?","shape":"diamond","role":"","p":3},{"id":"EmailCampaign","label":"Email Campaign","shape":"rect","role":"","p":0},{"id":"SMSCampaign","label":"SMS Campaign","shape":"rect","role":"","p":0},{"id":"PushNotif","label":"Push Notification","shape":"rect","role":"","p":0},{"id":"InAppNotif","label":"In-App Announcement","shape":"rect","role":"","p":0},{"id":"SelectAudience","label":"Select Audience","shape":"rect","role":"","p":0},{"id":"ComposeMessage","label":"Compose Message","shape":"rect","role":"","p":0},{"id":"Schedule","label":"Schedule or Send Now","shape":"rect","role":"","p":0},{"id":"SendBroadcast","label":"Send to All","shape":"rect","role":"","p":3},{"id":"TrackDelivery","label":"Track Delivery","shape":"rect","role":"","p":0},{"id":"Analytics","label":"Analytics Dashboard","shape":"rect","role":"","p":0},{"id":"GlobalAnalytics","label":"Communication Analytics","shape":"rect","role":"","p":0},{"id":"Insights","label":"AI Insights","shape":"rect","role":"","p":0},{"id":"Improvements","label":"Continuous Improvement","shape":"rect","role":"","p":0},{"id":"End","label":"Better Communication","shape":"round","role":"","p":0}],"edges":[{"from":"Start","to":"Channels","label":"","dashed":false},{"from":"Channels","to":"Internal","label":"Internal","dashed":false},{"from":"Channels","to":"StudentTeacher","label":"Student-Teacher","dashed":false},{"from":"Channels","to":"ParentSchool","label":"Parent-School","dashed":false},{"from":"Channels","to":"Broadcast","label":"Broadcast","dashed":false},{"from":"Internal","to":"InternalType","label":"","dashed":false},{"from":"InternalType","to":"DM","label":"Direct","dashed":false},{"from":"InternalType","to":"Channel","label":"Channel","dashed":false},{"from":"InternalType","to":"Announce","label":"Announcement","dashed":false},{"from":"DM","to":"InternalDeliver","label":"","dashed":false},{"from":"Channel","to":"InternalDeliver","label":"","dashed":false},{"from":"Announce","to":"InternalDeliver","label":"","dashed":false},{"from":"InternalDeliver","to":"InternalNotif","label":"","dashed":false},{"from":"InternalNotif","to":"InternalRead","label":"","dashed":false},{"from":"StudentTeacher","to":"STType","label":"","dashed":false},{"from":"STType","to":"Question","label":"Question","dashed":false},{"from":"STType","to":"FeedbackReq","label":"Feedback Request","dashed":false},{"from":"STType","to":"Appointment","label":"Appointment","dashed":false},{"from":"Question","to":"AIClassify","label":"","dashed":false},{"from":"AIClassify","to":"QABoard","label":"","dashed":false},{"from":"QABoard","to":"PublicQA","label":"Public","dashed":false},{"from":"QABoard","to":"PrivateMsg","label":"Private","dashed":false},{"from":"PublicQA","to":"TeacherAnswer","label":"","dashed":false},{"from":"PrivateMsg","to":"TeacherAnswer","label":"","dashed":false},{"from":"TeacherAnswer","to":"AIFeedbackSuggest","label":"","dashed":false},{"from":"AIFeedbackSuggest","to":"SendAnswer","label":"","dashed":false},{"from":"SendAnswer","to":"StudentReceive","label":"","dashed":false},{"from":"FeedbackReq","to":"TeacherFeedback","label":"","dashed":false},{"from":"TeacherFeedback","to":"StudentReceive","label":"","dashed":false},{"from":"Appointment","to":"CheckAvailability","label":"","dashed":false},{"from":"CheckAvailability","to":"ProposeTime","label":"","dashed":false},{"from":"ProposeTime","to":"StudentConfirm","label":"","dashed":false},{"from":"StudentConfirm","to":"CreateMeeting","label":"","dashed":false},{"from":"ParentSchool","to":"ParentMsg","label":"","dashed":false},{"from":"ParentMsg","to":"AISentiment","label":"","dashed":false},{"from":"AISentiment","to":"Sentiment","label":"","dashed":false},{"from":"Sentiment","to":"NormalPriority","label":"Positive","dashed":false},{"from":"Sentiment","to":"HighPriority","label":"Negative","dashed":false},{"from":"Sentiment","to":"UrgentPriority","label":"Urgent Keywords","dashed":false},{"from":"NormalPriority","to":"AIRoute","label":"","dashed":false},{"from":"HighPriority","to":"AIRoute","label":"","dashed":false},{"from":"UrgentPriority","to":"AIRoute","label":"","dashed":false},{"from":"AIRoute","to":"RouteDecision","label":"","dashed":false},{"from":"RouteDecision","to":"AcademicStaff","label":"Academic","dashed":false},{"from":"RouteDecision","to":"FinanceStaff","label":"Finance","dashed":false},{"from":"RouteDecision","to":"BranchStaff","label":"Schedule","dashed":false},{"from":"RouteDecision","to":"SupportStaff","label":"Complaint","dashed":false},{"from":"AcademicStaff","to":"StaffResponse","label":"","dashed":false},{"from":"FinanceStaff","to":"StaffResponse","label":"","dashed":false},{"from":"BranchStaff","to":"StaffResponse","label":"","dashed":false},{"from":"SupportStaff","to":"StaffResponse","label":"","dashed":false},{"from":"StaffResponse","to":"AISuggestReply","label":"","dashed":false},{"from":"AISuggestReply","to":"SendResponse","label":"","dashed":false},{"from":"SendResponse","to":"ParentReceive","label":"","dashed":false},{"from":"ParentReceive","to":"Satisfied","label":"","dashed":false},{"from":"Satisfied","to":"CloseTicket","label":"Yes","dashed":false},{"from":"Satisfied","to":"Escalate","label":"No","dashed":false},{"from":"Escalate","to":"Manager","label":"","dashed":false},{"from":"Manager","to":"SendResponse","label":"","dashed":false},{"from":"Broadcast","to":"BroadcastType","label":"","dashed":false},{"from":"BroadcastType","to":"EmailCampaign","label":"Email","dashed":false},{"from":"BroadcastType","to":"SMSCampaign","label":"SMS","dashed":false},{"from":"BroadcastType","to":"PushNotif","label":"Push","dashed":false},{"from":"BroadcastType","to":"InAppNotif","label":"In-App","dashed":false},{"from":"EmailCampaign","to":"SelectAudience","label":"","dashed":false},{"from":"SMSCampaign","to":"SelectAudience","label":"","dashed":false},{"from":"PushNotif","to":"SelectAudience","label":"","dashed":false},{"from":"InAppNotif","to":"SelectAudience","label":"","dashed":false},{"from":"SelectAudience","to":"ComposeMessage","label":"","dashed":false},{"from":"ComposeMessage","to":"Schedule","label":"","dashed":false},{"from":"Schedule","to":"SendBroadcast","label":"","dashed":false},{"from":"SendBroadcast","to":"TrackDelivery","label":"","dashed":false},{"from":"TrackDelivery","to":"Analytics","label":"","dashed":false},{"from":"InternalRead","to":"GlobalAnalytics","label":"","dashed":false},{"from":"StudentReceive","to":"GlobalAnalytics","label":"","dashed":false},{"from":"CloseTicket","to":"GlobalAnalytics","label":"","dashed":false},{"from":"Analytics","to":"GlobalAnalytics","label":"","dashed":false},{"from":"GlobalAnalytics","to":"Insights","label":"","dashed":false},{"from":"Insights","to":"Improvements","label":"","dashed":false},{"from":"Improvements","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-08-communication-hub-workflow\">💬 WF-08: Communication Hub Workflow\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: \u003ccode>IMPLEMENTATION-MAP.md\u003c/code> §8 · \u003cb>Scope\u003c/b>: 🚧 Roadmap P2\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_08\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - Stakeholder Communication \u003cbr> \u003cb>Phases\u003c/b>: 4 major channels \u003cbr> \u003cb>Duration\u003c/b>: Real-time to 24 hours response \u003cbr> \u003cb>Frequency\u003c/b>: Daily, continuous \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Phase 1 (Basic), Phase 2 (Enhanced)\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Communication Hub workflow quản lý toàn bộ giao tiếp giữa các stakeholders: nhân viên nội bộ, giáo viên-học viên, phụ huynh-trung tâm, và broadcast messaging. Hệ thống tích hợp AI để auto-routing, sentiment analysis, và suggested replies.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Response time nhanh hơn (từ 24h → 2h)\u003c/li>\u003cli>Satisfaction tăng (từ 3.5/5 → 4.5/5)\u003c/li>\u003cli>Giảm missed messages (từ 15% → 2%)\u003c/li>\u003cli>Auto-route 80% messages đúng người\u003c/li>\u003cli>Giảm workload support 40%\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"channel-1-internal-communication-staff\">Channel 1: Internal Communication (Staff)\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Efficient internal collaboration\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: All Staff Roles\u003c/p>\n\u003ch3 id=\"direct-messages\">Direct Messages\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface DirectMessage {\n  id: string;\n  from_user_id: string;\n  to_user_id: string;\n  \n  message: string;\n  attachments?: Attachment[];\n  \n  // Threading\n  reply_to_message_id?: string;\n  thread_id?: string;\n  \n  // Status\n  sent_at: Date;\n  delivered_at?: Date;\n  read_at?: Date;\n  \n  // Features\n  is_urgent: boolean;\n  requires_response: boolean;\n}\n\nasync function sendDirectMessage(\n  fromUserId: string,\n  toUserId: string,\n  message: string,\n  options: {\n    attachments?: File[];\n    reply_to?: string;\n    urgent?: boolean;\n  } = {}\n) {\n  // 1. Create message\n  const dm = await DirectMessage.create({\n    from_user_id: fromUserId,\n    to_user_id: toUserId,\n    message: message,\n    reply_to_message_id: options.reply_to,\n    is_urgent: options.urgent || false,\n    sent_at: new Date()\n  });\n  \n  // 2. Handle attachments\n  if (options.attachments) {\n    for (const file of options.attachments) {\n      const uploaded = await uploadAttachment(file);\n      await MessageAttachment.create({\n        message_id: dm.id,\n        file_name: file.name,\n        file_url: uploaded.url,\n        file_size: file.size\n      });\n    }\n  }\n  \n  // 3. Real-time delivery via WebSocket\n  await websocket.send(toUserId, {\n    type: 'direct_message',\n    message: dm,\n    from_user: await getUserInfo(fromUserId)\n  });\n  \n  // 4. Push notification if offline\n  const isOnline = await websocket.isUserOnline(toUserId);\n  if (!isOnline) {\n    await sendPushNotification(toUserId, {\n      title: `Tin nhắn từ ${await getUserName(fromUserId)}`,\n      body: message.substring(0, 100),\n      data: { message_id: dm.id }\n    });\n  }\n  \n  // 5. Email if urgent and offline &gt;5 minutes\n  if (options.urgent &amp;&amp; !isOnline) {\n    setTimeout(async () =&gt; {\n      if (!dm.read_at) {\n        await sendEmail(toUserId, {\n          subject: '🚨 Tin nhắn khẩn',\n          body: `\nBạn có tin nhắn khẩn từ ${await getUserName(fromUserId)}:\n\n${message}\n\nVui lòng đăng nhập để xem chi tiết.\n          `\n        });\n      }\n    }, 5 * 60 * 1000); // 5 minutes\n  }\n  \n  return dm;\n}\n\nasync function markAsRead(messageId: string, userId: string) {\n  const message = await DirectMessage.findOne(messageId);\n  \n  if (message.to_user_id !== userId) {\n    throw new Error('Not recipient');\n  }\n  \n  if (!message.read_at) {\n    message.read_at = new Date();\n    await message.save();\n    \n    // Notify sender\n    await websocket.send(message.from_user_id, {\n      type: 'message_read',\n      message_id: messageId,\n      read_at: message.read_at\n    });\n  }\n  \n  return message;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"department-channels\">Department Channels\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface Channel {\n  id: string;\n  name: string;\n  type: 'public' | 'private' | 'department';\n  description: string;\n  \n  // Members\n  created_by: string;\n  members: string[]; // user_ids\n  admins: string[]; // user_ids who can manage\n  \n  // Settings\n  anyone_can_post: boolean;\n  archived: boolean;\n}\n\n// Pre-defined channels\nconst defaultChannels = [\n  { name: 'general', description: 'Thông báo chung', type: 'public' },\n  { name: 'academic', description: 'Khoa học thuật', type: 'department' },\n  { name: 'finance', description: 'Tài chính', type: 'department' },\n  { name: 'it-support', description: 'Hỗ trợ kỹ thuật', type: 'department' },\n  { name: 'random', description: 'Tán gẫu', type: 'public' }\n];\n\nasync function postToChannel(\n  userId: string,\n  channelId: string,\n  message: string,\n  options: {\n    attachments?: File[];\n    mentions?: string[]; // @user_id\n  } = {}\n) {\n  const channel = await Channel.findOne(channelId);\n  \n  // Check permission\n  if (!channel.anyone_can_post &amp;&amp; !channel.admins.includes(userId)) {\n    throw new Error('No permission to post');\n  }\n  \n  if (!channel.members.includes(userId)) {\n    throw new Error('Not a member');\n  }\n  \n  // Create message\n  const channelMessage = await ChannelMessage.create({\n    channel_id: channelId,\n    user_id: userId,\n    message: message,\n    posted_at: new Date()\n  });\n  \n  // Handle attachments\n  if (options.attachments) {\n    for (const file of options.attachments) {\n      const uploaded = await uploadAttachment(file);\n      await MessageAttachment.create({\n        message_id: channelMessage.id,\n        file_name: file.name,\n        file_url: uploaded.url\n      });\n    }\n  }\n  \n  // Broadcast to all channel members\n  for (const memberId of channel.members) {\n    await websocket.send(memberId, {\n      type: 'channel_message',\n      channel: channel,\n      message: channelMessage,\n      user: await getUserInfo(userId)\n    });\n  }\n  \n  // Notify mentioned users\n  if (options.mentions) {\n    for (const mentionedId of options.mentions) {\n      if (mentionedId !== userId) {\n        await sendNotification(mentionedId, {\n          type: 'mention',\n          title: `${await getUserName(userId)} đã mention bạn`,\n          message: message.substring(0, 100),\n          link: `/channels/${channelId}/messages/${channelMessage.id}`\n        });\n      }\n    }\n  }\n  \n  return channelMessage;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"announcements\">Announcements\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface Announcement {\n  id: string;\n  title: string;\n  content: string;\n  \n  // Targeting\n  target_audience: 'all' | 'branch' | 'department' | 'role';\n  target_branches?: string[];\n  target_departments?: string[];\n  target_roles?: string[];\n  \n  // Scheduling\n  published_at?: Date;\n  expires_at?: Date;\n  \n  // Priority\n  priority: 'normal' | 'important' | 'urgent';\n  pin_to_top: boolean;\n  \n  // Tracking\n  views: number;\n  read_by: string[];\n  \n  // Created by\n  created_by: string;\n  created_at: Date;\n}\n\nasync function createAnnouncement(announcement: Announcement) {\n  const created = await Announcement.create(announcement);\n  \n  // Determine recipients\n  const recipients = await getAnnouncementRecipients(announcement);\n  \n  // Send to all recipients\n  for (const userId of recipients) {\n    // Real-time notification\n    await websocket.send(userId, {\n      type: 'announcement',\n      announcement: created,\n      priority: announcement.priority\n    });\n    \n    // Email for important/urgent\n    if (announcement.priority !== 'normal') {\n      await sendEmail(userId, {\n        subject: `${announcement.priority === 'urgent' ? '🚨' : '⚠️'} ${announcement.title}`,\n        body: announcement.content\n      });\n    }\n  }\n  \n  return created;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"channel-2-student-teacher-communication\">Channel 2: Student-Teacher Communication\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Support learning with Q&amp;A and feedback\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Student\u003c/span>, \u003cspan class=\"wl\">Teacher\u003c/span>\u003c/p>\n\u003ch3 id=\"qa-system\">Q&amp;A System\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface StudentQuestion {\n  id: string;\n  student_id: string;\n  class_id: string;\n  \n  // Question\n  question: string;\n  context?: string; // Related to assignment, lesson, etc.\n  attachments?: string[];\n  \n  // AI classification\n  topic: string; // Detected by AI\n  urgency: 'low' | 'medium' | 'high';\n  \n  // Visibility\n  visibility: 'public' | 'private';\n  \n  // Answer\n  answer?: string;\n  answered_by?: string;\n  answered_at?: Date;\n  \n  // Status\n  status: 'pending' | 'answered' | 'resolved';\n  \n  // Engagement\n  upvotes: number;\n  helpful_count: number;\n  \n  created_at: Date;\n}\n\nasync function askQuestion(\n  studentId: string,\n  classId: string,\n  question: string,\n  options: {\n    context?: string;\n    visibility?: 'public' | 'private';\n  } = {}\n) {\n  // 1. AI classifies question\n  const classification = await classifyQuestion(question, options.context);\n  \n  // 2. Create question\n  const studentQuestion = await StudentQuestion.create({\n    student_id: studentId,\n    class_id: classId,\n    question: question,\n    context: options.context,\n    visibility: options.visibility || 'public',\n    topic: classification.topic,\n    urgency: classification.urgency,\n    status: 'pending',\n    created_at: new Date()\n  });\n  \n  // 3. Notify teacher\n  const classData = await Class.findOne(classId);\n  await notifyTeacher(classData.teacher_id, {\n    title: 'Câu hỏi mới từ học viên',\n    message: `${await getStudentName(studentId)}: ${question.substring(0, 100)}`,\n    urgency: classification.urgency,\n    question_id: studentQuestion.id\n  });\n  \n  // 4. If public, add to Q&amp;A board\n  if (options.visibility === 'public') {\n    await addToQABoard(classId, studentQuestion.id);\n  }\n  \n  return studentQuestion;\n}\n\n// AI classification\nasync function classifyQuestion(\n  question: string,\n  context?: string\n): Promise&lt;{ topic: string; urgency: string }&gt; {\n  const prompt = `\nPhân tích câu hỏi của học viên:\n\nCâu hỏi: ${question}\n${context ? `Bối cảnh: ${context}` : ''}\n\nXác định:\n1. Topic chính (grammar, vocabulary, speaking, listening, writing, reading, homework, assignment, technical, other)\n2. Urgency (low, medium, high) dựa trên:\n   - High: Cần gấp, có deadline sắp tới, blocking progress\n   - Medium: Quan trọng nhưng không gấp\n   - Low: Thắc mắc chung, optional\n\nTrả về JSON: {\"topic\": \"...\", \"urgency\": \"...\"}\n  `;\n  \n  const result = await callAI({\n    model: 'gpt-4',\n    prompt: prompt,\n    response_format: 'json'\n  });\n  \n  return result;\n}\n\n// Teacher answers\nasync function answerQuestion(\n  questionId: string,\n  teacherId: string,\n  answer: string,\n  options: {\n    ai_assist?: boolean;\n  } = {}\n) {\n  const question = await StudentQuestion.findOne(questionId);\n  \n  let finalAnswer = answer;\n  \n  // AI suggests improvements\n  if (options.ai_assist) {\n    const suggestion = await suggestAnswerImprovements(question.question, answer);\n    // Teacher can choose to use AI suggestion or their original\n  }\n  \n  // Save answer\n  question.answer = finalAnswer;\n  question.answered_by = teacherId;\n  question.answered_at = new Date();\n  question.status = 'answered';\n  await question.save();\n  \n  // Notify student\n  await notifyStudent(question.student_id, {\n    title: 'Giáo viên đã trả lời câu hỏi',\n    message: finalAnswer.substring(0, 100),\n    question_id: questionId\n  });\n  \n  // If public, notify other students in class\n  if (question.visibility === 'public') {\n    const classStudents = await getEnrolledStudents(question.class_id);\n    for (const student of classStudents) {\n      if (student.id !== question.student_id) {\n        await sendNotification(student.id, {\n          type: 'qa_answered',\n          title: 'Câu hỏi mới được trả lời',\n          message: `Q: ${question.question}`,\n          question_id: questionId\n        });\n      }\n    }\n  }\n  \n  return question;\n}\n\n// AI suggest answer improvements\nasync function suggestAnswerImprovements(\n  question: string,\n  answer: string\n): Promise&lt;string&gt; {\n  const prompt = `\nHọc viên hỏi: ${question}\n\nGiáo viên trả lời: ${answer}\n\nHãy cải thiện câu trả lời để:\n1. Rõ ràng hơn\n2. Thêm ví dụ cụ thể\n3. Tone thân thiện, khuyến khích\n4. Dễ hiểu với học viên\n\nTrả về câu trả lời đã cải thiện.\n  `;\n  \n  return await callAI({\n    model: 'gpt-4',\n    prompt: prompt\n  });\n}\u003c/code>\u003c/pre>\u003ch3 id=\"appointment-scheduling\">Appointment Scheduling\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function requestAppointment(\n  studentId: string,\n  teacherId: string,\n  purpose: string,\n  preferredDates: Date[]\n) {\n  // 1. Get teacher availability\n  const availability = await getTeacherAvailability(teacherId, preferredDates);\n  \n  // 2. Suggest time slots\n  const suggestions = findMatchingSlots(preferredDates, availability);\n  \n  if (suggestions.length === 0) {\n    // No match, suggest teacher's available times\n    const alternativeSlots = await getTeacherAvailableSlots(teacherId, 7); // Next 7 days\n    \n    return {\n      success: false,\n      reason: 'No matching availability',\n      alternative_slots: alternativeSlots\n    };\n  }\n  \n  // 3. Create appointment request\n  const appointment = await Appointment.create({\n    student_id: studentId,\n    teacher_id: teacherId,\n    purpose: purpose,\n    suggested_times: suggestions,\n    status: 'pending',\n    created_at: new Date()\n  });\n  \n  // 4. Notify teacher\n  await notifyTeacher(teacherId, {\n    title: 'Yêu cầu hẹn gặp',\n    message: `${await getStudentName(studentId)} muốn gặp: ${purpose}`,\n    appointment_id: appointment.id,\n    action: 'approve_time'\n  });\n  \n  return appointment;\n}\n\nasync function confirmAppointment(\n  appointmentId: string,\n  teacherId: string,\n  confirmedTime: Date\n) {\n  const appointment = await Appointment.findOne(appointmentId);\n  \n  appointment.confirmed_time = confirmedTime;\n  appointment.status = 'confirmed';\n  await appointment.save();\n  \n  // Create calendar event\n  await createCalendarEvent({\n    title: `Meeting: ${await getStudentName(appointment.student_id)}`,\n    start_time: confirmedTime,\n    duration: 30, // minutes\n    attendees: [teacherId, appointment.student_id],\n    location: 'TBD' // or meeting room\n  });\n  \n  // Notify student\n  await notifyStudent(appointment.student_id, {\n    title: 'Lịch hẹn đã được xác nhận',\n    message: `${formatDateTime(confirmedTime)}`,\n    appointment_id: appointmentId\n  });\n  \n  // Send calendar invite via email\n  await sendCalendarInvite(appointment);\n  \n  return appointment;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"channel-3-parent-school-communication\">Channel 3: Parent-School Communication\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Keep parents informed and engaged\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: Parent (addon), \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, Support Staff\u003c/p>\n\u003ch3 id=\"parent-messaging\">Parent Messaging\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface ParentMessage {\n  id: string;\n  parent_id: string;\n  student_id: string;\n  \n  // Message\n  subject: string;\n  message: string;\n  attachments?: string[];\n  \n  // AI analysis\n  sentiment: 'positive' | 'neutral' | 'negative';\n  detected_topic: string;\n  urgency: 'low' | 'normal' | 'high' | 'urgent';\n  \n  // Routing\n  assigned_to?: string; // staff member\n  department?: string;\n  \n  // Thread\n  thread_id: string;\n  replies: ParentMessageReply[];\n  \n  // Status\n  status: 'unread' | 'read' | 'in_progress' | 'resolved';\n  \n  // SLA\n  received_at: Date;\n  first_response_at?: Date;\n  resolved_at?: Date;\n  \n  // Priority\n  is_urgent: boolean;\n  escalated: boolean;\n}\n\nasync function receiveParentMessage(\n  parentId: string,\n  studentId: string,\n  subject: string,\n  message: string\n) {\n  // 1. AI sentiment analysis\n  const sentiment = await analyzeSentiment(message);\n  \n  // 2. AI topic classification\n  const topic = await classifyTopic(message);\n  \n  // 3. Detect urgency\n  const urgency = detectUrgency(message, sentiment);\n  \n  // 4. Create message\n  const parentMessage = await ParentMessage.create({\n    parent_id: parentId,\n    student_id: studentId,\n    subject: subject,\n    message: message,\n    sentiment: sentiment.label,\n    detected_topic: topic,\n    urgency: urgency,\n    is_urgent: urgency === 'urgent',\n    status: 'unread',\n    received_at: new Date()\n  });\n  \n  // 5. Auto-route to appropriate staff\n  const assignedStaff = await autoRouteMessage(parentMessage);\n  \n  parentMessage.assigned_to = assignedStaff.id;\n  parentMessage.department = assignedStaff.department;\n  await parentMessage.save();\n  \n  // 6. Notify assigned staff\n  const priority = urgency === 'urgent' ? 'high' : \n                   sentiment.label === 'negative' ? 'medium' : 'normal';\n  \n  await notifyStaff(assignedStaff.id, {\n    title: urgency === 'urgent' ? '🚨 Tin nhắn khẩn từ phụ huynh' : 'Tin nhắn mới từ phụ huynh',\n    message: `${await getParentName(parentId)}: ${subject}`,\n    priority: priority,\n    message_id: parentMessage.id,\n    sentiment: sentiment.label\n  });\n  \n  // 7. Auto-reply acknowledgment\n  await sendAutoReply(parentId, parentMessage.id, urgency);\n  \n  return parentMessage;\n}\n\n// AI sentiment analysis\nasync function analyzeSentiment(text: string): Promise&lt;{ label: string; score: number }&gt; {\n  const prompt = `\nPhân tích sentiment của tin nhắn từ phụ huynh:\n\n\"${text}\"\n\nXác định:\n- Sentiment: positive (hài lòng, khen ngợi), neutral (trung lập, hỏi thông tin), negative (không hài lòng, phàn nàn, giận dữ)\n- Score: 0-1 (mức độ tự tin)\n\nTrả về JSON: {\"label\": \"...\", \"score\": 0.95}\n  `;\n  \n  const result = await callAI({\n    model: 'gpt-4',\n    prompt: prompt,\n    response_format: 'json'\n  });\n  \n  return result;\n}\n\n// Auto-routing logic\nasync function autoRouteMessage(message: ParentMessage): Promise&lt;Staff&gt; {\n  const routingRules = {\n    'academic': ['grade', 'homework', 'teacher', 'progress', 'learning', 'study'],\n    'finance': ['fee', 'payment', 'invoice', 'refund', 'money', 'price'],\n    'schedule': ['schedule', 'time', 'class', 'absent', 'makeup', 'holiday'],\n    'complaint': ['complaint', 'unhappy', 'dissatisfied', 'angry', 'problem'],\n    'general': []\n  };\n  \n  let department = 'general';\n  const lowerMessage = message.message.toLowerCase();\n  \n  for (const [dept, keywords] of Object.entries(routingRules)) {\n    if (keywords.some(keyword =&gt; lowerMessage.includes(keyword))) {\n      department = dept;\n      break;\n    }\n  }\n  \n  // Get available staff from that department\n  const availableStaff = await findAvailableStaff(department, message.urgency);\n  \n  return availableStaff;\n}\n\n// Auto-reply\nasync function sendAutoReply(parentId: string, messageId: string, urgency: string) {\n  const expectedResponseTime = urgency === 'urgent' ? '2 giờ' :\n                                urgency === 'high' ? '4 giờ' : '24 giờ';\n  \n  const autoReply = `\nXin chào quý phụ huynh,\n\nCảm ơn quý phụ huynh đã liên hệ với chúng tôi. Tin nhắn của quý phụ huynh đã được tiếp nhận và chuyển đến bộ phận phụ trách.\n\nChúng tôi sẽ phản hồi trong vòng ${expectedResponseTime}.\n\n${urgency === 'urgent' ? '⚠️ Tin nhắn của quý phụ huynh được đánh dấu KHẨN CẤP và sẽ được ưu tiên xử lý.' : ''}\n\nTrân trọng,\n${await getOrganizationName()}\n  `;\n  \n  await ParentMessageReply.create({\n    message_id: messageId,\n    from_user_id: 'system',\n    reply: autoReply,\n    is_auto_reply: true,\n    sent_at: new Date()\n  });\n  \n  await sendEmail(parentId, {\n    subject: 'Đã nhận được tin nhắn của quý phụ huynh',\n    body: autoReply\n  });\n}\n\n// Staff responds\nasync function replyToParent(\n  messageId: string,\n  staffId: string,\n  reply: string,\n  options: {\n    ai_assist?: boolean;\n    resolve?: boolean;\n  } = {}\n) {\n  const message = await ParentMessage.findOne(messageId);\n  \n  let finalReply = reply;\n  \n  // AI suggests improvements\n  if (options.ai_assist) {\n    const improved = await improveReply(message.message, reply, message.sentiment);\n    // Staff can choose to use improved version\n  }\n  \n  // Create reply\n  const replyRecord = await ParentMessageReply.create({\n    message_id: messageId,\n    from_user_id: staffId,\n    reply: finalReply,\n    sent_at: new Date()\n  });\n  \n  // Update message status\n  if (!message.first_response_at) {\n    message.first_response_at = new Date();\n  }\n  \n  if (options.resolve) {\n    message.status = 'resolved';\n    message.resolved_at = new Date();\n  } else {\n    message.status = 'in_progress';\n  }\n  \n  await message.save();\n  \n  // Send to parent\n  await sendEmail(message.parent_id, {\n    subject: `Re: ${message.subject}`,\n    body: finalReply,\n    in_reply_to: messageId\n  });\n  \n  await sendNotification(message.parent_id, {\n    type: 'message_reply',\n    title: 'Trường đã phản hồi',\n    message: finalReply.substring(0, 100),\n    message_id: messageId\n  });\n  \n  // Calculate response time\n  const responseTime = differenceInMinutes(\n    message.first_response_at,\n    message.received_at\n  );\n  \n  // Track SLA\n  await trackSLA(message, responseTime);\n  \n  return replyRecord;\n}\n\n// AI improve reply\nasync function improveReply(\n  originalMessage: string,\n  reply: string,\n  sentiment: string\n): Promise&lt;string&gt; {\n  const prompt = `\nPhụ huynh gửi tin nhắn:\n\"${originalMessage}\"\n\nSentiment: ${sentiment}\n\nNhân viên trả lời:\n\"${reply}\"\n\nHãy cải thiện câu trả lời để:\n1. Thể hiện empathy (đặc biệt nếu sentiment negative)\n2. Chuyên nghiệp và lịch sự\n3. Rõ ràng, cụ thể\n4. Giải quyết được vấn đề\n5. Tone phù hợp với văn hóa Việt Nam\n\nTrả về câu trả lời đã cải thiện (giữ nguyên nội dung chính, chỉ cải thiện cách diễn đạt).\n  `;\n  \n  return await callAI({\n    model: 'gpt-4',\n    prompt: prompt\n  });\n}\u003c/code>\u003c/pre>\u003ch3 id=\"progress-reports-auto-sent\">Progress Reports (Auto-sent)\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function sendProgressReport(studentId: string, reportType: 'weekly' | 'monthly') {\n  const student = await Student.findOne(studentId);\n  const parent = await getParent(studentId);\n  \n  if (!parent) return; // No parent linked\n  \n  // Generate report\n  const report = await generateProgressReport(studentId, reportType);\n  \n  // Send email\n  await sendEmail(parent.id, {\n    subject: `Báo cáo ${reportType === 'weekly' ? 'tuần' : 'tháng'} - ${student.name}`,\n    template: 'progress_report',\n    data: {\n      student_name: student.name,\n      period: report.period,\n      attendance: report.attendance,\n      grades: report.grades,\n      teacher_comments: report.comments,\n      next_focus: report.next_focus\n    },\n    attachments: [\n      {\n        filename: 'progress_report.pdf',\n        content: await generatePDF(report)\n      }\n    ]\n  });\n  \n  // Create message record\n  await ParentMessage.create({\n    parent_id: parent.id,\n    student_id: studentId,\n    subject: `Báo cáo ${reportType === 'weekly' ? 'tuần' : 'tháng'}`,\n    message: 'Báo cáo tiến độ học tập đính kèm',\n    sentiment: 'neutral',\n    detected_topic: 'progress_report',\n    status: 'resolved',\n    is_system_message: true,\n    received_at: new Date()\n  });\n}\n\n// Schedule auto-reports\nasync function scheduleProgressReports() {\n  // Weekly: Every Friday 6pm\n  cron.schedule('0 18 * * 5', async () =&gt; {\n    const activeStudents = await getActiveStudents();\n    for (const student of activeStudents) {\n      await sendProgressReport(student.id, 'weekly');\n    }\n  });\n  \n  // Monthly: 1st day of month\n  cron.schedule('0 9 1 * *', async () =&gt; {\n    const activeStudents = await getActiveStudents();\n    for (const student of activeStudents) {\n      await sendProgressReport(student.id, 'monthly');\n    }\n  });\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"channel-4-broadcast-communications\">Channel 4: Broadcast Communications\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Mass communications to targeted audiences\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Branch Manager\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, Marketing\u003c/p>\n\u003ch3 id=\"email-campaigns\">Email Campaigns\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface EmailCampaign {\n  id: string;\n  name: string;\n  subject: string;\n  template: string;\n  \n  // Targeting\n  audience: {\n    type: 'all' | 'students' | 'parents' | 'teachers' | 'custom';\n    filters?: {\n      branches?: string[];\n      programs?: string[];\n      classes?: string[];\n      roles?: string[];\n    };\n  };\n  \n  // Scheduling\n  send_at?: Date; // null = send now\n  \n  // Tracking\n  total_recipients: number;\n  sent: number;\n  delivered: number;\n  opened: number;\n  clicked: number;\n  bounced: number;\n  \n  status: 'draft' | 'scheduled' | 'sending' | 'sent' | 'failed';\n  \n  created_by: string;\n  created_at: Date;\n}\n\nasync function createEmailCampaign(campaign: EmailCampaign) {\n  // 1. Calculate recipients\n  const recipients = await getRecipients(campaign.audience);\n  \n  campaign.total_recipients = recipients.length;\n  \n  // 2. Save campaign\n  const created = await EmailCampaign.create(campaign);\n  \n  // 3. Schedule or send\n  if (campaign.send_at) {\n    // Schedule\n    await scheduleJob(campaign.send_at, () =&gt; {\n      sendEmailCampaign(created.id);\n    });\n    \n    created.status = 'scheduled';\n  } else {\n    // Send now\n    await sendEmailCampaign(created.id);\n  }\n  \n  await created.save();\n  \n  return created;\n}\n\nasync function sendEmailCampaign(campaignId: string) {\n  const campaign = await EmailCampaign.findOne(campaignId);\n  const recipients = await getRecipients(campaign.audience);\n  \n  campaign.status = 'sending';\n  await campaign.save();\n  \n  // Send in batches (100 at a time)\n  const batches = chunk(recipients, 100);\n  \n  for (const batch of batches) {\n    await Promise.all(\n      batch.map(async recipient =&gt; {\n        try {\n          await sendEmail(recipient.email, {\n            subject: campaign.subject,\n            template: campaign.template,\n            data: {\n              name: recipient.name,\n              // ... other personalization\n            },\n            tracking_id: `${campaignId}_${recipient.id}`\n          });\n          \n          campaign.sent += 1;\n          \n        } catch (error) {\n          console.error(`Failed to send to ${recipient.email}:`, error);\n          campaign.bounced += 1;\n        }\n      })\n    );\n    \n    await campaign.save();\n    \n    // Rate limiting\n    await sleep(1000); // 1 second between batches\n  }\n  \n  campaign.status = 'sent';\n  await campaign.save();\n}\n\n// Track email opens and clicks\nasync function trackEmailEvent(\n  trackingId: string,\n  event: 'delivered' | 'opened' | 'clicked',\n  metadata?: any\n) {\n  const [campaignId, recipientId] = trackingId.split('_');\n  const campaign = await EmailCampaign.findOne(campaignId);\n  \n  switch (event) {\n    case 'delivered':\n      campaign.delivered += 1;\n      break;\n    case 'opened':\n      campaign.opened += 1;\n      break;\n    case 'clicked':\n      campaign.clicked += 1;\n      break;\n  }\n  \n  await campaign.save();\n  \n  // Record individual event\n  await EmailEvent.create({\n    campaign_id: campaignId,\n    recipient_id: recipientId,\n    event: event,\n    metadata: metadata,\n    timestamp: new Date()\n  });\n}\u003c/code>\u003c/pre>\u003ch3 id=\"sms-campaigns\">SMS Campaigns\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function sendSMSCampaign(\n  audience: Audience,\n  message: string,\n  options: {\n    schedule?: Date;\n  } = {}\n) {\n  const recipients = await getRecipients(audience);\n  \n  // Validate SMS length (max 160 chars for single SMS)\n  if (message.length &gt; 160) {\n    console.warn('SMS longer than 160 chars will be split into multiple messages');\n  }\n  \n  const campaign = await SMSCampaign.create({\n    message: message,\n    audience: audience,\n    total_recipients: recipients.length,\n    scheduled_at: options.schedule,\n    status: options.schedule ? 'scheduled' : 'sending'\n  });\n  \n  if (options.schedule) {\n    await scheduleJob(options.schedule, () =&gt; {\n      executeSMSCampaign(campaign.id);\n    });\n  } else {\n    await executeSMSCampaign(campaign.id);\n  }\n  \n  return campaign;\n}\n\nasync function executeSMSCampaign(campaignId: string) {\n  const campaign = await SMSCampaign.findOne(campaignId);\n  const recipients = await getRecipients(campaign.audience);\n  \n  for (const recipient of recipients) {\n    try {\n      await sendSMS(recipient.phone, campaign.message);\n      campaign.sent += 1;\n    } catch (error) {\n      console.error(`Failed to send SMS to ${recipient.phone}:`, error);\n      campaign.failed += 1;\n    }\n    \n    // Rate limiting (1 SMS per second)\n    await sleep(1000);\n  }\n  \n  campaign.status = 'sent';\n  await campaign.save();\n}\u003c/code>\u003c/pre>\u003ch3 id=\"push-notifications\">Push Notifications\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function sendPushNotificationCampaign(\n  audience: Audience,\n  notification: {\n    title: string;\n    body: string;\n    image?: string;\n    action_url?: string;\n  },\n  options: {\n    schedule?: Date;\n  } = {}\n) {\n  const recipients = await getRecipients(audience);\n  \n  // Filter to users with push tokens\n  const pushRecipients = recipients.filter(r =&gt; r.push_token);\n  \n  const campaign = await PushCampaign.create({\n    title: notification.title,\n    body: notification.body,\n    audience: audience,\n    total_recipients: pushRecipients.length,\n    scheduled_at: options.schedule,\n    status: options.schedule ? 'scheduled' : 'sending'\n  });\n  \n  if (options.schedule) {\n    await scheduleJob(options.schedule, () =&gt; {\n      executePushCampaign(campaign.id);\n    });\n  } else {\n    await executePushCampaign(campaign.id);\n  }\n  \n  return campaign;\n}\n\nasync function executePushCampaign(campaignId: string) {\n  const campaign = await PushCampaign.findOne(campaignId);\n  const recipients = await getRecipients(campaign.audience);\n  \n  // Send in batches using Firebase/OneSignal\n  const batches = chunk(recipients, 500); // 500 per batch\n  \n  for (const batch of batches) {\n    const tokens = batch.map(r =&gt; r.push_token).filter(Boolean);\n    \n    try {\n      await firebase.messaging().sendMulticast({\n        tokens: tokens,\n        notification: {\n          title: campaign.title,\n          body: campaign.body\n        },\n        data: {\n          campaign_id: campaignId\n        }\n      });\n      \n      campaign.sent += tokens.length;\n      \n    } catch (error) {\n      console.error('Batch send failed:', error);\n      campaign.failed += tokens.length;\n    }\n    \n    await campaign.save();\n  }\n  \n  campaign.status = 'sent';\n  await campaign.save();\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"communication-analytics\">Communication Analytics\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Measure and improve communication effectiveness\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Branch Manager\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/p>\n\u003ch3 id=\"analytics-dashboard\">Analytics Dashboard\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function getCommunicationAnalytics(\n  period: { start: Date; end: Date }\n) {\n  return {\n    // Internal\n    internal: {\n      direct_messages: await DirectMessage.count({\n        sent_at: Between(period.start, period.end)\n      }),\n      channel_messages: await ChannelMessage.count({\n        posted_at: Between(period.start, period.end)\n      }),\n      announcements: await Announcement.count({\n        created_at: Between(period.start, period.end)\n      }),\n      average_response_time: await calculateAvgResponseTime('internal', period)\n    },\n    \n    // Student-Teacher\n    student_teacher: {\n      questions_asked: await StudentQuestion.count({\n        created_at: Between(period.start, period.end)\n      }),\n      questions_answered: await StudentQuestion.count({\n        created_at: Between(period.start, period.end),\n        status: In(['answered', 'resolved'])\n      }),\n      average_response_time: await calculateAvgResponseTime('student_teacher', period),\n      satisfaction_score: await calculateSatisfactionScore('student_teacher', period)\n    },\n    \n    // Parent-School\n    parent_school: {\n      messages_received: await ParentMessage.count({\n        received_at: Between(period.start, period.end)\n      }),\n      messages_resolved: await ParentMessage.count({\n        received_at: Between(period.start, period.end),\n        status: 'resolved'\n      }),\n      average_resolution_time: await calculateAvgResolutionTime(period),\n      sentiment_distribution: await getSentimentDistribution(period),\n      sla_compliance: await calculateSLACompliance(period)\n    },\n    \n    // Broadcast\n    broadcast: {\n      email_campaigns: await EmailCampaign.count({\n        created_at: Between(period.start, period.end)\n      }),\n      email_open_rate: await calculateEmailOpenRate(period),\n      email_click_rate: await calculateEmailClickRate(period),\n      sms_campaigns: await SMSCampaign.count({\n        created_at: Between(period.start, period.end)\n      }),\n      push_campaigns: await PushCampaign.count({\n        created_at: Between(period.start, period.end)\n      })\n    }\n  };\n}\n\n// AI-powered insights\nasync function generateCommunicationInsights(analytics: any) {\n  const insights = [];\n  \n  // Response time issues\n  if (analytics.parent_school.average_resolution_time &gt; 24 * 60) { // &gt;24 hours\n    insights.push({\n      type: 'warning',\n      category: 'response_time',\n      message: 'Thời gian phản hồi phụ huynh quá chậm',\n      current: `${(analytics.parent_school.average_resolution_time / 60).toFixed(0)} giờ`,\n      target: '&lt; 24 giờ',\n      suggestions: [\n        'Tăng số lượng staff support',\n        'Cải thiện auto-routing',\n        'Tạo template trả lời nhanh'\n      ]\n    });\n  }\n  \n  // Negative sentiment trend\n  const negativePct = (analytics.parent_school.sentiment_distribution.negative / \n                       analytics.parent_school.messages_received) * 100;\n  \n  if (negativePct &gt; 20) {\n    insights.push({\n      type: 'alert',\n      category: 'sentiment',\n      message: 'Tỷ lệ tin nhắn negative cao',\n      current: `${negativePct.toFixed(0)}%`,\n      suggestions: [\n        'Xem xét chất lượng dịch vụ',\n        'Phân tích nguyên nhân chính',\n        'Cải thiện communication skills của staff'\n      ]\n    });\n  }\n  \n  // Email engagement\n  if (analytics.broadcast.email_open_rate &lt; 20) {\n    insights.push({\n      type: 'info',\n      category: 'email_engagement',\n      message: 'Tỷ lệ mở email thấp',\n      current: `${analytics.broadcast.email_open_rate.toFixed(0)}%`,\n      target: '&gt; 30%',\n      suggestions: [\n        'Cải thiện subject line',\n        'Tối ưu thời gian gửi',\n        'Personalize nội dung',\n        'Segment audience tốt hơn'\n      ]\n    });\n  }\n  \n  return insights;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"response-time\">Response Time\u003c/h3>\u003cul>\u003cli>\u003cb>Student Questions\u003c/b>: &lt;4 hours average (Target: &lt;6 hours)\u003c/li>\u003cli>\u003cb>Parent Messages\u003c/b>: &lt;24 hours average (Target: &lt;24 hours)\u003c/li>\u003cli>\u003cb>Urgent Messages\u003c/b>: &lt;2 hours (Target: &lt;3 hours)\u003c/li>\u003cli>\u003cb>Internal DM\u003c/b>: &lt;1 hour during work hours (Target: &lt;2 hours)\u003c/li>\u003c/ul>\n\u003ch3 id=\"communication-quality\">Communication Quality\u003c/h3>\u003cul>\u003cli>\u003cb>Student Satisfaction\u003c/b>: 4.5/5 (Target: 4.0/5)\u003c/li>\u003cli>\u003cb>Parent Satisfaction\u003c/b>: 4.3/5 (Target: 4.0/5)\u003c/li>\u003cli>\u003cb>First Contact Resolution\u003c/b>: 75% (Target: 70%)\u003c/li>\u003cli>\u003cb>SLA Compliance\u003c/b>: 90%+ (Target: 85%+)\u003c/li>\u003c/ul>\n\u003ch3 id=\"engagement\">Engagement\u003c/h3>\u003cul>\u003cli>\u003cb>Email Open Rate\u003c/b>: 35%+ (Target: 30%+)\u003c/li>\u003cli>\u003cb>Email Click Rate\u003c/b>: 8%+ (Target: 5%+)\u003c/li>\u003cli>\u003cb>Push Notification CTR\u003c/b>: 15%+ (Target: 10%+)\u003c/li>\u003cli>\u003cb>Q&amp;A Board Activity\u003c/b>: 60% students ask ≥1 question (Target: 50%+)\u003c/li>\u003c/ul>\n\u003ch3 id=\"ai-performance\">AI Performance\u003c/h3>\u003cul>\u003cli>\u003cb>Auto-routing Accuracy\u003c/b>: 85%+ (Target: 80%+)\u003c/li>\u003cli>\u003cb>Sentiment Detection Accuracy\u003c/b>: 90%+ (Target: 85%+)\u003c/li>\u003cli>\u003cb>AI Reply Acceptance Rate\u003c/b>: 60%+ (Target: 50%+)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-02 Teaching &amp;amp; Learning Cycle\u003c/span> - Teacher-student interactions\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-07 AI-Powered Assessment\u003c/span> - Feedback delivery\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-06 Digital Library\u003c/span> - Content sharing\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> - Answer student questions\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - Ask questions, receive updates\u003c/li>\u003cli>\u003cspan class=\"wl\">Parent\u003c/span> - Monitor progress, communicate with school\u003c/li>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> - Oversee communication quality\u003c/li>\u003cli>\u003cspan class=\"wl\">Customer Support\u003c/span> - Handle parent inquiries\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Customer Support Manager, Academic Manager \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"}];
(function(){
"use strict";
const ROLE_COLOR={consultant:'#f472b6',finance:'#34d399',admin:'#60a5fa',system:'#94a3b8',student:'#c084fc',teacher:'#fb923c'};
const DEFAULT='#818cf8';
const SCOPE_COLOR={MVP:'var(--mvp)',P2:'var(--p2)',P3:'var(--p3)'};
const SCOPE_LABEL={MVP:'MVP',P2:'Roadmap · P2',P3:'Roadmap · P3'};
const ACCENT=['#f43f5e','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#fb923c'];
const wfAccent={};WORKFLOWS.forEach((w,i)=>wfAccent[w.id]=ACCENT[i%ACCENT.length]);

const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const tabs=$('tabs'),ov=$('overview'),detail=$('detail'),legend=$('legend');
const doc=$('doc'),docInner=$('docInner');
let mode='canvas';
const bTitle=$('bTitle'),bMeta=$('bMeta');
let vw=0,vh=0,dpr=1;
const lay={};
let cur=-1;
let T={s:1,tx:0,ty:0};
let hover=null,sel=null,drag=null;

function size(){vw=cv.clientWidth;vh=cv.clientHeight;dpr=window.devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;}
function resize(){size();if(cur>=0)fit(cur);draw();}
addEventListener('resize',resize);

const ROWH=108,GAP=40,PAD=14;
function computeLayout(i){
  const w=WORKFLOWS[i],n=w.nodes,e=w.edges;
  const layer={};n.forEach(x=>layer[x.id]=0);
  for(let k=0;k<n.length+8;k++){let ch=false;e.forEach(ed=>{if(layer[ed.to]<=layer[ed.from]){layer[ed.to]=layer[ed.from]+1;ch=true;}});if(!ch)break;}
  const byLayer={};n.forEach(x=>{(byLayer[layer[x.id]]=byLayer[layer[x.id]]||[]).push(x);});
  const lk=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  let maxW=0;
  lk.forEach(L=>{const row=byLayer[L];row.forEach(x=>{x.w=Math.max(78,Math.min(172,(x.label||x.id).length*7.8+30));x.h=30;if(x.shape==='diamond')x.w=Math.max(x.w,106);});const tw=row.reduce((s,x)=>s+x.w,0)+(row.length-1)*GAP;maxW=Math.max(maxW,tw);});
  const byId={};n.forEach(x=>byId[x.id]=x);
  lk.forEach(L=>{const row=byLayer[L];const tw=row.reduce((s,x)=>s+x.w,0)+(row.length-1)*GAP;let cx0=-tw/2;row.forEach(x=>{x.x=cx0+x.w/2;x.y=L*ROWH+PAD;cx0+=x.w+GAP;});});
  const H=lk.length*ROWH+10;
  lay[i]={byLayer,lk,maxW,H,byId,nodes:n,edges:e};
}
function nodeColor(n){return n.role?(ROLE_COLOR[n.role]||'#818cf8'):'#818cf8';}
function shapePath(x,y,w,h,shape){
  cx.beginPath();
  if(shape==='diamond'){const hw=w/2,hh=h*1.05;cx.moveTo(x,y-hh);cx.lineTo(x+hw,y);cx.lineTo(x,y+hh);cx.lineTo(x-hw,y);cx.closePath();}
  else if(shape==='circle'){cx.arc(x,y,Math.max(w/2,24),0,7);}
  else if(shape==='hex'){const hw=w/2,hh=h*1.15;cx.moveTo(x-hw+9,y-hh);cx.lineTo(x+hw-9,y-hh);cx.lineTo(x+hw,y);cx.lineTo(x+hw-9,y+hh);cx.lineTo(x-hw+9,y+hh);cx.lineTo(x-hw,y);cx.closePath();}
  else{cx.roundRect(x-w/2,y-h/2,w,h,shape==='round'?h/2:9);}
}
function wrap(t,x,y,max){
  t=String(t);const words=t.split(' ');let line='',lines=[];
  for(const wd of words){const test=line?line+' '+wd:wd;if(cx.measureText(test).width>max&&line){lines.push(line);line=wd;}else line=test;}
  lines.push(line);const lh=12,start=y-((lines.length-1)*lh)/2;
  lines.forEach((l,i)=>cx.fillText(l,x,start+i*lh));
}
function drawNode(n){
  const c=nodeColor(n);
  const selThis=sel&&sel.id===n.id,hovThis=hover&&hover.id===n.id;
  cx.save();
  if(selThis){cx.shadowColor=c;cx.shadowBlur=22;}
  cx.fillStyle=c;cx.globalAlpha=0.16;shapePath(n.x,n.y,n.w,n.h,n.shape);cx.fill();cx.globalAlpha=1;
  cx.strokeStyle=c;cx.lineWidth=hovThis?2.6:1.7;shapePath(n.x,n.y,n.w,n.h,n.shape);cx.stroke();
  cx.restore();
  cx.fillStyle='#e7eaf2';cx.font='600 11px system-ui';cx.textAlign='center';cx.textBaseline='middle';
  wrap(n.label,n.x,n.y,n.w-12);
  cx.fillStyle='rgba(148,163,184,0.66)';cx.font='500 8px ui-monospace';cx.fillText(n.id,n.x,n.y-n.h/2-7);
}
function drawEdge(e){
  const w=lay[cur],a=w.byId[e.from],b=w.byId[e.to];if(!a||!b)return;
  const x1=a.x,y1=a.y+a.h/2,x2=b.x,y2=b.y-b.h/2,my=(y1+y2)/2;
  cx.save();
  if(e.dashed)cx.setLineDash([5,5]);else cx.setLineDash([]);
  cx.strokeStyle='rgba(148,163,184,0.5)';cx.lineWidth=1.4;
  cx.beginPath();cx.moveTo(x1,y1);cx.bezierCurveTo(x1,my,x2,my,x2,y2);cx.stroke();cx.setLineDash([]);
  const ang=Math.atan2(y2-y1,x2-x1);
  cx.fillStyle='rgba(148,163,184,0.75)';
  cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2-9*Math.cos(ang-.4),y2-9*Math.sin(ang-.4));cx.lineTo(x2-9*Math.cos(ang+.4),y2-9*Math.sin(ang+.4));cx.closePath();cx.fill();
  if(e.label){cx.fillStyle='#9ca3af';cx.font='500 9px system-ui';cx.textAlign='center';cx.fillText(e.label,(x1+x2)/2,my-4);}
  cx.restore();
}
function draw(){
  cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,vw,vh);
  if(cur<0){cx.restore();return;}
  cx.setTransform(dpr*T.s,0,0,dpr*T.s,dpr*T.tx,dpr*T.ty);
  const L=lay[cur];L.edges.forEach(drawEdge);L.nodes.forEach(drawNode);
  cx.restore();
}
function toWorld(sx,sy){return{x:(sx-T.tx)/T.s,y:(sy-T.ty)/T.s};}
function fit(i){const L=lay[i];const s=Math.min(vw/(L.maxW+60),vh/(L.H+40),1.15);T.s=Math.max(s,0.12);T.tx=vw/2;T.ty=(vh-L.H*T.s)/2+10;}
function hit(sx,sy){const L=lay[cur];if(!L)return null;const p=toWorld(sx,sy);let best=null,bd=1e9;L.nodes.forEach(n=>{const d=Math.hypot(p.x-n.x,p.y-n.y);if(d<Math.max(n.w/2,30)+6&&d<bd){bd=d;best=n;}});return best;}
cv.addEventListener('mousemove',e=>{if(drag)return;hover=hit(e.clientX,e.clientY);draw();cv.style.cursor=hover?'pointer':'grab';});
cv.addEventListener('mousedown',e=>{drag={sx:e.clientX,sy:e.clientY,ox:T.tx,oy:T.ty};cv.style.cursor='grabbing';});
addEventListener('mouseup',()=>{drag=null;cv.style.cursor=hover?'pointer':'grab';});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?0.9:1.11;const m=toWorld(e.clientX,e.clientY);T.s=Math.max(0.12,Math.min(3,T.s*f));T.tx=e.clientX-m.x*T.s;T.ty=e.clientY-m.y*T.s;draw();},{passive:false});
cv.addEventListener('click',e=>{if(drag){drag=null;return;}const h=hit(e.clientX,e.clientY);if(h)showDetail(h);else hideDetail();draw();});
$('zin').onclick=()=>zoomBy(1.25);$('zout').onclick=()=>zoomBy(0.8);
$('mCanvas').onclick=()=>setMode('canvas');
$('mDoc').onclick=()=>setMode('doc');
function zoomBy(f){const m=toWorld(vw/2,vh/2);T.s=Math.max(0.12,Math.min(3,T.s*f));T.tx=vw/2-m.x*T.s;T.ty=vh/2-m.y*T.s;draw();}
$('zfit').onclick=()=>{if(cur>=0){fit(cur);draw();}};
$('zreset').onclick=showOverview;
$('prev').onclick=()=>{if(cur>0)openWorkflow(cur-1);};
$('next').onclick=()=>{if(cur<WORKFLOWS.length-1)openWorkflow(cur+1);};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(cur>=0)showOverview();else if(sel)hideDetail();}
  else if(e.key==='ArrowRight'&&cur<WORKFLOWS.length-1)openWorkflow(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)openWorkflow(cur-1);
});
function escHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showDetail(n){
  sel=n;const w=WORKFLOWS[cur];
  const ph=(w.phases&&n.p>=0)?w.phases[n.p]:null;
  const role=n.role?('<span class="chip" style="background:'+(ROLE_COLOR[n.role]||'#818cf8')+'">'+escHtml(n.role)+'</span>'):'—';
  const out=[];
  out.push('<div class="dh"><h3>'+escHtml(n.label)+'</h3><button class="x" onclick="window.closeDetail()">✕</button></div>');
  if(ph) out.push('<div class="ph"><b>Giai đoạn '+(n.p+1)+'</b> · '+escHtml(ph.title)+'</div>');
  out.push('<div class="row"><span class="k">Node ID</span><span class="v">'+n.id+'</span></div>');
  out.push('<div class="row"><span class="k">Hình dạng</span><span class="v">'+n.shape+'</span></div>');
  out.push('<div class="row"><span class="k">Vai trò</span><span class="v">'+role+'</span></div>');
  if(ph){
    if(ph.objective) out.push('<div class="blk"><div class="bk">Mục tiêu</div><div>'+escHtml(ph.objective)+'</div></div>');
    if(ph.trigger) out.push('<div class="blk"><div class="bk">Kích hoạt</div><div>'+escHtml(ph.trigger)+'</div></div>');
    if(ph.actions&&ph.actions.length) out.push('<div class="blk"><div class="bk">Các bước thực hiện</div><ol>'+ph.actions.slice(0,10).map(a=>'<li>'+escHtml(a)+'</li>').join('')+'</ol></div>');
    if(ph.actors&&ph.actors.length) out.push('<div class="blk"><div class="bk">Vai trò tham gia</div><ul>'+ph.actors.map(a=>'<li>'+escHtml(a)+'</li>').join('')+'</ul></div>');
    if(ph.criteria&&ph.criteria.length) out.push('<div class="blk"><div class="bk">Tiêu chí đạt</div><ul>'+ph.criteria.map(c=>'<li>'+escHtml(c)+'</li>').join('')+'</ul></div>');
  }
  const outs=w.edges.filter(e=>e.from===n.id),ins=w.edges.filter(e=>e.to===n.id);
  if(ins.length||outs.length){
    const flow=[];
    ins.forEach(e=>flow.push('⬅ <b>'+escHtml(e.from)+'</b>'+(e.label?' — '+escHtml(e.label):'')));
    outs.forEach(e=>flow.push('➡ <b>'+escHtml(e.to)+'</b>'+(e.label?' — '+escHtml(e.label):'')));
    out.push('<div class="blk"><div class="bk">Kết nối</div><div class="flow">'+flow.join('<br>')+'</div></div>');
  }
  out.push('<div style="text-align:center;margin-top:10px"><button class="mbtn" onclick="window.openDocFromNode()">📄 Xem toàn bộ tài liệu workflow</button></div>');
  detail.innerHTML=out.join('');detail.classList.add('open');
}
function hideDetail(){sel=null;detail.classList.remove('open');}
window.closeDetail=hideDetail;
function setMode(m){
  mode=m;
  $('mCanvas').classList.toggle('on',m==='canvas');
  $('mDoc').classList.toggle('on',m==='doc');
  doc.style.display=m==='doc'?'block':'none';
  cv.style.display=m==='canvas'?'block':'none';
  if(m==='doc'){ if(cur>=0)renderDoc(null); }
  else if(cur>=0)draw();
}
function renderDoc(phaseIdx){
  if(cur<0)return;
  const w=WORKFLOWS[cur];
  docInner.innerHTML='';
  const tb=document.createElement('div');tb.className='dtb';
  tb.innerHTML='<b>📄 '+escHtml(w.id.toUpperCase())+' — '+escHtml(w.title)+'</b>'
    +'<span class="sc" style="background:'+(SCOPE_COLOR[w.scope]||'var(--dim)')+'">'+(SCOPE_LABEL[w.scope]||'')+'</span>'
    +'<button class="mbtn" onclick="window.toCanvas()">🗺️ Xem sơ đồ</button>';
  docInner.appendChild(tb);
  const body=document.createElement('div');
  body.innerHTML=w.doc||'<p style="color:var(--muted)">Chưa có nội dung tài liệu.</p>';
  docInner.appendChild(body);
  const hs=[...body.querySelectorAll('h2,h3')];
  if(hs.length>2){
    const toc=document.createElement('details');toc.className='toc';
    const sum=document.createElement('summary');sum.textContent='📑 Mục lục ('+hs.length+' mục)';
    const ul=document.createElement('ul');
    hs.forEach((h,i)=>{h.id='h'+i;const li=document.createElement('li');li.className=h.tagName==='H3'?'lvl3':'';const a=document.createElement('a');a.textContent=h.textContent;a.onclick=()=>h.scrollIntoView({behavior:'smooth',block:'start'});li.appendChild(a);ul.appendChild(li);});
    toc.appendChild(sum);toc.appendChild(ul);
    body.insertBefore(toc,body.firstChild);
  }
  if(phaseIdx!=null){
    const target=hs.find(h=>new RegExp('(Phase|Giai đoạn)\\s*'+(phaseIdx+1)+'\\b').test(h.textContent));
    if(target)setTimeout(()=>target.scrollIntoView({block:'start'}),40);
  }
}
window.toCanvas=()=>setMode('canvas');
window.openDocFromNode=()=>{ if(cur<0)return; setMode('doc'); renderDoc(sel?sel.p:null); };
function buildTabs(){
  const ov=document.createElement('button');ov.className='tab';ov.textContent='🏠 Tổng quan';ov.onclick=showOverview;tabs.appendChild(ov);
  WORKFLOWS.forEach((w,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=escHtml(w.title)+' <span class="scope">· '+(SCOPE_LABEL[w.scope]||'')+'</span>';b.onclick=()=>openWorkflow(i);tabs.appendChild(b);});
}
function markTabs(){[...tabs.children].forEach((t,i)=>t.classList.toggle('active',i===cur+1));$('prev').disabled=cur<=0;$('next').disabled=cur>=WORKFLOWS.length-1;}
function openWorkflow(i){
  cur=i;if(!lay[i])computeLayout(i);
  ov.style.display='none';hideDetail();
  bTitle.textContent=WORKFLOWS[i].id.toUpperCase()+' · '+WORKFLOWS[i].title;
  bMeta.textContent=WORKFLOWS[i].nodes.length+' node · '+WORKFLOWS[i].edges.length+' nối · '+(SCOPE_LABEL[WORKFLOWS[i].scope]||'');
  markTabs();fit(i);
  if(mode==='doc'){ doc.style.display='block'; cv.style.display='none'; renderDoc(null); }
  else draw();
}
function showOverview(){
  setMode('canvas');
  cur=-1;hideDetail();ov.style.display='block';
  bTitle.textContent='Tổng quan hệ thống';bMeta.textContent=WORKFLOWS.length+' workflow · '+WORKFLOWS.reduce((s,w)=>s+w.nodes.length,0)+' node';
  markTabs();draw();
}
function buildCards(){
  const h=document.createElement('div');h.className='ovh';
  h.innerHTML='<h1>🔄 Hệ thống Workflow — EduCenter LMS</h1><p>'+WORKFLOWS.length+' quy trình nghiệp vụ, tự động layout trên Canvas. Nhấn vào thẻ để mở từng workflow, click node để xem chi tiết, kéo + lăn chuột để điều hướng.</p>';
  ov.appendChild(h);
  const grid=document.createElement('div');grid.className='ov';
  WORKFLOWS.forEach((w,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<span class="sc" style="background:'+SCOPE_COLOR[w.scope]+'">'+(SCOPE_LABEL[w.scope]||'')+'</span>'
      +'<h3>'+w.id.toUpperCase()+' — '+escHtml(w.title)+'</h3>'
      +'<div class="n">'+w.id+'</div>'
      +'<div class="meta">'+w.nodes.length+' node · '+w.edges.length+' nối'+(w.category?'<br>'+escHtml(w.category):'')+(w.phases?' · '+escHtml(w.phases)+' giai đoạn':'')+(w.estimated?'<br>'+escHtml(w.estimated):'')+'</div>'
      +'<div class="bar"><div style="width:'+Math.min(100,Math.round((i+1)/WORKFLOWS.length*100))+'%;background:'+wfAccent[w.id]+'"></div></div>';
    c.onclick=()=>openWorkflow(i);grid.appendChild(c);
  });
  ov.appendChild(grid);
}
function buildLegend(){
  const rows=['comp','finance','admin','system','teacher','student'].filter(r=>ROLE_COLOR[r]);
  let html='<b>Màu theo vai trò</b>';
  rows.forEach(r=>{html+='<div class="lrow"><span class="sw" style="background:'+ROLE_COLOR[r]+'"></span>'+r+'</div>';});
  html+='<div class="lrow" style="margin-top:6px"><span class="sw" style="background:var(--mvp)"></span>MVP</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p2)"></span>Roadmap P2</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p3)"></span>Roadmap P3</div>';
  legend.innerHTML=html;
}
size();buildTabs();buildCards();buildLegend();showOverview();
setTimeout(()=>{const ld=$('loading');if(ld)ld.remove();},100);
})();
</script>
</body>
</html>
