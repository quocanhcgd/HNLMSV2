<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduCenter LMS — Hệ thống Workflow (Canvas)</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#111a2e; --panel:#151f37; --panel2:#1b2742;
    --line:#23324f; --text:#e5e7eb; --muted:#94a3b8; --dim:#64748b;
    --accent:#6366f1; --accent2:#8b5cf6;
    --mvp:#34d399; --p2:#fbbf24; --p3:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(90deg,var(--bg2),var(--panel));border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .brand h1{font-size:15px;font-weight:700}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--text);border-color:var(--dim)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tab .scope{font-size:9px;opacity:.85}
  #navbtns{display:flex;gap:6px;margin-left:auto}
  .nbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:14px}
  .nbtn:hover{background:var(--panel2)}
  .nbtn:disabled{opacity:.35;cursor:default}

  main{position:relative;flex:1;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  #toolbar{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .tl{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .tl:hover{background:var(--panel2)}

  #legend{position:absolute;left:16px;bottom:16px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #legend .lrow{display:flex;align-items:center;gap:8px;margin:3px 0}
  #legend .sw{width:11px;height:11px;border-radius:3px}
  #legend b{color:var(--text);font-weight:600}

  #badge{position:absolute;left:16px;top:14px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #badge h2{font-size:14px;margin-bottom:2px}
  #badge .meta{color:var(--muted);font-size:11px}

  #detail{position:absolute;right:16px;top:14px;width:350px;max-height:calc(100% - 70px);overflow-y:auto;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  #detail.open{display:block}
  #detail .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #detail h3{font-size:13px}
  #detail .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:16px}
  #detail .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  #detail .row:last-child{border:none}
  #detail .k{color:var(--muted)}
  #detail .v{color:var(--text);text-align:right;max-width:150px}
  #detail .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600;color:#0b1220}
  #detail .ph{margin:6px 0 10px;padding:7px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel2);color:var(--text)}
  #detail .ph b{color:var(--accent)}
  #detail .blk{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  #detail .bk{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  #detail .blk ol,#detail .blk ul{margin:4px 0 0 16px;color:var(--text);line-height:1.5}
  #detail .blk li{margin:2px 0}
  #detail .flow{color:var(--text);line-height:1.6;font-size:11px}
  #detail .flow b{color:var(--muted)}

  #overview{position:absolute;inset:0;overflow:auto;padding:34px;z-index:4;background:
    radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.14), transparent),
    radial-gradient(900px 500px at 90% 10%, rgba(139,92,246,.12), transparent),
    var(--bg)}
  .ovh{max-width:1180px;margin:0 auto 22px}
  .ovh h1{font-size:24px;font-weight:800}
  .ovh p{color:var(--muted);margin-top:6px;max-width:760px;font-size:13px;line-height:1.6}
  .ov{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--dim);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card .sc{position:absolute;top:14px;right:14px;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;color:#0b1220}
  .card h3{font-size:15px;margin-bottom:6px;padding-right:70px}
  .card .n{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  .card .meta{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}
  .card .bar{height:4px;border-radius:99px;margin-top:12px;background:var(--line);overflow:hidden}
  .card .bar>div{height:100%;border-radius:99px}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;color:var(--dim);font-size:11px;background:rgba(17,26,46,.7);padding:4px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  #mode{display:flex;gap:6px}
  .mbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;white-space:nowrap;transition:.15s}
  .mbtn:hover{background:var(--panel2)}
  .mbtn.on{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:700}

  #doc{position:absolute;inset:0;overflow-y:auto;background:var(--bg);display:none;z-index:5;scrollbar-color:var(--line) transparent}
  #doc::-webkit-scrollbar{width:10px}
  #doc::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .doc-inner{max-width:900px;margin:0 auto;padding:24px 34px 90px;font-size:14px;line-height:1.75;color:#dbe2f0}
  .doc-inner h1{font-size:24px;font-weight:800;margin:10px 0 14px;color:#fff}
  .doc-inner h2{font-size:19px;font-weight:700;margin:30px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line);color:#fff;scroll-margin-top:84px}
  .doc-inner h3{font-size:16px;font-weight:700;margin:22px 0 8px;color:#fff;scroll-margin-top:84px}
  .doc-inner h4,.doc-inner h5,.doc-inner h6{font-size:14px;margin:16px 0 6px;color:#e7eaf2}
  .doc-inner p{margin:8px 0}
  .doc-inner ul,.doc-inner ol{margin:8px 0;padding-left:26px}
  .doc-inner li{margin:3px 0}
  .doc-inner .task{color:#6ee7b7;margin-right:4px}
  .doc-inner code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px;color:#f2c879}
  .doc-inner pre{background:#0c1322;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;max-height:460px;margin:12px 0}
  .doc-inner pre code{background:none;border:none;padding:0;color:#c8d3ea;font-size:12px;line-height:1.6}
  .doc-inner table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
  .doc-inner th,.doc-inner td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .doc-inner th{background:var(--panel2);color:#fff;font-weight:700}
  .doc-inner tr:nth-child(even) td{background:rgba(255,255,255,.025)}
  .doc-inner blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;color:#b6c2d9}
  .doc-inner .callout{margin:12px 0;padding:10px 14px;border-radius:10px;border-left:3px solid #3b82f6;background:var(--panel)}
  .doc-inner a{color:#7dd3fc;text-decoration:none}
  .doc-inner a:hover{text-decoration:underline}
  .doc-inner .wl{display:inline-block;background:rgba(129,140,248,.14);border:1px solid rgba(129,140,248,.35);color:#a5b4fc;border-radius:999px;padding:0 9px;font-size:12px;margin:0 1px}
  .doc-inner hr{border:none;border-top:1px solid var(--line);margin:20px 0}
  .doc-inner img{max-width:100%;border-radius:10px}
  .doc-inner .md-hint{margin:14px 0;padding:10px 14px;border:1px dashed var(--dim);border-radius:10px;color:var(--muted);font-size:12px;background:var(--panel)}
  .doc-inner .toc{margin:12px 0 6px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .doc-inner .toc summary{cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
  .doc-inner .toc ul{margin:8px 0 0;padding-left:0;list-style:none}
  .doc-inner .toc li{margin:3px 0}
  .doc-inner .toc a{color:#a5b4fc;cursor:pointer;font-size:12px}
  .doc-inner .toc a:hover{text-decoration:underline}
  .doc-inner .toc .lvl3{margin-left:16px}
  .dtb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:3}
  .dtb b{color:#fff;font-size:13px}
  .dtb .sc{margin-left:auto;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;color:#0b1220}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:20;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">📘</div>
      <div><h1>EduCenter LMS</h1><small>Hệ thống Workflow · Canvas</small></div>
    </div>
    <nav id="tabs"></nav>
    <div id="mode">
      <button class="mbtn on" id="mCanvas" title="Chế độ sơ đồ tương tác">🗺️ Sơ đồ</button>
      <button class="mbtn" id="mDoc" title="Chế độ tài liệu — render đầy đủ như Obsidian">📄 Tài liệu</button>
    </div>
    <div id="navbtns">
      <button class="nbtn" id="prev" title="Workflow trước">‹</button>
      <button class="nbtn" id="next" title="Workflow sau">›</button>
    </div>
  </header>

  <main>
    <div id="badge">
      <h2 id="bTitle">Tổng quan</h2>
      <div class="meta" id="bMeta"></div>
    </div>
    <div id="detail"></div>
    <canvas id="cv"></canvas>
    <div id="doc"><div class="doc-inner" id="docInner"></div></div>
    <div id="overview"></div>
    <div id="toolbar">
      <button class="tl" id="zin" title="Phóng to">＋</button>
      <button class="tl" id="zout" title="Thu nhỏ">－</button>
      <button class="tl" id="zfit" title="Vừa khung">⤢</button>
      <button class="tl" id="zreset" title="Trang chủ">⌂</button>
    </div>
    <div id="legend"></div>
    <div id="hint">Kéo = di chuyển · Lăn = zoom · Click node = chi tiết · 📄 Tài liệu = render đầy đủ như Obsidian · ←/→ hoặc Esc</div>
  </main>
</div>
<div id="loading">Đang tải…</div>

,"role":"","p":3},{"id":"OnlinePay","label":"Online Payment Gateway","shape":"rect","role":"","p":3},{"id":"CashPay","label":"Cash at Counter","shape":"rect","role":"","p":0},{"id":"BankPay","label":"Bank Transfer","shape":"rect","role":"","p":0},{"id":"VerifyPayment","label":"Verify Payment","shape":"rect","role":"","p":3},{"id":"RecordPayment","label":"Record Payment","shape":"rect","role":"","p":3},{"id":"IssueReceipt","label":"Issue Receipt","shape":"rect","role":"","p":0},{"id":"ActivateEnroll","label":"Activate Enrollment","shape":"rect","role":"","p":3},{"id":"SendWelcome","label":"Send Welcome Email","shape":"rect","role":"","p":4},{"id":"NotifyTeacher","label":"Notify Teacher","shape":"rect","role":"","p":4},{"id":"AddToClass","label":"Add to Class List","shape":"rect","role":"","p":4},{"id":"GrantAccess","label":"Grant LMS Access","shape":"rect","role":"","p":4},{"id":"End","label":"Student Active","shape":"round","role":"","p":4}],"edges":[{"from":"Start","to":"Contact","label":"","dashed":false},{"from":"Contact","to":"LP","label":"Landing Page Form","dashed":false},{"from":"Contact","to":"PC","label":"Phone Call","dashed":false},{"from":"Contact","to":"WI","label":"Walk-in","dashed":false},{"from":"Contact","to":"RF","label":"Referral","dashed":false},{"from":"LP","to":"LeadCreate","label":"","dashed":false},{"from":"PC","to":"LeadCreate","label":"","dashed":false},{"from":"WI","to":"LeadCreate","label":"","dashed":false},{"from":"RF","to":"LeadCreate","label":"","dashed":false},{"from":"LeadCreate","to":"Assign","label":"","dashed":false},{"from":"Assign","to":"Consult","label":"","dashed":false},{"from":"Consult","to":"ConsultOutcome","label":"","dashed":false},{"from":"ConsultOutcome","to":"Lost","label":"Not Interested","dashed":false},{"from":"ConsultOutcome","to":"FollowUp","label":"Needs Follow-up","dashed":false},{"from":"ConsultOutcome","to":"Assessment","label":"Ready to Enroll","dashed":false},{"from":"FollowUp","to":"Consult","label":"Later","dashed":true},{"from":"Assessment","to":"SelectClass","label":"No","dashed":false},{"from":"Assessment","to":"TakeTest","label":"Yes","dashed":false},{"from":"TakeTest","to":"GradeTest","label":"","dashed":false},{"from":"GradeTest","to":"TestResult","label":"","dashed":false},{"from":"TestResult","to":"Remedial","label":"Fail","dashed":false},{"from":"TestResult","to":"LevelPlace","label":"Pass","dashed":false},{"from":"Remedial","to":"TakeTest","label":"Later","dashed":true},{"from":"LevelPlace","to":"SelectClass","label":"","dashed":false},{"from":"SelectClass","to":"CheckCapacity","label":"","dashed":false},{"from":"CheckCapacity","to":"Waitlist","label":"Yes","dashed":false},{"from":"CheckCapacity","to":"CreateEnroll","label":"No","dashed":false},{"from":"Waitlist","to":"CreateEnroll","label":"Seat Available","dashed":true},{"from":"CreateEnroll","to":"GenInvoice","label":"","dashed":false},{"from":"GenInvoice","to":"NotifyPayment","label":"","dashed":false},{"from":"NotifyPayment","to":"PaymentMethod","label":"","dashed":false},{"from":"PaymentMethod","to":"OnlinePay","label":"Online","dashed":false},{"from":"PaymentMethod","to":"CashPay","label":"Cash","dashed":false},{"from":"PaymentMethod","to":"BankPay","label":"Bank Transfer","dashed":false},{"from":"OnlinePay","to":"VerifyPayment","label":"","dashed":false},{"from":"CashPay","to":"RecordPayment","label":"","dashed":false},{"from":"BankPay","to":"RecordPayment","label":"","dashed":false},{"from":"VerifyPayment","to":"RecordPayment","label":"","dashed":false},{"from":"RecordPayment","to":"IssueReceipt","label":"","dashed":false},{"from":"IssueReceipt","to":"ActivateEnroll","label":"","dashed":false},{"from":"ActivateEnroll","to":"SendWelcome","label":"","dashed":false},{"from":"SendWelcome","to":"NotifyTeacher","label":"","dashed":false},{"from":"NotifyTeacher","to":"AddToClass","label":"","dashed":false},{"from":"AddToClass","to":"GrantAccess","label":"","dashed":false},{"from":"GrantAccess","to":"End","label":"","dashed":false},{"from":"Lost","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-01-enrollment-journey-lead-to-student\">🎯 WF-01: Enrollment Journey (Lead to Student)\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §1 (entity/API/task/quy tắc) + \u003ccode>09-planning/task-prompts.md\u003c/code> · \u003cb>Scope\u003c/b>: ✅ MVP\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_01\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical Path \u003cbr> \u003cb>Phases\u003c/b>: 5 stages \u003cbr> \u003cb>Estimated Duration\u003c/b>: 3-7 days (normal), 1 day (express) \u003cbr> \u003cb>Frequency\u003c/b>: Daily \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Included\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Enrollment Journey là quy trình chuyển đổi từ \u003cb>potential lead\u003c/b> (người quan tâm) thành \u003cb>active student\u003c/b> (học viên đang học). Quy trình này trải qua nhiều touchpoints và vai trò khác nhau, từ marketing → tư vấn → test đầu vào → ghi danh → thanh toán → bắt đầu học.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Primary revenue driver\u003c/li>\u003cli>Customer acquisition funnel\u003c/li>\u003cli>Student lifecycle starting point\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-breakdown\">Phase Breakdown\u003c/h2>\n\u003ch3 id=\"phase-1-lead-capture-day-0\">Phase 1: Lead Capture (Day 0)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Capture potential customer information\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: \u003c/p>\u003cul>\u003cli>Form submission on landing page\u003c/li>\u003cli>Phone call to hotline\u003c/li>\u003cli>Walk-in to branch\u003c/li>\u003cli>Referral from existing student\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actors\u003c/b>: \u003c/p>\u003cul>\u003cli>Lead (potential customer)\u003c/li>\u003cli>\u003cspan class=\"wl\">Receptionist\u003c/span> / \u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/li>\u003cli>System (auto-capture from web form)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Capture contact information:\u003col start=\"1\">\u003cli>Full name\u003c/li>\u003cli>Phone number\u003c/li>\u003cli>Email (optional)\u003c/li>\u003cli>Interested program\u003c/li>\u003cli>Preferred contact time\u003c/li>\u003c/ol>\u003c/li>\u003cli>Source tracking (how did they find us?)\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Data Captured\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface Lead {\n  id: string;\n  full_name: string;\n  phone: string;\n  email?: string;\n  source: 'website' | 'phone' | 'walk-in' | 'referral' | 'social-media';\n  interested_program: string;\n  preferred_contact_time?: string;\n  notes?: string;\n  status: 'new' | 'contacted' | 'qualified' | 'lost';\n  assigned_consultant?: string;\n  created_at: Date;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Lead record created within 5 minutes of contact\u003c/li>\u003cli>All required fields populated\u003c/li>\u003cli>Auto-assigned to consultant based on rules\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-2-consultation-day-0-2\">Phase 2: Consultation (Day 0-2)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Understand needs, explain programs, qualify lead\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: New lead assigned to consultant\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003c/p>\u003cul>\u003cli>\u003cspan class=\"wl\">Admission Consultant\u003c/span> (primary)\u003c/li>\u003cli>Lead\u003c/li>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> (for program details)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Consultant contacts lead (phone/email)\u003c/li>\u003cli>Schedule consultation meeting (in-person or video)\u003c/li>\u003cli>During consultation:\u003col start=\"1\">\u003cli>Understand student background and goals\u003c/li>\u003cli>Explain program options\u003c/li>\u003cli>Discuss schedule and pricing\u003c/li>\u003cli>Address questions and concerns\u003c/li>\u003c/ol>\u003c/li>\u003cli>Update lead status and notes\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Consultation Checklist\u003c/b>:\u003c/p>\u003cul>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Student background assessed\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Learning goals identified\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Program recommendation made\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Schedule compatibility confirmed\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Pricing discussed\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Questions answered\u003c/li>\u003cli>\u003cspan class=\"task\">☐\u003c/span> Next steps explained\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Outcomes\u003c/b>:\u003c/p>\u003cul>\u003cli>✅ \u003cb>Qualified\u003c/b>: Ready to proceed → Phase 3\u003c/li>\u003cli>📅 \u003cb>Follow-up\u003c/b>: Needs time to decide → Schedule callback\u003c/li>\u003cli>❌ \u003cb>Unqualified\u003c/b>: Not interested / not fit → Mark as lost\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>First contact within 24 hours of lead creation\u003c/li>\u003cli>Consultation completed within 48 hours\u003c/li>\u003cli>Clear outcome documented\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-3-assessment-day-2-3---optional\">Phase 3: Assessment (Day 2-3) - Optional\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Evaluate student level for appropriate class placement\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: Lead qualified and assessment required\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003c/p>\u003cul>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> or \u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/li>\u003cli>Lead (test taker)\u003c/li>\u003cli>\u003cspan class=\"wl\">Admission Consultant\u003c/span> (coordination)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Schedule assessment test\u003c/li>\u003cli>Lead takes entrance test:\u003col start=\"1\">\u003cli>Written test (grammar, vocabulary)\u003c/li>\u003cli>Listening test\u003c/li>\u003cli>Speaking test (interview)\u003c/li>\u003c/ol>\u003c/li>\u003cli>Determine proficiency level\u003c/li>\u003cli>Recommend appropriate class level\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Assessment Data\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface Assessment {\n  id: string;\n  lead_id: string;\n  assessment_type: 'entrance' | 'placement';\n  scheduled_at: Date;\n  completed_at?: Date;\n  scores: {\n    listening?: number;\n    reading?: number;\n    writing?: number;\n    speaking?: number;\n    total: number;\n  };\n  level_placement: 'beginner' | 'elementary' | 'intermediate' | 'advanced';\n  recommendations: string;\n  assessed_by: string;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Placement Rules\u003c/b>:\u003c/p>\u003cul>\u003cli>Total score 0-30%: Beginner\u003c/li>\u003cli>Total score 31-50%: Elementary  \u003c/li>\u003cli>Total score 51-75%: Intermediate\u003c/li>\u003cli>Total score 76-100%: Advanced\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Outcomes\u003c/b>:\u003c/p>\u003cul>\u003cli>✅ \u003cb>Passed\u003c/b>: Placed in appropriate level → Phase 4\u003c/li>\u003cli>❌ \u003cb>Below threshold\u003c/b>: Recommend preparatory course → Consultation\u003c/li>\u003cli>⏸️ \u003cb>Incomplete\u003c/b>: Reschedule test\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Test scheduled within 2 days of qualification\u003c/li>\u003cli>Results available within 24 hours of test completion\u003c/li>\u003cli>Clear level recommendation provided\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-4-enrollment-payment-day-3-5\">Phase 4: Enrollment &amp; Payment (Day 3-5)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Complete enrollment and secure payment\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: Class level determined and class selected\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003c/p>\u003cul>\u003cli>\u003cspan class=\"wl\">Admission Consultant\u003c/span> or \u003cspan class=\"wl\">Receptionist\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"wl\">Finance Officer\u003c/span>\u003c/li>\u003cli>Lead (becoming student)\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> (approval if special case)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\n\u003cp>\u003cb>4.1 Select Class\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Consultant shows available classes for appropriate level\u003c/li>\u003cli>Lead selects preferred:\u003col start=\"1\">\u003cli>Schedule (day/time)\u003c/li>\u003cli>Teacher preference (if available)\u003c/li>\u003cli>Branch location\u003c/li>\u003c/ol>\u003c/li>\u003cli>If full, offer waitlist or alternative class\u003c/li>\u003c/ol>\n\u003cp>\u003cb>4.2 Create Enrollment\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Consultant creates enrollment record\u003c/li>\u003cli>System generates invoice automatically:\u003col start=\"1\">\u003cli>Program fee\u003c/li>\u003cli>Registration fee\u003c/li>\u003cli>Material fee\u003c/li>\u003cli>Discount (if applicable)\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>4.3 Payment Collection\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Present invoice to lead\u003c/li>\u003cli>Explain payment options:\u003col start=\"1\">\u003cli>\u003cb>Online\u003c/b>: VNPay / Momo\u003c/li>\u003cli>\u003cb>Cash\u003c/b>: At counter\u003c/li>\u003cli>\u003cb>Bank Transfer\u003c/b>: Provide account details\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>4.4 Payment Processing\u003c/b>\u003c/p>\n\u003cp>\u003cb>Option A: Online Payment\u003c/b>\u003c/p>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003cp>\u003cb>Option B: Cash Payment\u003c/b>\u003c/p>\u003cul>\u003cli>Finance Officer receives cash\u003c/li>\u003cli>Issues physical receipt\u003c/li>\u003cli>Records payment in system\u003c/li>\u003cli>Updates invoice status to \u003ccode>Paid\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Option C: Bank Transfer\u003c/b>\u003c/p>\u003cul>\u003cli>Provide bank account details\u003c/li>\u003cli>Lead transfers money\u003c/li>\u003cli>Finance Officer checks bank statement\u003c/li>\u003cli>Matches transaction to invoice\u003c/li>\u003cli>Records payment\u003c/li>\u003cli>Updates invoice status\u003c/li>\u003c/ul>\n\u003cp>\u003cb>4.5 Payment Verification\u003c/b>\u003c/p>\u003cul>\u003cli>Verify payment received and amount correct\u003c/li>\u003cli>Generate official receipt\u003c/li>\u003cli>Send receipt via email\u003c/li>\u003cli>Update enrollment status to \u003ccode>Active\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Enrollment Data\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface Enrollment {\n  id: string;\n  student_id: string;\n  class_id: string;\n  enrolled_at: Date;\n  status: 'pending_payment' | 'active' | 'completed' | 'cancelled';\n  invoice_id: string;\n  payment_status: 'pending' | 'partial' | 'paid';\n  start_date: Date;\n  expected_end_date: Date;\n}\n\ninterface Invoice {\n  id: string;\n  invoice_number: string;\n  enrollment_id: string;\n  amount_total: number;\n  amount_paid: number;\n  amount_due: number;\n  due_date: Date;\n  status: 'pending' | 'paid' | 'overdue' | 'cancelled';\n  line_items: {\n    description: string;\n    amount: number;\n  }[];\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Enrollment created within same day as class selection\u003c/li>\u003cli>Invoice generated automatically\u003c/li>\u003cli>Payment processed successfully\u003c/li>\u003cli>Receipt issued within 1 hour of payment\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-5-activation-onboarding-day-5-7\">Phase 5: Activation &amp; Onboarding (Day 5-7)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Complete student setup and ensure ready to start learning\u003c/p>\n\u003cp>\u003cb>Trigger\u003c/b>: Payment confirmed and enrollment activated\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003c/p>\u003cul>\u003cli>System (automated)\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> or \u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/li>\u003cli>New \u003cspan class=\"wl\">Student\u003c/span>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\n\u003cp>\u003cb>5.1 System Activation\u003c/b> (Automated)\u003c/p>\u003col start=\"1\">\u003cli>Enrollment status: \u003ccode>Active\u003c/code>\u003c/li>\u003cli>Generate student login credentials\u003c/li>\u003cli>Send welcome email with:\u003col start=\"1\">\u003cli>Login instructions\u003c/li>\u003cli>Class details (schedule, location, teacher)\u003c/li>\u003cli>First day information\u003c/li>\u003cli>System quick start guide\u003c/li>\u003c/ol>\u003c/li>\u003cli>Notify teacher of new student\u003c/li>\u003c/ol>\n\u003cp>\u003cb>5.2 Teacher Notification\u003c/b>\u003c/p>\u003cul>\u003cli>Teacher receives email/notification\u003c/li>\u003cli>New student appears in class list\u003c/li>\u003cli>Teacher can view student profile\u003c/li>\u003cli>Teacher prepares for new student arrival\u003c/li>\u003c/ul>\n\u003cp>\u003cb>5.3 Student LMS Access\u003c/b>\u003c/p>\u003cul>\u003cli>Student receives login credentials\u003c/li>\u003cli>Student logs in to portal\u003c/li>\u003cli>Student can view:\u003cul>\u003cli>Class schedule\u003c/li>\u003cli>Learning materials (if uploaded)\u003c/li>\u003cli>Course syllabus\u003c/li>\u003cli>Teacher information\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>5.4 First Day Preparation\u003c/b>\u003c/p>\u003cul>\u003cli>Send reminder 1 day before first class\u003c/li>\u003cli>Include:\u003cul>\u003cli>Exact location (room number)\u003c/li>\u003cli>What to bring (notebook, pen)\u003c/li>\u003cli>Contact person if lost\u003c/li>\u003cli>Parking/transportation info\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Welcome Email Template\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-txt\">Subject: Welcome to [School Name] - Your Class Starts Soon! 🎉\n\nDear [Student Name],\n\nCongratulations! You are now enrolled in [Class Name].\n\n📅 Class Schedule:\n- Start Date: [Date]\n- Days: [Monday, Wednesday]\n- Time: [18:00 - 19:30]\n- Location: [Branch Name - Room 201]\n\n👨‍🏫 Your Teacher: [Teacher Name]\n\n🔑 Login to Student Portal:\n- URL: https://lms.school.edu.vn\n- Username: [email]\n- Temporary Password: [password]\n(Please change password on first login)\n\n📚 Before Your First Class:\n1. Login to portal and complete your profile\n2. Review the course syllabus\n3. Check your class schedule\n4. Download any pre-class materials\n\n📞 Need Help?\nContact us at [phone] or reply to this email.\n\nSee you in class!\n\n[School Name] Team\u003c/code>\u003c/pre>\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Welcome email sent within 1 hour of payment\u003c/li>\u003cli>Student credentials working\u003c/li>\u003cli>Student can access portal\u003c/li>\u003cli>Teacher notified\u003c/li>\u003cli>Student attended first class\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"role-participation-matrix\">Role Participation Matrix\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Phase\u003c/th>\u003cth style=\"text-align:left\">Primary Role\u003c/th>\u003cth style=\"text-align:left\">Supporting Roles\u003c/th>\u003cth style=\"text-align:left\">Approval Required\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">Lead Capture\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Receptionist\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">No\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Consultation\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">No\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Assessment\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">No\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Enrollment\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Finance Officer\u003c/span>, \u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">Special cases only\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Payment\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Finance Officer\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Receptionist\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">No (auto)\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Activation\u003c/td>\u003ctd style=\"text-align:left\">System (auto)\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Branch Manager\u003c/span>, \u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"decision-points\">Decision Points\u003c/h2>\n\u003ch3 id=\"decision-1-assessment-required\">Decision 1: Assessment Required?\u003c/h3>\u003cp>\u003cb>Context\u003c/b>: Some programs require placement test, others don't\u003c/p>\n\u003cp>\u003cb>Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Language programs (English, etc.): \u003cb>Yes\u003c/b>\u003c/li>\u003cli>Skill-based programs (IT, Design): \u003cb>Optional\u003c/b>\u003c/li>\u003cli>Beginner-level courses: \u003cb>No\u003c/b> (assume zero knowledge)\u003c/li>\u003cli>Advanced courses: \u003cb>Yes\u003c/b> (verify qualification)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Decision made by\u003c/b>: \u003cspan class=\"wl\">Admission Consultant\u003c/span> based on program rules\u003c/p>\n\u003chr>\n\u003ch3 id=\"decision-2-class-selection\">Decision 2: Class Selection\u003c/h3>\u003cp>\u003cb>Context\u003c/b>: Multiple classes available at different times\u003c/p>\n\u003cp>\u003cb>Factors\u003c/b>:\u003c/p>\u003cul>\u003cli>Student schedule preference\u003c/li>\u003cli>Class capacity\u003c/li>\u003cli>Teacher availability\u003c/li>\u003cli>Branch location\u003c/li>\u003cli>Price tier (if different)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Decision made by\u003c/b>: Lead, advised by \u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/p>\n\u003chr>\n\u003ch3 id=\"decision-3-payment-method\">Decision 3: Payment Method\u003c/h3>\u003cp>\u003cb>Context\u003c/b>: How will student pay?\u003c/p>\n\u003cp>\u003cb>Options\u003c/b>:\u003c/p>\u003cul>\u003cli>\u003cb>Online\u003c/b>: Instant, convenient, but requires bank account/card\u003c/li>\u003cli>\u003cb>Cash\u003c/b>: Immediate, no fees, requires in-person visit\u003c/li>\u003cli>\u003cb>Bank Transfer\u003c/b>: Good for large amounts, 1-2 days delay\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Decision made by\u003c/b>: Lead (student preference)\u003c/p>\n\u003chr>\n\u003ch2 id=\"integration-points\">Integration Points\u003c/h2>\n\u003ch3 id=\"1-payment-gateway-vnpay-momo\">1. Payment Gateway (VNPay / Momo)\u003c/h3>\n\u003cp>\u003cb>Flow\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-txt\">LMS → Generate payment link → Gateway → Student pays → Webhook → LMS updates status\u003c/code>\u003c/pre>\u003cp>\u003cb>Key Requirements\u003c/b>:\u003c/p>\u003cul>\u003cli>Idempotent webhook processing\u003c/li>\u003cli>Signature validation\u003c/li>\u003cli>Timeout handling (15 minutes)\u003c/li>\u003cli>Reconciliation for failed notifications\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"2-emailsms-notifications\">2. Email/SMS Notifications\u003c/h3>\n\u003cp>\u003cb>Trigger Events\u003c/b>:\u003c/p>\u003cul>\u003cli>Lead captured → Consultant notification\u003c/li>\u003cli>Consultation scheduled → Lead reminder\u003c/li>\u003cli>Invoice created → Payment link sent\u003c/li>\u003cli>Payment received → Receipt sent\u003c/li>\u003cli>Enrollment activated → Welcome email\u003c/li>\u003cli>First class reminder → 1 day before\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"3-accounting-system-if-addon\">3. Accounting System (If addon)\u003c/h3>\n\u003cp>\u003cb>Data Sync\u003c/b>:\u003c/p>\u003cul>\u003cli>Invoice created → Export to accounting\u003c/li>\u003cli>Payment recorded → Sync transaction\u003c/li>\u003cli>Reconciliation daily → Match records\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"exception-handling\">Exception Handling\u003c/h2>\n\u003ch3 id=\"exception-1-class-full\">Exception 1: Class Full\u003c/h3>\u003cp>\u003cb>Scenario\u003c/b>: Student wants to enroll but class is at capacity\u003c/p>\n\u003cp>\u003cb>Options\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>\u003cb>Waitlist\u003c/b>: Add to waitlist, notify when space available\u003c/li>\u003cli>\u003cb>Alternative Class\u003c/b>: Offer different time/day at same level\u003c/li>\u003cli>\u003cb>New Class\u003c/b>: If enough waitlist, open new class\u003c/li>\u003cli>\u003cb>Defer\u003c/b>: Enroll for next term\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Handled by\u003c/b>: \u003cspan class=\"wl\">Admission Consultant\u003c/span>\u003c/p>\n\u003chr>\n\u003ch3 id=\"exception-2-payment-failed\">Exception 2: Payment Failed\u003c/h3>\u003cp>\u003cb>Scenario\u003c/b>: Online payment attempted but failed\u003c/p>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Show error message to student\u003c/li>\u003cli>Log failure reason\u003c/li>\u003cli>Offer alternative payment method\u003c/li>\u003cli>Hold enrollment for 24 hours\u003c/li>\u003cli>If unpaid, release class seat and notify student\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Handled by\u003c/b>: System (auto) + \u003cspan class=\"wl\">Finance Officer\u003c/span> (manual follow-up)\u003c/p>\n\u003chr>\n\u003ch3 id=\"exception-3-test-score-below-minimum\">Exception 3: Test Score Below Minimum\u003c/h3>\u003cp>\u003cb>Scenario\u003c/b>: Student wants advanced class but test score too low\u003c/p>\n\u003cp>\u003cb>Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Explain results and gap\u003c/li>\u003cli>Recommend appropriate level class\u003c/li>\u003cli>Offer preparatory/remedial course\u003c/li>\u003cli>Set expectations for progression timeline\u003c/li>\u003cli>Option to retake test after study (min 1 month gap)\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Handled by\u003c/b>: \u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/p>\n\u003chr>\n\u003ch3 id=\"exception-4-enrollment-after-class-started\">Exception 4: Enrollment After Class Started\u003c/h3>\u003cp>\u003cb>Scenario\u003c/b>: Student wants to join class that already began\u003c/p>\n\u003cp>\u003cb>Rules\u003c/b>:\u003c/p>\u003cul>\u003cli>\u003cb>Week 1-2\u003c/b>: Allowed with \u003cspan class=\"wl\">Branch Manager\u003c/span> approval\u003c/li>\u003cli>\u003cb>Week 3+\u003c/b>: Not allowed, must wait for next term\u003c/li>\u003cli>Prorated fees if joining late\u003c/li>\u003cli>Student responsible for catching up on missed content\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Handled by\u003c/b>: \u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/p>\n\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"conversion-metrics\">Conversion Metrics\u003c/h3>\u003cul>\u003cli>\u003cb>Lead to Consultation\u003c/b>: Target 80% within 48 hours\u003c/li>\u003cli>\u003cb>Consultation to Assessment\u003c/b>: Target 60%\u003c/li>\u003cli>\u003cb>Assessment to Enrollment\u003c/b>: Target 70%\u003c/li>\u003cli>\u003cb>Enrollment to Payment\u003c/b>: Target 95%\u003c/li>\u003cli>\u003cb>Overall Lead to Student\u003c/b>: Target 40%\u003c/li>\u003c/ul>\n\u003ch3 id=\"time-metrics\">Time Metrics\u003c/h3>\u003cul>\u003cli>\u003cb>Lead Response Time\u003c/b>: &lt; 24 hours\u003c/li>\u003cli>\u003cb>Consultation to Enrollment\u003c/b>: &lt; 5 days\u003c/li>\u003cli>\u003cb>Payment to Activation\u003c/b>: &lt; 1 hour (online), &lt; 4 hours (offline)\u003c/li>\u003cli>\u003cb>Total Cycle Time\u003c/b>: &lt; 7 days (target), 3 days (express)\u003c/li>\u003c/ul>\n\u003ch3 id=\"quality-metrics\">Quality Metrics\u003c/h3>\u003cul>\u003cli>\u003cb>Show-up Rate\u003c/b>: % of enrolled students attending first class (target 95%)\u003c/li>\u003cli>\u003cb>Payment Success Rate\u003c/b>: % of online payments succeeding (target 98%)\u003c/li>\u003cli>\u003cb>Data Accuracy\u003c/b>: % of enrollments with complete information (target 100%)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"process-improvements\">Process Improvements\u003c/h2>\n\u003ch3 id=\"quick-wins\">Quick Wins\u003c/h3>\u003col start=\"1\">\u003cli>\u003cb>Auto-assign consultant\u003c/b> based on availability and workload\u003c/li>\u003cli>\u003cb>Template messages\u003c/b> for common consultation scenarios\u003c/li>\u003cli>\u003cb>Online scheduling\u003c/b> for assessments\u003c/li>\u003cli>\u003cb>Payment reminders\u003c/b> (24h, 48h, 72h)\u003c/li>\u003cli>\u003cb>First class reminder\u003c/b> (SMS + Email)\u003c/li>\u003c/ol>\n\u003ch3 id=\"future-enhancements-post-mvp\">Future Enhancements (Post-MVP)\u003c/h3>\u003col start=\"1\">\u003cli>\u003cb>Lead scoring\u003c/b> - Prioritize high-intent leads\u003c/li>\u003cli>\u003cb>Automated follow-up\u003c/b> - Drip campaign for \"Follow-up\" leads\u003c/li>\u003cli>\u003cb>Virtual tours\u003c/b> - Video preview of facilities\u003c/li>\u003cli>\u003cb>Trial class\u003c/b> - Free trial before commitment\u003c/li>\u003cli>\u003cb>Installment payments\u003c/b> - Pay in 2-3 installments\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-02 Teaching &amp;amp; Learning Cycle\u003c/span> - What happens after enrollment\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-03 Financial Operations\u003c/span> - Detailed payment processing\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-10 Student Self-Service\u003c/span> - Student portal usage\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Admission Consultant\u003c/span> - Primary driver\u003c/li>\u003cli>\u003cspan class=\"wl\">Receptionist\u003c/span> - First contact\u003c/li>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> - Assessment\u003c/li>\u003cli>\u003cspan class=\"wl\">Finance Officer\u003c/span> - Payment handling\u003c/li>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> - Program recommendations\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> - Approvals\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - End beneficiary\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"appendices\">Appendices\u003c/h2>\n\u003ch3 id=\"appendix-a-sample-timeline-typical-case\">Appendix A: Sample Timeline (Typical Case)\u003c/h3>\u003cpre>\u003ccode class=\"lang-txt\">Day 0: Lead submits form on website at 10:00 AM\n       → Auto-assigned to Consultant A at 10:01 AM\n       → Consultant calls at 11:30 AM\n       → Consultation scheduled for Day 1 at 6:00 PM\n\nDay 1: Consultation conducted (in-person, 45 minutes)\n       → Lead interested in English Intermediate program\n       → Assessment required\n       → Test scheduled for Day 2 at 10:00 AM\n\nDay 2: Lead takes placement test (1 hour)\n       → Teacher grades test (30 minutes)\n       → Result: Intermediate level confirmed\n       → Consultant presents class options\n       → Lead selects Class B (Mon/Wed 6-7:30 PM)\n\nDay 3: Enrollment created\n       → Invoice generated (5,000,000 VND)\n       → Lead chooses online payment\n       → Pays via VNPay at 2:00 PM\n       → Payment confirmed at 2:02 PM\n       → Welcome email sent at 2:05 PM\n       → Teacher notified at 2:10 PM\n\nDay 4-6: Lead logs into student portal\n         → Reviews class materials\n         → Prepares for first class\n\nDay 7: First class attended\n       → Enrollment journey complete ✅\u003c/code>\u003c/pre>\u003ch3 id=\"appendix-b-lead-sources-conversion-rates\">Appendix B: Lead Sources &amp; Conversion Rates\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Source\u003c/th>\u003cth style=\"text-align:left\">% of Leads\u003c/th>\u003cth style=\"text-align:left\">Conversion Rate\u003c/th>\u003cth style=\"text-align:left\">Avg Time to Close\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">Website Form\u003c/td>\u003ctd style=\"text-align:left\">40%\u003c/td>\u003ctd style=\"text-align:left\">35%\u003c/td>\u003ctd style=\"text-align:left\">5 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Facebook Ads\u003c/td>\u003ctd style=\"text-align:left\">25%\u003c/td>\u003ctd style=\"text-align:left\">28%\u003c/td>\u003ctd style=\"text-align:left\">7 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Referral\u003c/td>\u003ctd style=\"text-align:left\">20%\u003c/td>\u003ctd style=\"text-align:left\">55%\u003c/td>\u003ctd style=\"text-align:left\">3 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Walk-in\u003c/td>\u003ctd style=\"text-align:left\">10%\u003c/td>\u003ctd style=\"text-align:left\">65%\u003c/td>\u003ctd style=\"text-align:left\">2 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Phone Call\u003c/td>\u003ctd style=\"text-align:left\">5%\u003c/td>\u003ctd style=\"text-align:left\">40%\u003c/td>\u003ctd style=\"text-align:left\">4 days\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cb>Insight\u003c/b>: Referrals have highest conversion and fastest close. Invest in referral program.\u003c/p>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Academic Manager, Finance Officer \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_01","file":"WF-02 Teaching & Learning Cycle.md","title":"WF-02: Teaching & Learning Cycle","category":"critical","phases":[{"title":"Pre-Class Preparation (Before Session)","objective":"Teacher prepares materials and students preview content","trigger":"","actors":["Teacher, Student, System"],"actions":["Prepare teaching materials","Upload materials to LMS","System notifies students","Receive notification","Download materials"],"criteria":["Materials uploaded at least 24 hours before class","All students notified","At least 70% of students preview materials"]},{"title":"Class Session Delivery (During Session)","objective":"Deliver effective instruction and facilitate learning","trigger":"","actors":["Teacher, Student"],"actions":[],"criteria":["95%+ attendance rate","All students participated","Learning objectives achieved","Session notes documented"]},{"title":"Assignment & Homework (After Session)","objective":"Reinforce learning through practice","trigger":"","actors":["Teacher, Student"],"actions":["Assignment details","Receive notification","See assignment","Upload file","See confirmation"],"criteria":["Assignment created same day as class","Clear instructions provided","90%+ submission rate","Submissions on time"]},{"title":"Grading & Feedback (Teacher Review)","objective":"Assess student work and provide constructive feedback","trigger":"","actors":["Teacher"],"actions":["See submission list","Click on student","Review work","Calculate score","Write feedback","Review grade distribution"],"criteria":["All submissions graded within 7 days","Constructive feedback provided","Grade distribution reasonable","Students receive detailed comments"]},{"title":"Progress Tracking (Continuous)","objective":"Monitor student learning progress and identify needs","trigger":"","actors":["Teacher, Academic Manager, Student"],"actions":["View class dashboard","Individual student view","Identify struggling student","Review details","Take action","See dashboard","Progress bar","Strengths","Areas to improve"],"criteria":["Progress tracked after each session","At-risk students identified early","Interventions documented","85%+ students on track"]},{"title":"Course Completion (End of Term)","objective":"Assess overall learning and issue completion certificates","trigger":"","actors":["Teacher, Academic Manager, Student"],"actions":["Teacher creates final exam","Calculate final course grade","System generates completion statistics","Issue certificates","Gather student feedback","Teacher reflection"],"criteria":["80%+ completion rate","90%+ passing rate (of completers)","4.0/5+ average student satisfaction","Certificates issued within 1 week","Lessons learned documented"]}],"estimated":"Ongoing (per class session)","scope":"MVP","nodes":[{"id":"Start","label":"Class Session Start","shape":"round","role":"","p":1},{"id":"Prep","label":"Teacher Preparation","shape":"rect","role":"","p":0},{"id":"Upload","label":"Upload Materials","shape":"rect","role":"","p":0},{"id":"Notify","label":"Notify Students","shape":"rect","role":"","p":0},{"id":"PreClass","label":"Student Pre-Class Study","shape":"rect","role":"","p":0},{"id":"SessionStart","label":"Class Session Begins","shape":"rect","role":"","p":1},{"id":"Attendance","label":"Mark Attendance","shape":"rect","role":"","p":0},{"id":"Deliver","label":"Deliver Lesson","shape":"rect","role":"","p":1},{"id":"Interact","label":"Student Interaction","shape":"rect","role":"","p":3},{"id":"Practice","label":"Practice Activities","shape":"rect","role":"","p":2},{"id":"QA","label":"Q&A Session","shape":"rect","role":"","p":1},{"id":"SessionEnd","label":"Session Ends","shape":"rect","role":"","p":1},{"id":"Notes","label":"Teacher Notes","shape":"rect","role":"","p":3},{"id":"Assignment","label":"Has Assignment?","shape":"diamond","role":"","p":2},{"id":"CreateAssign","label":"Create Assignment","shape":"rect","role":"","p":2},{"id":"NextPrep","label":"Next Session Prep","shape":"rect","role":"","p":1},{"id":"StudSubmit","label":"Students Submit","shape":"rect","role":"","p":0},{"id":"Grade","label":"Teacher Grades","shape":"rect","role":"","p":3},{"id":"Feedback","label":"Provide Feedback","shape":"rect","role":"","p":3},{"id":"UpdateProgress","label":"Update Progress","shape":"rect","role":"","p":4},{"id":"CheckComplete","label":"Course Complete?","shape":"diamond","role":"","p":5},{"id":"FinalAssess","label":"Final Assessment","shape":"rect","role":"","p":5},{"id":"Certificate","label":"Issue Certificate","shape":"rect","role":"","p":5},{"id":"End","label":"Course Completed","shape":"round","role":"","p":5}],"edges":[{"from":"Start","to":"Prep","label":"","dashed":false},{"from":"Prep","to":"Upload","label":"","dashed":false},{"from":"Upload","to":"Notify","label":"","dashed":false},{"from":"Notify","to":"PreClass","label":"","dashed":false},{"from":"PreClass","to":"SessionStart","label":"","dashed":false},{"from":"SessionStart","to":"Attendance","label":"","dashed":false},{"from":"Attendance","to":"Deliver","label":"","dashed":false},{"from":"Deliver","to":"Interact","label":"","dashed":false},{"from":"Interact","to":"Practice","label":"","dashed":false},{"from":"Practice","to":"QA","label":"","dashed":false},{"from":"QA","to":"SessionEnd","label":"","dashed":false},{"from":"SessionEnd","to":"Notes","label":"","dashed":false},{"from":"Notes","to":"Assignment","label":"","dashed":false},{"from":"Assignment","to":"CreateAssign","label":"Yes","dashed":false},{"from":"Assignment","to":"NextPrep","label":"No","dashed":false},{"from":"CreateAssign","to":"StudSubmit","label":"","dashed":false},{"from":"StudSubmit","to":"Grade","label":"","dashed":false},{"from":"Grade","to":"Feedback","label":"","dashed":false},{"from":"Feedback","to":"UpdateProgress","label":"","dashed":false},{"from":"Assignment","to":"UpdateProgress","label":"No","dashed":false},{"from":"UpdateProgress","to":"CheckComplete","label":"","dashed":false},{"from":"CheckComplete","to":"NextPrep","label":"No","dashed":false},{"from":"CheckComplete","to":"FinalAssess","label":"Yes","dashed":false},{"from":"NextPrep","to":"Prep","label":"","dashed":false},{"from":"FinalAssess","to":"Certificate","label":"","dashed":false},{"from":"Certificate","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-02-teaching-learning-cycle\">📚 WF-02: Teaching &amp; Learning Cycle\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §2 · \u003cb>Scope\u003c/b>: ✅ MVP\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_02\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - Core Operations \u003cbr> \u003cb>Phases\u003c/b>: 6 recurring stages \u003cbr> \u003cb>Duration\u003c/b>: Ongoing throughout course \u003cbr> \u003cb>Frequency\u003c/b>: Daily/Weekly \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Included\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Teaching &amp; Learning Cycle là quy trình core của LMS, diễn ra liên tục trong suốt khóa học. Workflow này bao gồm teacher preparation, content delivery, student engagement, assessment, feedback, và progress tracking.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Core value delivery to students\u003c/li>\u003cli>Determines learning outcomes\u003c/li>\u003cli>Drives student satisfaction và retention\u003c/li>\u003cli>Foundation for academic reputation\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-breakdown\">Phase Breakdown\u003c/h2>\n\u003ch3 id=\"phase-1-pre-class-preparation-before-session\">Phase 1: Pre-Class Preparation (Before Session)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Teacher prepares materials and students preview content\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>, System\u003c/p>\n\u003cp>\u003cb>Teacher Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Review lesson plan for upcoming session\u003c/li>\u003cli>Prepare teaching materials:\u003col start=\"1\">\u003cli>Presentation slides\u003c/li>\u003cli>Handouts/worksheets\u003c/li>\u003cli>Videos or audio files\u003c/li>\u003cli>Practice exercises\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Student Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Receive notification: \"New materials for Lesson 5\"\u003c/li>\u003cli>Login to student portal\u003c/li>\u003cli>Navigate to \u003cb>My Classes → English Intermediate B → Content\u003c/b>\u003c/li>\u003cli>Download materials:\u003col start=\"1\">\u003cli>\u003ccode>Lesson-05-Past-Tense.pdf\u003c/code>\u003c/li>\u003cli>\u003ccode>Practice-Exercises.pdf\u003c/code>\u003c/li>\u003c/ol>\u003c/li>\u003cli>Note questions to ask in class\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Materials uploaded at least 24 hours before class\u003c/li>\u003cli>All students notified\u003c/li>\u003cli>At least 70% of students preview materials\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-2-class-session-delivery-during-session\">Phase 2: Class Session Delivery (During Session)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Deliver effective instruction and facilitate learning\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>\u003c/p>\n\u003cp>\u003cb>Timeline\u003c/b>: 90-minute session example\u003c/p>\n\u003cp>\u003cb>Minutes 0-10: Opening\u003c/b>\u003c/p>\u003cul>\u003cli>Teacher arrives 10 minutes early\u003c/li>\u003cli>Setup classroom/online meeting\u003c/li>\u003cli>Students arrive\u003c/li>\u003cli>Mark attendance:\u003cul>\u003cli>Navigate to \u003cb>My Classes → Attendance\u003c/b>\u003c/li>\u003cli>Select today's date\u003c/li>\u003cli>Mark present/absent/late for each student\u003c/li>\u003cli>Add notes if needed\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Minutes 10-30: Content Delivery\u003c/b>\u003c/p>\u003cul>\u003cli>Present new concept (Past Tense)\u003c/li>\u003cli>Use slides and examples\u003c/li>\u003cli>Check understanding with questions\u003c/li>\u003cli>Engage students with real-life contexts\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Minutes 30-60: Practice &amp; Activities\u003c/b>\u003c/p>\u003cul>\u003cli>Guided practice (teacher-led)\u003c/li>\u003cli>Pair/group work\u003c/li>\u003cli>Interactive exercises\u003c/li>\u003cli>Error correction and feedback\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Minutes 60-80: Application\u003c/b>\u003c/p>\u003cul>\u003cli>Students apply learned concepts\u003c/li>\u003cli>Speaking activities\u003c/li>\u003cli>Writing practice\u003c/li>\u003cli>Problem-solving tasks\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Minutes 80-90: Wrap-up\u003c/b>\u003c/p>\u003cul>\u003cli>Recap key points\u003c/li>\u003cli>Answer questions\u003c/li>\u003cli>Preview next lesson\u003c/li>\u003cli>Assign homework\u003c/li>\u003cli>Dismissal\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Student Engagement\u003c/b>:\u003c/p>\u003cul>\u003cli>Active participation in activities\u003c/li>\u003cli>Ask questions when unclear\u003c/li>\u003cli>Complete in-class exercises\u003c/li>\u003cli>Peer collaboration\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Post-Session\u003c/b>:\u003c/p>\u003cul>\u003cli>Teacher adds session notes:\u003cul>\u003cli>Navigate to \u003cb>My Classes → Sessions\u003c/b>\u003c/li>\u003cli>Select today's session\u003c/li>\u003cli>Add notes: \"Covered past tense, students struggled with irregular verbs\"\u003c/li>\u003cli>Mark completion status\u003c/li>\u003cli>Set follow-up reminders\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>95%+ attendance rate\u003c/li>\u003cli>All students participated\u003c/li>\u003cli>Learning objectives achieved\u003c/li>\u003cli>Session notes documented\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-3-assignment-homework-after-session\">Phase 3: Assignment &amp; Homework (After Session)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Reinforce learning through practice\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>\u003c/p>\n\u003cp>\u003cb>Teacher Creates Assignment\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Navigate to \u003cb>My Classes → Assignments → Create\u003c/b>\u003c/li>\u003cli>Assignment details:\u003col start=\"1\">\u003cli>Title: \"Past Tense Practice - Lesson 5\"\u003c/li>\u003cli>Description: \"Complete exercises 1-5 on page 23\"\u003c/li>\u003cli>Instructions: Clear and specific\u003c/li>\u003cli>Due date: 3 days from now\u003c/li>\u003cli>Points: 10\u003c/li>\u003cli>Submission type: File upload (PDF/Word)\u003c/li>\u003c/ol>\u003c/li>\u003cli>Click \u003cb>Publish Assignment\u003c/b>\u003c/li>\u003cli>System notifies all students\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Student Completes Assignment\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Receive notification: \"New assignment due in 3 days\"\u003c/li>\u003cli>Navigate to \u003cb>My Classes → Assignments\u003c/b>\u003c/li>\u003cli>See assignment: \u003cb>Past Tense Practice\u003c/b>\u003c/li>\u003cli>Click \u003cb>View Details\u003c/b>\u003c/li>\u003cli>Read instructions\u003c/li>\u003cli>Download worksheet if provided\u003c/li>\u003cli>Complete homework (offline)\u003c/li>\u003cli>Prepare submission file\u003c/li>\u003cli>Navigate back to assignment\u003c/li>\u003cli>Click \u003cb>Submit Assignment\u003c/b>\u003c/li>\u003cli>Upload file: \u003ccode>Homework-Lesson5-NguyenVanA.pdf\u003c/code>\u003c/li>\u003cli>Add optional comment\u003c/li>\u003cli>Click \u003cb>Submit\u003c/b>\u003c/li>\u003cli>See confirmation: \"Submitted successfully\"\u003c/li>\u003cli>Deadline tracker updates\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Assignment Data\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface Assignment {\n  id: string;\n  class_id: string;\n  title: string;\n  description: string;\n  instructions: string;\n  due_date: Date;\n  points: number;\n  attachment_url?: string;\n  created_by: string; // teacher_id\n  created_at: Date;\n}\n\ninterface Submission {\n  id: string;\n  assignment_id: string;\n  student_id: string;\n  file_url: string;\n  submitted_at: Date;\n  status: 'submitted' | 'graded' | 'late';\n  grade?: number;\n  feedback?: string;\n  graded_by?: string;\n  graded_at?: Date;\n}\u003c/code>\u003c/pre>\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Assignment created same day as class\u003c/li>\u003cli>Clear instructions provided\u003c/li>\u003cli>90%+ submission rate\u003c/li>\u003cli>Submissions on time\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-4-grading-feedback-teacher-review\">Phase 4: Grading &amp; Feedback (Teacher Review)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Assess student work and provide constructive feedback\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>\u003c/p>\n\u003cp>\u003cb>Grading Process\u003c/b>:\u003c/p>\n\u003cp>\u003cb>Step 1: Review Submissions\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>Navigate to \u003cb>My Classes → Assignments → Past Tense Practice\u003c/b>\u003c/li>\u003cli>See submission list:\u003col start=\"1\">\u003cli>15 students enrolled\u003c/li>\u003cli>14 submitted (93%)\u003c/li>\u003cli>1 pending\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 2: Grade Each Submission\u003c/b>\u003c/p>\u003cp>1. Click on student: \u003cb>Nguyen Van A\u003c/b> 2. View submitted file (opens in browser) 3. Review work:    - Exercise 1: Correct ✓    - Exercise 2: 2 mistakes    - Exercise 3: Good effort    - Exercise 4: Excellent    - Exercise 5: Minor errors 4. Calculate score: 8.5/10 5. Write feedback:    ```    Good work, Van! You understand the concept well.\u003c/p>\n\u003cp>   Strengths:\u003c/p>\u003cul>\u003cli>Exercises 1 &amp; 4: Perfect!\u003c/li>\u003cli>Good sentence structure\u003c/li>\u003c/ul>\n\u003cp>   Areas to improve:\u003c/p>\u003cul>\u003cli>Exercise 2: Remember irregular verbs (went, not goed)\u003c/li>\u003cli>Exercise 5: Watch subject-verb agreement\u003c/li>\u003c/ul>\n\u003cp>   Keep practicing irregular verbs list on page 45.    See me if you need clarification.\u003c/p>\n\u003cp>   Grade: 8.5/10    ```\u003c/p>\u003col start=\"1\">\u003cli>Click \u003cb>Save Grade\u003c/b>\u003c/li>\u003cli>Repeat for all students\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Step 3: Publish Grades\u003c/b>\u003c/p>\u003col start=\"1\">\u003cli>After grading all submissions\u003c/li>\u003cli>Review grade distribution:\u003col start=\"1\">\u003cli>A (9-10): 4 students\u003c/li>\u003cli>B (7-8.9): 7 students\u003c/li>\u003cli>C (5-6.9): 3 students\u003c/li>\u003cli>Below 5: 0 students\u003c/li>\u003cli>Average: 8.1/10\u003c/li>\u003c/ol>\u003c/li>\u003cli>System sends notifications to students\u003c/li>\u003cli>Students can view grades and feedback\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Grading Rubric Example\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-yaml\">Criteria:\n  Accuracy: 40%\n    - Correct answers\n    - Proper grammar\n  \n  Completeness: 30%\n    - All exercises attempted\n    - Followed instructions\n  \n  Effort: 20%\n    - Neat presentation\n    - Thoughtful responses\n  \n  Timeliness: 10%\n    - Submitted on time\n    - Late: -10% per day\u003c/code>\u003c/pre>\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>All submissions graded within 7 days\u003c/li>\u003cli>Constructive feedback provided\u003c/li>\u003cli>Grade distribution reasonable\u003c/li>\u003cli>Students receive detailed comments\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-5-progress-tracking-continuous\">Phase 5: Progress Tracking (Continuous)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Monitor student learning progress and identify needs\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>\u003c/p>\n\u003cp>\u003cb>Teacher Monitors Progress\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Navigate to \u003cb>My Classes → Progress\u003c/b>\u003c/li>\u003cli>View class dashboard:\u003col start=\"1\">\u003cli>Overall class average: 8.2/10\u003c/li>\u003cli>Attendance rate: 94%\u003c/li>\u003cli>Assignment completion: 91%\u003c/li>\u003cli>At-risk students: 2\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cul>\u003cli>\u003cb>Tran Thi B\u003c/b>:\u003cul>\u003cli>Attendance: 15/20 (75%)\u003c/li>\u003cli>Avg grade: 6.2/10\u003c/li>\u003cli>Trend: Declining ↘\u003c/li>\u003cli>Status: At risk ⚠️\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Intervention for At-Risk Students\u003c/b>:\u003c/p>\u003cp>1. Identify struggling student: Tran Thi B 2. Review details:    - Low attendance (missing classes)    - Grades declining    - Last 3 assignments: 6.0, 5.5, 6.0 3. Take action:    - Send message to student:      ```      Hi Thi,\u003c/p>\n\u003cp>     I noticed you've missed some classes recently      and your grades have dropped a bit. Is everything      okay? I'd like to help you get back on track.\u003c/p>\n\u003cp>     Can we schedule a 15-minute chat after class?\u003c/p>\n\u003cp>     Ms. Nguyen      ```\u003c/p>\u003cul>\u003cli>If no response, contact \u003cspan class=\"wl\">Parent (Addon)\u003c/span> if enabled\u003c/li>\u003cli>Offer extra support:\u003cul>\u003cli>Extra practice materials\u003c/li>\u003cli>1-on-1 tutoring\u003c/li>\u003cli>Study group recommendations\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Student Views Own Progress\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Login to student portal\u003c/li>\u003cli>Navigate to \u003cb>My Learning → Progress\u003c/b>\u003c/li>\u003cli>See dashboard:\u003col start=\"1\">\u003cli>Current grade: 8.5/10 (B+)\u003c/li>\u003cli>Attendance: 95%\u003c/li>\u003cli>Assignments: 9/10 completed\u003c/li>\u003cli>Next milestone: Final exam in 2 weeks\u003c/li>\u003c/ol>\u003c/li>\u003cli>Strengths: Speaking, Listening\u003c/li>\u003cli>Areas to improve: Grammar\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>Progress tracked after each session\u003c/li>\u003cli>At-risk students identified early\u003c/li>\u003cli>Interventions documented\u003c/li>\u003cli>85%+ students on track\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"phase-6-course-completion-end-of-term\">Phase 6: Course Completion (End of Term)\u003c/h3>\n\u003cp>\u003cb>Objective\u003c/b>: Assess overall learning and issue completion certificates\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>\u003c/p>\n\u003cp>\u003cb>Final Assessment\u003c/b>:\u003c/p>\u003cp>1. Teacher creates final exam:    - Navigate to \u003cb>Assessments → Create Exam\u003c/b>    - Include all topics covered    - Multiple formats: Written, listening, speaking    - Total: 100 points 2. Schedule exam date 3. Students take exam 4. Teacher grades within 1 week 5. Calculate final course grade:    ```    Formula:    - Homework: 30%    - Quizzes: 20%    - Midterm: 20%    - Final exam: 30%\u003c/p>\n\u003cp>   Example (Nguyen Van A):\u003c/p>\u003cp>   - Homework avg: 8.5 × 0.3 = 2.55    - Quizzes avg: 8.0 × 0.2 = 1.60    - Midterm: 8.0 × 0.2 = 1.60    - Final: 9.0 × 0.3 = 2.70    Final Grade: 8.45/10 (B+)    ```\u003c/p>\n\u003cp>\u003cb>Course Completion\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Teacher marks course as complete\u003c/li>\u003cli>System generates completion statistics:\u003col start=\"1\">\u003cli>Started: 15 students\u003c/li>\u003cli>Completed: 14 students (93%)\u003c/li>\u003cli>Dropped: 1 student\u003c/li>\u003cli>Average grade: 8.2/10\u003c/li>\u003cli>Pass rate: 100% (of completers)\u003c/li>\u003c/ol>\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Post-Course Actions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Gather student feedback:\u003col start=\"1\">\u003cli>Send course evaluation survey\u003c/li>\u003cli>Questions about:\u003col start=\"1\">\u003cli>Teaching quality\u003c/li>\u003cli>Content relevance\u003c/li>\u003cli>Difficulty level\u003c/li>\u003cli>Facilities/platform\u003c/li>\u003cli>Would recommend?\u003c/li>\u003c/ol>\u003c/li>\u003cli>What worked well?\u003c/li>\u003cli>What to improve?\u003c/li>\u003cli>Materials to update?\u003c/li>\u003cli>Pacing adjustments?\u003c/li>\u003c/ol>\u003c/li>\u003cli>Prepare for next term\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Success Criteria\u003c/b>:\u003c/p>\u003cul>\u003cli>80%+ completion rate\u003c/li>\u003cli>90%+ passing rate (of completers)\u003c/li>\u003cli>4.0/5+ average student satisfaction\u003c/li>\u003cli>Certificates issued within 1 week\u003c/li>\u003cli>Lessons learned documented\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"role-participation-matrix\">Role Participation Matrix\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"text-align:left\">Phase\u003c/th>\u003cth style=\"text-align:left\">Primary\u003c/th>\u003cth style=\"text-align:left\">Supporting\u003c/th>\u003cth style=\"text-align:left\">Approval\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd style=\"text-align:left\">Preparation\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Librarian\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Delivery\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Student\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Assignment\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Student\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Grading\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Academic Manager\u003c/span> (disputes)\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Progress\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">-\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"text-align:left\">Completion\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Teacher\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/td>\u003ctd style=\"text-align:left\">\u003cspan class=\"wl\">Branch Manager\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"teaching-quality\">Teaching Quality\u003c/h3>\u003cul>\u003cli>\u003cb>Student Satisfaction\u003c/b>: Average 4.2/5 (Target: 4.0+)\u003c/li>\u003cli>\u003cb>Completion Rate\u003c/b>: 85% (Target: 80%+)\u003c/li>\u003cli>\u003cb>Pass Rate\u003c/b>: 92% (Target: 90%+)\u003c/li>\u003cli>\u003cb>Attendance\u003c/b>: 94% (Target: 90%+)\u003c/li>\u003c/ul>\n\u003ch3 id=\"engagement\">Engagement\u003c/h3>\u003cul>\u003cli>\u003cb>Assignment Submission\u003c/b>: 91% on-time (Target: 85%+)\u003c/li>\u003cli>\u003cb>Material Access\u003c/b>: 78% preview materials (Target: 70%+)\u003c/li>\u003cli>\u003cb>Class Participation\u003c/b>: Measured via teacher observation\u003c/li>\u003c/ul>\n\u003ch3 id=\"outcomes\">Outcomes\u003c/h3>\u003cul>\u003cli>\u003cb>Learning Objectives Met\u003c/b>: 88% (Target: 85%+)\u003c/li>\u003cli>\u003cb>Progress vs Baseline\u003c/b>: Average 2-level improvement in 6 months\u003c/li>\u003cli>\u003cb>Student Retention\u003c/b>: 85% continue to next level (Target: 80%+)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"integration-points\">Integration Points\u003c/h2>\n\u003ch3 id=\"1-content-library\">1. Content Library\u003c/h3>\u003cul>\u003cli>Teachers access shared content\u003c/li>\u003cli>Upload and organize materials\u003c/li>\u003cli>Version control for updates\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-communication-system\">2. Communication System\u003c/h3>\u003cul>\u003cli>Announcements to class\u003c/li>\u003cli>Direct messages to students\u003c/li>\u003cli>Parent notifications (if addon)\u003c/li>\u003c/ul>\n\u003ch3 id=\"3-gradebook\">3. Gradebook\u003c/h3>\u003cul>\u003cli>Automatic grade calculations\u003c/li>\u003cli>Progress tracking\u003c/li>\u003cli>Transcript generation\u003c/li>\u003c/ul>\n\u003ch3 id=\"4-analytics\">4. Analytics\u003c/h3>\u003cul>\u003cli>Class performance dashboards\u003c/li>\u003cli>Teacher effectiveness metrics\u003c/li>\u003cli>Student engagement indicators\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"common-issues-solutions\">Common Issues &amp; Solutions\u003c/h2>\n\u003ch3 id=\"issue-1-low-attendance\">Issue 1: Low Attendance\u003c/h3>\u003cp>\u003cb>Symptoms\u003c/b>: &lt; 80% attendance rate\u003c/p>\n\u003cp>\u003cb>Root Causes\u003c/b>:\u003c/p>\u003cul>\u003cli>Schedule conflicts\u003c/li>\u003cli>Lack of engagement\u003c/li>\u003cli>External factors (work, family)\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Solutions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Contact students to understand reasons\u003c/li>\u003cli>Offer makeup sessions\u003c/li>\u003cli>Provide recorded sessions (if online)\u003c/li>\u003cli>Adjust schedule if pattern emerges\u003c/li>\u003cli>Engage parents for minors\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch3 id=\"issue-2-low-assignment-completion\">Issue 2: Low Assignment Completion\u003c/h3>\u003cp>\u003cb>Symptoms\u003c/b>: &lt; 70% submission rate\u003c/p>\n\u003cp>\u003cb>Root Causes\u003c/b>:\u003c/p>\u003cul>\u003cli>Unclear instructions\u003c/li>\u003cli>Too difficult\u003c/li>\u003cli>Not enough time\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Solutions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Clarify assignment requirements\u003c/li>\u003cli>Provide examples\u003c/li>\u003cli>Extend deadline if reasonable\u003c/li>\u003cli>Offer office hours for help\u003c/li>\u003cli>Break large assignments into smaller tasks\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch3 id=\"issue-3-poor-grades\">Issue 3: Poor Grades\u003c/h3>\u003cp>\u003cb>Symptoms\u003c/b>: Class average &lt; 6.0/10\u003c/p>\n\u003cp>\u003cb>Root Causes\u003c/b>:\u003c/p>\u003cul>\u003cli>Material too advanced\u003c/li>\u003cli>Teaching pace too fast\u003c/li>\u003cli>Students unprepared\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Solutions\u003c/b>:\u003c/p>\u003col start=\"1\">\u003cli>Review and simplify content\u003c/li>\u003cli>Slow down pace\u003c/li>\u003cli>Add more practice\u003c/li>\u003cli>Extra support sessions\u003c/li>\u003cli>Adjust assessment difficulty\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"best-practices\">Best Practices\u003c/h2>\n\u003ch3 id=\"for-teachers\">For Teachers\u003c/h3>\n\u003cp>\u003cb>Preparation\u003c/b>:\u003c/p>\u003cul>\u003cli>Upload materials 48 hours in advance\u003c/li>\u003cli>Test all links and files before sharing\u003c/li>\u003cli>Prepare backup activities\u003c/li>\u003cli>Review previous session notes\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Delivery\u003c/b>:\u003c/p>\u003cul>\u003cli>Start and end on time\u003c/li>\u003cli>Use varied teaching methods\u003c/li>\u003cli>Check understanding frequently\u003c/li>\u003cli>Encourage questions\u003c/li>\u003cli>Make learning fun and relevant\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Assessment\u003c/b>:\u003c/p>\u003cul>\u003cli>Grade promptly (within 1 week)\u003c/li>\u003cli>Provide specific feedback\u003c/li>\u003cli>Highlight strengths and areas to improve\u003c/li>\u003cli>Be consistent and fair\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Communication\u003c/b>:\u003c/p>\u003cul>\u003cli>Respond to student questions within 24 hours\u003c/li>\u003cli>Proactive outreach to struggling students\u003c/li>\u003cli>Clear and friendly tone\u003c/li>\u003cli>Document important conversations\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch3 id=\"for-students\">For Students\u003c/h3>\n\u003cp>\u003cb>Before Class\u003c/b>:\u003c/p>\u003cul>\u003cli>Preview materials\u003c/li>\u003cli>Note questions\u003c/li>\u003cli>Complete pre-class readings\u003c/li>\u003cli>Arrive on time\u003c/li>\u003c/ul>\n\u003cp>\u003cb>During Class\u003c/b>:\u003c/p>\u003cul>\u003cli>Active participation\u003c/li>\u003cli>Take notes\u003c/li>\u003cli>Ask questions when unclear\u003c/li>\u003cli>Respect classmates and teacher\u003c/li>\u003c/ul>\n\u003cp>\u003cb>After Class\u003c/b>:\u003c/p>\u003cul>\u003cli>Review notes same day\u003c/li>\u003cli>Start homework early\u003c/li>\u003cli>Seek help if stuck\u003c/li>\u003cli>Submit on time\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-01 Enrollment Journey\u003c/span> - How students join class\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-07 Content Management\u003c/span> - Managing learning materials\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-08 Assessment &amp;amp; Grading\u003c/span> - Detailed grading process\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-09 Student Progress Tracking\u003c/span> - Progress monitoring\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> - Primary driver\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - Active participant\u003c/li>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> - Quality oversight\u003c/li>\u003cli>\u003cspan class=\"wl\">Librarian\u003c/span> - Content support\u003c/li>\u003cli>\u003cspan class=\"wl\">Parent (Addon)\u003c/span> - Progress monitoring\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Academic Manager, Teacher \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_02","file":"WF-03 Financial Operations.md","title":"WF-03: Financial Operations","category":"critical","phases":[{"title":"Invoice Generation (Automated)","objective":"Create accurate invoice i
