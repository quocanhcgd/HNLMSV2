const teacher = await Teacher.findOne(session.teacher_id);\n  \n  // Test meeting link\n  const meetingStatus = await testMeetingLink(session.meeting_link);\n  \n  if (!meetingStatus.accessible) {\n    // Recreate meeting\n    const newMeeting = await recreateMeeting(session);\n    session.meeting_link = newMeeting.join_url;\n    await session.save();\n    \n    // Notify students of new link\n    await notifyStudents(session.class_id, {\n      title: 'Link học mới',\n      urgent: true,\n      meeting_link: newMeeting.join_url\n    });\n  }\n  \n  // Remind teacher to:\n  await sendReminder(teacher.id, {\n    title: 'Chuẩn bị buổi học online',\n    checklist: [\n      '✓ Kiểm tra camera và micro',\n      '✓ Tải tài liệu lên màn hình chia sẻ',\n      '✓ Chuẩn bị bài tập tương tác',\n      '✓ Vào sớm 10 phút để test'\n    ],\n    meeting_link: session.meeting_link,\n    start_time: session.start_time\n  });\n  \n  // Remind students\n  const students = await getEnrolledStudents(session.class_id);\n  for (const student of students) {\n    await sendReminder(student.id, {\n      title: 'Buổi học sắp bắt đầu',\n      time_until: calculateTimeUntil(session.start_time),\n      meeting_link: session.meeting_link,\n      tips: [\n        'Vào sớm 5 phút',\n        'Kiểm tra internet',\n        'Chuẩn bị sách vở',\n        'Tìm chỗ yên tĩnh'\n      ]\n    });\n  }\n}\u003c/code>\u003c/pre>\u003ch3 id=\"for-flexible-sessions\">For Flexible Sessions\u003c/h3>\n\u003cp>\u003cb>Student Choice Collection\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">// 24 hours before session\nasync function collectStudentChoices(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n  const students = await getEnrolledStudents(session.class_id);\n  \n  for (const student of students) {\n    // Check if student has chosen\n    const choice = await StudentSessionChoice.findOne({\n      student_id: student.id,\n      session_id: sessionId\n    });\n    \n    if (!choice) {\n      // Send reminder to choose\n      await sendChoiceReminder(student.id, {\n        session: session,\n        deadline: addHours(session.start_time, -24),\n        options: {\n          online: session.meeting_link,\n          offline: `${session.room_name} at ${session.branch_name}`\n        }\n      });\n    }\n  }\n  \n  // 1 hour before deadline, send final warning\n  setTimeout(async () =&gt; {\n    await sendFinalChoiceWarning(sessionId);\n  }, hoursToMs(23));\n}\n\n// Student makes choice\nasync function recordStudentChoice(\n  studentId: string,\n  sessionId: string,\n  choice: 'online' | 'offline'\n) {\n  await StudentSessionChoice.create({\n    student_id: studentId,\n    session_id: sessionId,\n    choice: choice,\n    chosen_at: new Date()\n  });\n  \n  const session = await ClassSession.findOne(sessionId);\n  \n  // Send confirmation\n  await notifyStudent(studentId, {\n    title: 'Đã ghi nhận lựa chọn',\n    message: choice === 'online' \n      ? `Bạn sẽ học online qua: ${session.meeting_link}`\n      : `Bạn sẽ học offline tại: ${session.room_name}`,\n    time: session.start_time\n  });\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-3-session-delivery\">Phase 3: Session Delivery\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Conduct the actual class session\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, Students, System\u003c/p>\n\u003ch3 id=\"offline-session-flow\">Offline Session Flow\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function conductOfflineSession(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n  \n  // 1. Teacher arrives and checks in\n  await teacherCheckIn(session.teacher_id, sessionId);\n  \n  // 2. Setup room\n  // (Physical setup - no system action)\n  \n  // 3. Students arrive - mark attendance\n  // Manual or auto (card/QR scan)\n  const attendanceRecords = [];\n  for (const student of session.enrolled_students) {\n    const record = await markAttendance({\n      session_id: sessionId,\n      student_id: student.id,\n      mode: 'offline',\n      status: 'present', // or 'late', 'absent'\n      checked_in_at: new Date()\n    });\n    attendanceRecords.push(record);\n  }\n  \n  // 4. Teach class\n  session.status = 'in_progress';\n  session.started_at = new Date();\n  await session.save();\n  \n  // 5. End of class\n  session.status = 'completed';\n  session.ended_at = new Date();\n  await session.save();\n  \n  // 6. Teacher adds notes\n  await addSessionNotes(sessionId, {\n    content_covered: '...',\n    homework_assigned: '...',\n    student_performance: '...',\n    issues: '...'\n  });\n  \n  return { session, attendance: attendanceRecords };\n}\u003c/code>\u003c/pre>\u003ch3 id=\"online-session-flow\">Online Session Flow\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function conductOnlineSession(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n  \n  // 1. Teacher starts meeting\n  const meeting = await startMeeting(session.meeting_room_id);\n  \n  session.status = 'in_progress';\n  session.started_at = new Date();\n  session.meeting_started = true;\n  await session.save();\n  \n  // 2. Start recording automatically\n  if (session.recording_enabled) {\n    await startRecording(meeting.id);\n  }\n  \n  // 3. Students join - auto attendance\n  // (Webhook from meeting platform)\n  const attendanceSync = await syncAttendanceFromMeeting({\n    meeting_id: meeting.id,\n    session_id: sessionId,\n    platform: session.meeting_platform\n  });\n  \n  // 4. Monitor session\n  // - Track who joins/leaves\n  // - Monitor engagement (chat, polls)\n  // - Detect issues (connection problems)\n  \n  // 5. End meeting\n  await endMeeting(meeting.id);\n  \n  // 6. Stop recording\n  const recording = await stopRecording(meeting.id);\n  \n  // 7. Process recording\n  const processedRecording = await processRecording({\n    recording_id: recording.id,\n    session_id: sessionId,\n    actions: [\n      'download',\n      'transcode', // Convert to web-friendly format\n      'generate_thumbnail',\n      'upload_to_storage',\n      'create_access_link'\n    ]\n  });\n  \n  // 8. Save recording info\n  session.status = 'completed';\n  session.ended_at = new Date();\n  session.recording_url = processedRecording.playback_url;\n  session.recording_duration = processedRecording.duration;\n  await session.save();\n  \n  // 9. Notify students recording is available\n  await notifyStudents(session.class_id, {\n    title: 'Bài học đã được ghi lại',\n    message: 'Bạn có thể xem lại buổi học tại thư viện',\n    recording_url: processedRecording.playback_url,\n    expires_in_days: 30\n  });\n  \n  return { session, recording: processedRecording, attendance: attendanceSync };\n}\n\n// Webhook handler for attendance sync\nasync function syncAttendanceFromMeeting(config: AttendanceSyncConfig) {\n  // Get participant list from meeting platform\n  const participants = await getMeetingParticipants(\n    config.platform,\n    config.meeting_id\n  );\n  \n  const attendanceRecords = [];\n  \n  for (const participant of participants) {\n    // Match participant to student (by email or name)\n    const student = await matchParticipantToStudent(participant);\n    \n    if (student) {\n      const record = await Attendance.create({\n        session_id: config.session_id,\n        student_id: student.id,\n        mode: 'online',\n        status: calculateStatus(participant.join_time, session.start_time),\n        checked_in_at: participant.join_time,\n        left_at: participant.leave_time,\n        duration_minutes: participant.duration\n      });\n      \n      attendanceRecords.push(record);\n    }\n  }\n  \n  return attendanceRecords;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-4-emergency-mode-switch\">Phase 4: Emergency Mode Switch\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Quickly switch from offline to online in emergency situations\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Branch Manager\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, System\u003c/p>\n\u003cp>\u003cb>Trigger Events\u003c/b>:\u003c/p>\u003cul>\u003cli>COVID-19 lockdown\u003c/li>\u003cli>Natural disaster\u003c/li>\u003cli>Building maintenance\u003c/li>\u003cli>Teacher illness (can teach from home)\u003c/li>\u003cli>Student quarantine\u003c/li>\u003c/ul>\u003cpre>\u003ccode class=\"lang-typescript\">async function emergencySwitchToOnline(\n  classId: string,\n  reason: string,\n  effectiveFromDate: Date\n) {\n  const classData = await Class.findOne(classId);\n  \n  // 1. Create backup of current configuration\n  await ClassConfigHistory.create({\n    class_id: classId,\n    original_mode: classData.delivery_mode,\n    changed_to: ClassDeliveryMode.ONLINE,\n    reason: reason,\n    changed_at: new Date(),\n    effective_from: effectiveFromDate,\n    changed_by: getCurrentUserId()\n  });\n  \n  // 2. Setup online infrastructure ASAP\n  const meetingRoom = await createMeetingRoom({\n    platform: 'zoom', // Use fastest platform\n    title: `${classData.name} - Emergency Online`,\n    recurring: true,\n    schedule: classData.schedule,\n    host_email: classData.teacher_email\n  });\n  \n  // 3. Update class configuration\n  classData.delivery_mode = ClassDeliveryMode.ONLINE;\n  classData.meeting_platform = 'zoom';\n  classData.meeting_room_id = meetingRoom.id;\n  classData.permanent_meeting_link = meetingRoom.join_url;\n  classData.emergency_mode = true;\n  classData.emergency_reason = reason;\n  await classData.save();\n  \n  // 4. Update all future sessions\n  await ClassSession.update(\n    {\n      class_id: classId,\n      date: GreaterThanOrEqual(effectiveFromDate),\n      status: 'scheduled'\n    },\n    {\n      delivery_mode: 'online',\n      meeting_link: meetingRoom.join_url,\n      room_id: null // Clear physical room\n    }\n  );\n  \n  // 5. URGENT notification to teacher\n  await sendUrgentNotification(classData.teacher_id, {\n    title: '🚨 KHẨN: Chuyển sang học online',\n    message: `\nLớp ${classData.name} chuyển sang học online từ ${formatDate(effectiveFromDate)}\n\nLý do: ${reason}\n\nLink học: ${meetingRoom.join_url}\n\nHướng dẫn chi tiết đã được gửi qua email.\nVui lòng liên hệ nếu cần hỗ trợ.\n    `,\n    priority: 'urgent',\n    require_acknowledgment: true\n  });\n  \n  // 6. Send detailed guide to teacher\n  await sendEmail(classData.teacher_email, {\n    subject: 'Hướng dẫn giảng dạy online khẩn cấp',\n    template: 'emergency_online_teaching_guide',\n    data: {\n      teacher_name: classData.teacher_name,\n      class_name: classData.name,\n      meeting_link: meetingRoom.join_url,\n      host_key: meetingRoom.host_key,\n      platform: 'Zoom',\n      instructions: getEmergencyTeachingInstructions(),\n      support_contact: 'support@school.vn',\n      support_phone: '1900-xxxx'\n    }\n  });\n  \n  // 7. URGENT notification to all students\n  const students = await getEnrolledStudents(classId);\n  \n  for (const student of students) {\n    await sendUrgentNotification(student.id, {\n      title: '🚨 THÔNG BÁO QUAN TRỌNG',\n      message: `\nLớp ${classData.name} chuyển sang học ONLINE từ ${formatDate(effectiveFromDate)}\n\nLý do: ${reason}\n\n🎥 Link học: ${meetingRoom.join_url}\n\n📱 Hướng dẫn tham gia đã được gửi qua email và SMS.\n\nVui lòng kiểm tra và chuẩn bị:\n- Máy tính/điện thoại có camera và micro\n- Kết nối internet ổn định\n- Tải ứng dụng Zoom (nếu chưa có)\n\n📞 Hỗ trợ: 1900-xxxx\n      `,\n      priority: 'urgent'\n    });\n    \n    // Send SMS backup\n    await sendSMS(student.phone, `\nKHẨN: Lớp ${classData.name} chuyển học online từ ${formatDate(effectiveFromDate)}.\nLink: ${meetingRoom.join_url}\nXem email để biết chi tiết.\n    `);\n    \n    // Send detailed email guide\n    await sendEmail(student.email, {\n      subject: `QUAN TRỌNG: Lớp ${classData.name} chuyển sang online`,\n      template: 'emergency_online_learning_guide',\n      data: {\n        student_name: student.name,\n        class_name: classData.name,\n        meeting_link: meetingRoom.join_url,\n        platform: 'Zoom',\n        how_to_join: getStudentJoinInstructions(),\n        system_requirements: getSystemRequirements('zoom'),\n        tips: getOnlineLearningTips()\n      }\n    });\n  }\n  \n  // 8. Notify parents if addon enabled\n  if (await isAddonEnabled('parent_portal')) {\n    await notifyParents(classId, {\n      title: 'Thông báo: Lớp chuyển sang online',\n      reason: reason,\n      effective_date: effectiveFromDate,\n      meeting_link: meetingRoom.join_url\n    });\n  }\n  \n  // 9. Create support ticket for monitoring\n  await createSupportTicket({\n    type: 'emergency_mode_switch',\n    class_id: classId,\n    priority: 'high',\n    description: `Monitor emergency online switch for class ${classData.name}`,\n    assigned_to: 'support_team',\n    due_date: effectiveFromDate\n  });\n  \n  // 10. Log audit trail\n  await AuditLog.create({\n    action: 'emergency_mode_switch',\n    entity: 'class',\n    entity_id: classId,\n    user_id: getCurrentUserId(),\n    details: {\n      from_mode: classData.delivery_mode,\n      to_mode: 'online',\n      reason: reason,\n      effective_from: effectiveFromDate,\n      students_notified: students.length,\n      teacher_notified: true\n    },\n    timestamp: new Date()\n  });\n  \n  return {\n    success: true,\n    meeting_link: meetingRoom.join_url,\n    students_notified: students.length,\n    effective_from: effectiveFromDate\n  };\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-5-post-session-analytics\">Phase 5: Post-Session &amp; Analytics\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Process session data and provide insights\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, System\u003c/p>\n\u003ch3 id=\"recording-processing\">Recording Processing\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function processSessionRecording(sessionId: string) {\n  const session = await ClassSession.findOne(sessionId);\n  const recording = await Recording.findOne({ session_id: sessionId });\n  \n  // 1. Download from meeting platform\n  const videoFile = await downloadRecording(recording.platform_id);\n  \n  // 2. Transcode to web-friendly format\n  const transcoded = await transcodeVideo({\n    input: videoFile,\n    formats: [\n      { resolution: '720p', bitrate: '2000k' },\n      { resolution: '480p', bitrate: '1000k' },\n      { resolution: '360p', bitrate: '500k' }\n    ]\n  });\n  \n  // 3. Generate thumbnail\n  const thumbnail = await generateThumbnail(videoFile, '00:01:00');\n  \n  // 4. Extract audio for accessibility\n  const audioTrack = await extractAudio(videoFile);\n  \n  // 5. Optional: Generate transcript with AI\n  if (await isFeatureEnabled('ai_transcription')) {\n    const transcript = await generateTranscript(audioTrack);\n    recording.transcript = transcript;\n  }\n  \n  // 6. Upload to storage\n  const urls = await uploadToStorage({\n    video: transcoded,\n    thumbnail: thumbnail,\n    audio: audioTrack,\n    path: `recordings/${session.class_id}/${sessionId}`\n  });\n  \n  // 7. Update recording record\n  recording.status = 'processed';\n  recording.playback_url = urls.video;\n  recording.thumbnail_url = urls.thumbnail;\n  recording.audio_url = urls.audio;\n  recording.processed_at = new Date();\n  await recording.save();\n  \n  // 8. Make available to students\n  await ContentLibrary.create({\n    type: 'video',\n    title: `${session.class_name} - ${formatDate(session.date)}`,\n    url: urls.video,\n    thumbnail: urls.thumbnail,\n    duration: recording.duration,\n    class_id: session.class_id,\n    session_id: sessionId,\n    access_level: 'enrolled',\n    published_at: new Date()\n  });\n  \n  // 9. Notify students\n  await notifyStudents(session.class_id, {\n    title: 'Bài học mới đã sẵn sàng',\n    message: `Xem lại buổi học ${formatDate(session.date)}`,\n    link: `/library/videos/${recording.id}`\n  });\n  \n  return recording;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"attendance-analytics\">Attendance Analytics\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function analyzeAttendance(classId: string) {\n  const sessions = await ClassSession.find({ class_id: classId });\n  const students = await getEnrolledStudents(classId);\n  \n  const analytics = {\n    overall: {\n      total_sessions: sessions.length,\n      completed_sessions: sessions.filter(s =&gt; s.status === 'completed').length,\n      online_sessions: sessions.filter(s =&gt; s.delivery_mode === 'online').length,\n      offline_sessions: sessions.filter(s =&gt; s.delivery_mode === 'offline').length\n    },\n    attendance: {\n      average_rate: 0,\n      by_mode: {\n        online: 0,\n        offline: 0\n      },\n      by_student: []\n    }\n  };\n  \n  // Calculate per student\n  for (const student of students) {\n    const attendance = await Attendance.find({\n      student_id: student.id,\n      session_id: In(sessions.map(s =&gt; s.id))\n    });\n    \n    const present = attendance.filter(a =&gt; a.status === 'present').length;\n    const rate = (present / sessions.length) * 100;\n    \n    const onlinePresent = attendance.filter(\n      a =&gt; a.mode === 'online' &amp;&amp; a.status === 'present'\n    ).length;\n    const offlinePresent = attendance.filter(\n      a =&gt; a.mode === 'offline' &amp;&amp; a.status === 'present'\n    ).length;\n    \n    analytics.attendance.by_student.push({\n      student_id: student.id,\n      student_name: student.name,\n      attendance_rate: rate,\n      total_present: present,\n      total_sessions: sessions.length,\n      online_present: onlinePresent,\n      offline_present: offlinePresent,\n      status: rate &gt;= 80 ? 'good' : rate &gt;= 60 ? 'warning' : 'at_risk'\n    });\n  }\n  \n  // Calculate averages\n  analytics.attendance.average_rate = \n    average(analytics.attendance.by_student.map(s =&gt; s.attendance_rate));\n  \n  analytics.attendance.by_mode.online = \n    average(analytics.attendance.by_student.map(s =&gt; \n      (s.online_present / analytics.overall.online_sessions) * 100\n    ));\n  \n  analytics.attendance.by_mode.offline = \n    average(analytics.attendance.by_student.map(s =&gt; \n      (s.offline_present / analytics.overall.offline_sessions) * 100\n    ));\n  \n  return analytics;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"learning-mode-effectiveness\">Learning Mode Effectiveness\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function analyzeLearningModeEffectiveness(classId: string) {\n  const classData = await Class.findOne(classId);\n  const students = await getEnrolledStudents(classId);\n  \n  const analysis = {\n    class_id: classId,\n    delivery_mode: classData.delivery_mode,\n    metrics: {\n      attendance: {\n        online: { rate: 0, average_duration: 0 },\n        offline: { rate: 0 }\n      },\n      engagement: {\n        online: { chat_messages: 0, questions_asked: 0 },\n        offline: { participation_score: 0 }\n      },\n      performance: {\n        online_avg_grade: 0,\n        offline_avg_grade: 0,\n        overall_avg_grade: 0\n      }\n    },\n    insights: [],\n    recommendations: []\n  };\n  \n  // Calculate metrics...\n  // (Implementation details)\n  \n  // Generate insights\n  if (analysis.metrics.attendance.online.rate &lt; analysis.metrics.attendance.offline.rate - 10) {\n    analysis.insights.push('Online attendance significantly lower than offline');\n    analysis.recommendations.push('Investigate online learning barriers');\n    analysis.recommendations.push('Consider hybrid mode to improve flexibility');\n  }\n  \n  if (analysis.metrics.performance.online_avg_grade &lt; analysis.metrics.performance.offline_avg_grade - 0.5) {\n    analysis.insights.push('Online learning outcomes lower than offline');\n    analysis.recommendations.push('Enhance online teaching methods');\n    analysis.recommendations.push('Provide more interactive online activities');\n    analysis.recommendations.push('Offer additional online support resources');\n  }\n  \n  return analysis;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"delivery-mode-adoption\">Delivery Mode Adoption\u003c/h3>\u003cul>\u003cli>\u003cb>Online Classes\u003c/b>: 30% of total classes\u003c/li>\u003cli>\u003cb>Hybrid Classes\u003c/b>: 20% of total classes\u003c/li>\u003cli>\u003cb>Flexible Classes\u003c/b>: 10% of total classes\u003c/li>\u003cli>\u003cb>Emergency Switches\u003c/b>: &lt;5% of classes, &lt;1% failure rate\u003c/li>\u003c/ul>\n\u003ch3 id=\"attendance-rates\">Attendance Rates\u003c/h3>\u003cul>\u003cli>\u003cb>Online\u003c/b>: 85%+ (Target: 80%+)\u003c/li>\u003cli>\u003cb>Offline\u003c/b>: 92%+ (Target: 90%+)\u003c/li>\u003cli>\u003cb>Hybrid\u003c/b>: 88%+ (Target: 85%+)\u003c/li>\u003c/ul>\n\u003ch3 id=\"student-satisfaction\">Student Satisfaction\u003c/h3>\u003cul>\u003cli>\u003cb>Online Experience\u003c/b>: 4.0/5 (Target: 3.8/5)\u003c/li>\u003cli>\u003cb>Recording Quality\u003c/b>: 4.2/5 (Target: 4.0/5)\u003c/li>\u003cli>\u003cb>Hybrid Flexibility\u003c/b>: 4.5/5 (Target: 4.3/5)\u003c/li>\u003c/ul>\n\u003ch3 id=\"technical-performance\">Technical Performance\u003c/h3>\u003cul>\u003cli>\u003cb>Meeting Uptime\u003c/b>: 99.5%+ (Target: 99%+)\u003c/li>\u003cli>\u003cb>Recording Success Rate\u003c/b>: 98%+ (Target: 95%+)\u003c/li>\u003cli>\u003cb>Emergency Switch Time\u003c/b>: &lt;2 hours (Target: &lt;4 hours)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-02 Teaching &amp;amp; Learning Cycle\u003c/span> - Core teaching process\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-06 Digital Library &amp;amp; Content Management\u003c/span> - Recording storage\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-08 Communication Hub\u003c/span> - Notifications and messaging\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> - Configure class modes\u003c/li>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> - Deliver sessions\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - Attend and learn\u003c/li>\u003cli>\u003cspan class=\"wl\">Branch Manager\u003c/span> - Manage resources\u003c/li>\u003cli>\u003cspan class=\"wl\">IT Support\u003c/span> - Technical assistance\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Academic Manager, IT Support \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_05","file":"WF-06 Digital Library & Content Management.md","title":"WF-06: Digital Library & Content Management","category":"critical","phases":[{"title":"Content Upload & Processing","objective":"Upload and prepare content for delivery","trigger":"","actors":["Teacher, Librarian, Academic Manager, System"],"actions":[],"criteria":[]},{"title":"Organization & Tagging","objective":"Organi","trigger":"","actors":["Librarian, Teacher, AI System"],"actions":[],"criteria":[]},{"title":"Access Control & Publishing","objective":"Control who can access what content","trigger":"","actors":["Teacher, Librarian, Academic Manager"],"actions":[],"criteria":[]},{"title":"Student Consumption & Tracking","objective":"Deliver content and track learning progress","trigger":"","actors":["Student, System"],"actions":[],"criteria":[]},{"title":"AI Recommendations","objective":"Personali","trigger":"","actors":["AI System, Student"],"actions":[],"criteria":[]},{"title":"Analytics & Insights","objective":"Measure content effectiveness and student engagement","trigger":"","actors":["Teacher, Academic Manager, Librarian"],"actions":[],"criteria":[]}],"estimated":"Continuous","scope":"P2","nodes":[{"id":"Start","label":"Content Lifecycle","shape":"round","role":"","p":0},{"id":"Upload","label":"Upload Content","shape":"rect","role":"","p":0},{"id":"ContentType","label":"Content Type?","shape":"diamond","role":"","p":0},{"id":"VideoProcess","label":"Video Processing","shape":"rect","role":"","p":0},{"id":"DocProcess","label":"Document Processing","shape":"rect","role":"","p":0},{"id":"AudioProcess","label":"Audio Processing","shape":"rect","role":"","p":0},{"id":"InteractiveCreate","label":"Interactive Content","shape":"rect","role":"","p":0},{"id":"EbookProcess","label":"Ebook Processing","shape":"rect","role":"","p":0},{"id":"Transcode","label":"Transcode Multiple Qualities","shape":"rect","role":"","p":0},{"id":"GenerateThumb","label":"Generate Thumbnail","shape":"rect","role":"","p":0},{"id":"ExtractAudio","label":"Extract Audio Track","shape":"rect","role":"","p":3},{"id":"AITranscript","label":"AI Generate Transcript","shape":"rect","role":"","p":4},{"id":"VideoReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"PDFConvert","label":"Convert to PDF","shape":"rect","role":"","p":0},{"id":"ExtractText","label":"Extract Text","shape":"rect","role":"","p":0},{"id":"DocReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"AudioTranscode","label":"Transcode Audio","shape":"rect","role":"","p":0},{"id":"AudioTranscript","label":"AI Generate Transcript","shape":"rect","role":"","p":4},{"id":"AudioReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"InteractiveDesign","label":"Design Activities","shape":"rect","role":"","p":0},{"id":"InteractiveReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"EbookConvert","label":"Convert Format","shape":"rect","role":"","p":0},{"id":"EbookReady","label":"Ready","shape":"rect","role":"","p":0},{"id":"Organize","label":"Organize & Tag","shape":"rect","role":"","p":0},{"id":"AITag","label":"AI Auto-Tagging","shape":"rect","role":"","p":1},{"id":"Categorize","label":"Categorize","shape":"rect","role":"","p":0},{"id":"AccessControl","label":"Set Access Control","shape":"rect","role":"","p":2},{"id":"Publish","label":"Publish to Library","shape":"rect","role":"","p":0},{"id":"StudentAccess","label":"Students Access","shape":"rect","role":"","p":2},{"id":"StudentView","label":"How Students Learn?","shape":"diamond","role":"","p":0},{"id":"VideoPlayer","label":"Video Player","shape":"rect","role":"","p":0},{"id":"DocReader","label":"Document Reader","shape":"rect","role":"","p":0},{"id":"AudioPlayer","label":"Audio Player","shape":"rect","role":"","p":0},{"id":"InteractivePlayer","label":"Interactive Player","shape":"rect","role":"","p":0},{"id":"EbookReader","label":"Ebook Reader","shape":"rect","role":"","p":0},{"id":"TrackProgress","label":"Track Progress","shape":"rect","role":"","p":3},{"id":"ProgressDB","label":"( Progress Database)","shape":"rect","role":"","p":3},{"id":"AIRecommend","label":"AI Recommendations","shape":"rect","role":"","p":4},{"id":"RecommendNext","label":"Recommend Next Content","shape":"rect","role":"","p":0},{"id":"Analytics","label":"Analytics & Insights","shape":"rect","role":"","p":5},{"id":"TeacherDashboard","label":"Teacher Dashboard","shape":"rect","role":"","p":0},{"id":"StudentDashboard","label":"Student Dashboard","shape":"rect","role":"","p":3},{"id":"Review","label":"Content Effective?","shape":"diamond","role":"","p":0},{"id":"Keep","label":"Keep Content","shape":"rect","role":"","p":0},{"id":"Update","label":"Update Content","shape":"rect","role":"","p":0},{"id":"Archive","label":"Archive","shape":"rect","role":"","p":0},{"id":"End","label":"Continuous Cycle","shape":"round","role":"","p":0}],"edges":[{"from":"Start","to":"Upload","label":"","dashed":false},{"from":"Upload","to":"ContentType","label":"","dashed":false},{"from":"ContentType","to":"VideoProcess","label":"Video","dashed":false},{"from":"ContentType","to":"DocProcess","label":"Document","dashed":false},{"from":"ContentType","to":"AudioProcess","label":"Audio","dashed":false},{"from":"ContentType","to":"InteractiveCreate","label":"Interactive","dashed":false},{"from":"ContentType","to":"EbookProcess","label":"Ebook","dashed":false},{"from":"VideoProcess","to":"Transcode","label":"","dashed":false},{"from":"Transcode","to":"GenerateThumb","label":"","dashed":false},{"from":"GenerateThumb","to":"ExtractAudio","label":"","dashed":false},{"from":"ExtractAudio","to":"AITranscript","label":"","dashed":false},{"from":"AITranscript","to":"VideoReady","label":"","dashed":false},{"from":"DocProcess","to":"PDFConvert","label":"","dashed":false},{"from":"PDFConvert","to":"ExtractText","label":"","dashed":false},{"from":"ExtractText","to":"DocReady","label":"","dashed":false},{"from":"AudioProcess","to":"AudioTranscode","label":"","dashed":false},{"from":"AudioTranscode","to":"AudioTranscript","label":"","dashed":false},{"from":"AudioTranscript","to":"AudioReady","label":"","dashed":false},{"from":"InteractiveCreate","to":"InteractiveDesign","label":"","dashed":false},{"from":"InteractiveDesign","to":"InteractiveReady","label":"","dashed":false},{"from":"EbookProcess","to":"EbookConvert","label":"","dashed":false},{"from":"EbookConvert","to":"EbookReady","label":"","dashed":false},{"from":"VideoReady","to":"Organize","label":"","dashed":false},{"from":"DocReady","to":"Organize","label":"","dashed":false},{"from":"AudioReady","to":"Organize","label":"","dashed":false},{"from":"InteractiveReady","to":"Organize","label":"","dashed":false},{"from":"EbookReady","to":"Organize","label":"","dashed":false},{"from":"Organize","to":"AITag","label":"","dashed":false},{"from":"AITag","to":"Categorize","label":"","dashed":false},{"from":"Categorize","to":"AccessControl","label":"","dashed":false},{"from":"AccessControl","to":"Publish","label":"","dashed":false},{"from":"Publish","to":"StudentAccess","label":"","dashed":false},{"from":"StudentAccess","to":"StudentView","label":"","dashed":false},{"from":"StudentView","to":"VideoPlayer","label":"Video","dashed":false},{"from":"StudentView","to":"DocReader","label":"Document","dashed":false},{"from":"StudentView","to":"AudioPlayer","label":"Audio","dashed":false},{"from":"StudentView","to":"InteractivePlayer","label":"Interactive","dashed":false},{"from":"StudentView","to":"EbookReader","label":"Ebook","dashed":false},{"from":"VideoPlayer","to":"TrackProgress","label":"","dashed":false},{"from":"DocReader","to":"TrackProgress","label":"","dashed":false},{"from":"AudioPlayer","to":"TrackProgress","label":"","dashed":false},{"from":"InteractivePlayer","to":"TrackProgress","label":"","dashed":false},{"from":"EbookReader","to":"TrackProgress","label":"","dashed":false},{"from":"TrackProgress","to":"ProgressDB","label":"","dashed":false},{"from":"ProgressDB","to":"AIRecommend","label":"","dashed":false},{"from":"AIRecommend","to":"RecommendNext","label":"","dashed":false},{"from":"RecommendNext","to":"StudentView","label":"","dashed":false},{"from":"ProgressDB","to":"Analytics","label":"","dashed":false},{"from":"Analytics","to":"TeacherDashboard","label":"","dashed":false},{"from":"Analytics","to":"StudentDashboard","label":"","dashed":false},{"from":"TeacherDashboard","to":"Review","label":"","dashed":false},{"from":"Review","to":"Keep","label":"Yes","dashed":false},{"from":"Review","to":"Update","label":"No","dashed":false},{"from":"Review","to":"Archive","label":"Outdated","dashed":false},{"from":"Update","to":"Upload","label":"","dashed":false},{"from":"Archive","to":"End","label":"","dashed":false},{"from":"Keep","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-06-digital-library-content-management\">📚 WF-06: Digital Library &amp; Content Management\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §6 · \u003cb>Scope\u003c/b>: 🚧 Roadmap P2\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_06\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - Modern Learning Resources \u003cbr> \u003cb>Phases\u003c/b>: 6 stages \u003cbr> \u003cb>Duration\u003c/b>: Continuous lifecycle \u003cbr> \u003cb>Frequency\u003c/b>: Daily content updates \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Phase 1 (Basic), Phase 2 (Enhanced)\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>Digital Library workflow quản lý toàn bộ vòng đời của nội dung học tập từ upload, organize, distribute đến track usage và analytics. Hệ thống hỗ trợ đa dạng loại content: video, document, audio, ebook, interactive content với AI-powered recommendations.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Tăng engagement học viên (70%+ complete rate)\u003c/li>\u003cli>Giảm workload giáo viên (tái sử dụng content)\u003c/li>\u003cli>Học viên có thể học mọi lúc mọi nơi\u003c/li>\u003cli>Tracking chi tiết tiến độ học tập\u003c/li>\u003cli>Cá nhân hóa learning experience\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-1-content-upload-processing\">Phase 1: Content Upload &amp; Processing\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Upload and prepare content for delivery\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Librarian\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, System\u003c/p>\n\u003ch3 id=\"step-1-upload-content\">Step 1: Upload Content\u003c/h3>\n\u003cp>\u003cb>Teacher/Librarian uploads content\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface ContentUpload {\n  title: string;\n  description: string;\n  type: 'video' | 'document' | 'audio' | 'interactive' | 'ebook';\n  file: File;\n  \n  // Metadata\n  program_id?: string;\n  class_id?: string;\n  lesson_id?: string;\n  tags: string[];\n  level: 'beginner' | 'intermediate' | 'advanced';\n  language: 'vi' | 'en';\n  \n  // Access control\n  access_level: 'public' | 'enrolled' | 'class' | 'paid';\n  available_from?: Date;\n  expires_at?: Date;\n}\n\nasync function uploadContent(upload: ContentUpload, uploadedBy: string) {\n  // 1. Validate file\n  const validation = validateFile(upload.file, upload.type);\n  if (!validation.valid) {\n    throw new Error(validation.error);\n  }\n  \n  // 2. Create content record\n  const content = await Content.create({\n    title: upload.title,\n    description: upload.description,\n    type: upload.type,\n    status: 'processing',\n    uploaded_by: uploadedBy,\n    uploaded_at: new Date(),\n    file_size: upload.file.size,\n    file_name: upload.file.name,\n    ...upload\n  });\n  \n  // 3. Upload to storage\n  const storagePath = `content/${content.type}/${content.id}/${upload.file.name}`;\n  const uploadResult = await uploadToStorage(upload.file, storagePath);\n  \n  content.raw_url = uploadResult.url;\n  await content.save();\n  \n  // 4. Queue for processing\n  await contentProcessingQueue.add({\n    content_id: content.id,\n    type: upload.type,\n    raw_url: uploadResult.url\n  });\n  \n  return content;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2a-video-processing\">Step 2A: Video Processing\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function processVideo(contentId: string) {\n  const content = await Content.findOne(contentId);\n  \n  try {\n    // 1. Download original\n    const originalFile = await downloadFile(content.raw_url);\n    \n    // 2. Transcode to multiple qualities\n    const transcoded = await transcodeVideo({\n      input: originalFile,\n      outputs: [\n        { resolution: '1080p', bitrate: '4000k', format: 'mp4' },\n        { resolution: '720p', bitrate: '2000k', format: 'mp4' },\n        { resolution: '480p', bitrate: '1000k', format: 'mp4' },\n        { resolution: '360p', bitrate: '500k', format: 'mp4' }\n      ]\n    });\n    \n    // 3. Generate thumbnail (at 10% point)\n    const duration = await getVideoDuration(originalFile);\n    const thumbnailTime = Math.floor(duration * 0.1);\n    const thumbnail = await generateThumbnail(originalFile, thumbnailTime);\n    \n    // 4. Extract audio track (for accessibility)\n    const audioTrack = await extractAudio(originalFile, 'mp3');\n    \n    // 5. Generate transcript with AI\n    const transcript = await generateTranscript(audioTrack);\n    \n    // 6. Generate subtitles from transcript\n    const subtitles = await generateSubtitles(transcript, duration);\n    \n    // 7. Upload all assets\n    const assets = await uploadAssets({\n      videos: transcoded,\n      thumbnail: thumbnail,\n      audio: audioTrack,\n      transcript: transcript,\n      subtitles: subtitles,\n      path: `content/video/${contentId}`\n    });\n    \n    // 8. Update content record\n    content.status = 'ready';\n    content.url = assets.videos['720p']; // Default quality\n    content.thumbnail_url = assets.thumbnail;\n    content.audio_url = assets.audio;\n    content.transcript = transcript.text;\n    content.subtitles_url = assets.subtitles;\n    content.duration = duration;\n    content.available_qualities = ['360p', '480p', '720p', '1080p'];\n    content.processed_at = new Date();\n    await content.save();\n    \n    // 9. Notify uploader\n    await notifyUser(content.uploaded_by, {\n      title: 'Video đã xử lý xong',\n      message: `${content.title} đã sẵn sàng sử dụng`,\n      link: `/library/videos/${content.id}`\n    });\n    \n    return content;\n    \n  } catch (error) {\n    content.status = 'failed';\n    content.processing_error = error.message;\n    await content.save();\n    throw error;\n  }\n}\n\n// AI Transcript Generation\nasync function generateTranscript(audioFile: Buffer): Promise&lt;Transcript&gt; {\n  // Use OpenAI Whisper API\n  const response = await openai.audio.transcriptions.create({\n    file: audioFile,\n    model: 'whisper-1',\n    language: 'vi', // or detect automatically\n    response_format: 'verbose_json',\n    timestamp_granularities: ['word', 'segment']\n  });\n  \n  return {\n    text: response.text,\n    language: response.language,\n    duration: response.duration,\n    segments: response.segments.map(seg =&gt; ({\n      start: seg.start,\n      end: seg.end,\n      text: seg.text\n    })),\n    words: response.words.map(word =&gt; ({\n      word: word.word,\n      start: word.start,\n      end: word.end\n    }))\n  };\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2b-document-processing\">Step 2B: Document Processing\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function processDocument(contentId: string) {\n  const content = await Content.findOne(contentId);\n  \n  try {\n    const originalFile = await downloadFile(content.raw_url);\n    \n    // 1. Convert to PDF (if not already)\n    let pdfFile = originalFile;\n    if (content.file_name.endsWith('.docx') || content.file_name.endsWith('.pptx')) {\n      pdfFile = await convertToPDF(originalFile);\n    }\n    \n    // 2. Extract text for search\n    const extractedText = await extractTextFromPDF(pdfFile);\n    \n    // 3. Generate thumbnail (first page)\n    const thumbnail = await generatePDFThumbnail(pdfFile, 1);\n    \n    // 4. Get page count\n    const pageCount = await getPDFPageCount(pdfFile);\n    \n    // 5. Upload assets\n    const assets = await uploadAssets({\n      pdf: pdfFile,\n      thumbnail: thumbnail,\n      path: `content/documents/${contentId}`\n    });\n    \n    // 6. Update content\n    content.status = 'ready';\n    content.url = assets.pdf;\n    content.thumbnail_url = assets.thumbnail;\n    content.extracted_text = extractedText;\n    content.page_count = pageCount;\n    content.processed_at = new Date();\n    await content.save();\n    \n    // 7. Notify uploader\n    await notifyUser(content.uploaded_by, {\n      title: 'Tài liệu đã xử lý xong',\n      message: `${content.title} đã sẵn sàng`,\n      link: `/library/documents/${content.id}`\n    });\n    \n    return content;\n    \n  } catch (error) {\n    content.status = 'failed';\n    content.processing_error = error.message;\n    await content.save();\n    throw error;\n  }\n}\u003c/code>\u003c/pre>\u003ch3 id=\"step-2c-interactive-content-creation\">Step 2C: Interactive Content Creation\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface InteractiveContent {\n  type: 'drag_drop' | 'fill_blanks' | 'matching' | 'flashcards' | 'quiz';\n  content: any; // Type-specific structure\n  auto_gradable: boolean;\n  max_attempts?: number;\n  show_solution: boolean;\n}\n\n// Example: Fill in the blanks\ninterface FillBlanksContent {\n  text: string; // \"The capital of Vietnam is __blank__.\"\n  blanks: Array&lt;{\n    id: string;\n    position: number;\n    correct_answers: string[]; // [\"Hanoi\", \"Ha Noi\"]\n    case_sensitive: boolean;\n  }&gt;;\n  instructions: string;\n}\n\nasync function createInteractiveContent(\n  contentData: ContentUpload,\n  interactiveConfig: InteractiveContent\n) {\n  const content = await Content.create({\n    ...contentData,\n    type: 'interactive',\n    interactive_type: interactiveConfig.type,\n    interactive_config: interactiveConfig,\n    status: 'ready',\n    processed_at: new Date()\n  });\n  \n  return content;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-2-organization-tagging\">Phase 2: Organization &amp; Tagging\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Organize content for easy discovery\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Librarian\u003c/span>, \u003cspan class=\"wl\">Teacher\u003c/span>, AI System\u003c/p>\n\u003ch3 id=\"ai-powered-auto-tagging\">AI-Powered Auto-Tagging\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function autoTagContent(contentId: string) {\n  const content = await Content.findOne(contentId);\n  \n  // 1. Prepare content for AI analysis\n  const analysisInput = {\n    title: content.title,\n    description: content.description,\n    extracted_text: content.extracted_text || content.transcript,\n    type: content.type,\n    language: content.language\n  };\n  \n  // 2. Call AI to generate tags\n  const aiTags = await generateTags(analysisInput);\n  \n  // 3. Detect topics and categories\n  const topics = await detectTopics(analysisInput);\n  \n  // 4. Determine difficulty level (if not set)\n  if (!content.level) {\n    content.level = await detectDifficultyLevel(analysisInput);\n  }\n  \n  // 5. Suggest related content\n  const relatedContent = await findRelatedContent(contentId, topics);\n  \n  // 6. Update content\n  content.ai_generated_tags = aiTags;\n  content.topics = topics;\n  content.related_content_ids = relatedContent.map(c =&gt; c.id);\n  await content.save();\n  \n  return { tags: aiTags, topics, level: content.level };\n}\n\nasync function generateTags(input: any): Promise&lt;string[]&gt; {\n  const prompt = `\nPhân tích nội dung học tập sau và tạo tags phù hợp:\n\nTiêu đề: ${input.title}\nMô tả: ${input.description}\nNội dung: ${input.extracted_text?.substring(0, 1000)}\n\nHãy tạo 5-10 tags ngắn gọn (tiếng Việt) để mô tả:\n- Chủ đề chính\n- Kỹ năng liên quan\n- Mức độ (nếu xác định được)\n- Loại nội dung\n\nTrả về JSON array: [\"tag1\", \"tag2\", ...]\n  `;\n  \n  const response = await callAI({\n    model: 'gpt-4',\n    prompt: prompt,\n    response_format: 'json'\n  });\n  \n  return response.tags;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"categorization\">Categorization\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface ContentCategory {\n  id: string;\n  name: string;\n  parent_id?: string;\n  level: number;\n}\n\n// Example hierarchy:\n// - English (level 0)\n//   - Grammar (level 1)\n//     - Tenses (level 2)\n//       - Present Simple (level 3)\n//   - Vocabulary (level 1)\n//   - Speaking (level 1)\n//   - Listening (level 1)\n\nasync function categorizeContent(contentId: string, categoryIds: string[]) {\n  await ContentCategoryMapping.createMany(\n    categoryIds.map(catId =&gt; ({\n      content_id: contentId,\n      category_id: catId\n    }))\n  );\n  \n  // Update content's primary category\n  const content = await Content.findOne(contentId);\n  content.primary_category_id = categoryIds[0];\n  await content.save();\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-3-access-control-publishing\">Phase 3: Access Control &amp; Publishing\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Control who can access what content\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Librarian\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>\u003c/p>\n\u003ch3 id=\"access-levels\">Access Levels\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">enum AccessLevel {\n  PUBLIC = 'public',           // Anyone can view\n  ENROLLED = 'enrolled',       // Enrolled students only\n  CLASS = 'class',             // Specific class only\n  PROGRAM = 'program',         // Specific program\n  PAID = 'paid',               // Purchased separately\n  PREMIUM = 'premium'          // Premium subscription\n}\n\ninterface AccessControl {\n  content_id: string;\n  access_level: AccessLevel;\n  \n  // Specific restrictions\n  allowed_class_ids?: string[];\n  allowed_program_ids?: string[];\n  allowed_student_ids?: string[];\n  \n  // Time-based\n  available_from?: Date;\n  expires_at?: Date;\n  \n  // Download control\n  allow_download: boolean;\n  max_downloads?: number;\n  \n  // DRM\n  drm_enabled: boolean;\n}\n\nasync function setAccessControl(\n  contentId: string,\n  accessControl: AccessControl\n) {\n  const content = await Content.findOne(contentId);\n  \n  content.access_level = accessControl.access_level;\n  content.allowed_class_ids = accessControl.allowed_class_ids;\n  content.allowed_program_ids = accessControl.allowed_program_ids;\n  content.available_from = accessControl.available_from;\n  content.expires_at = accessControl.expires_at;\n  content.allow_download = accessControl.allow_download;\n  content.drm_enabled = accessControl.drm_enabled;\n  \n  await content.save();\n  \n  return content;\n}\n\n// Check if student can access content\nasync function canAccessContent(\n  studentId: string,\n  contentId: string\n): Promise&lt;{ can_access: boolean; reason?: string }&gt; {\n  const content = await Content.findOne(contentId);\n  const student = await Student.findOne(studentId);\n  \n  // Check time-based restrictions\n  const now = new Date();\n  if (content.available_from &amp;&amp; now &lt; content.available_from) {\n    return { can_access: false, reason: 'Not yet available' };\n  }\n  if (content.expires_at &amp;&amp; now &gt; content.expires_at) {\n    return { can_access: false, reason: 'Expired' };\n  }\n  \n  // Check access level\n  switch (content.access_level) {\n    case AccessLevel.PUBLIC:\n      return { can_access: true };\n      \n    case AccessLevel.ENROLLED:\n      const hasEnrollment = await Enrollment.exists({\n        student_id: studentId,\n        status: 'active'\n      });\n      return {\n        can_access: hasEnrollment,\n        reason: hasEnrollment ? undefined : 'Must be enrolled in any class'\n      };\n      \n    case AccessLevel.CLASS:\n      if (!content.allowed_class_ids?.length) {\n        return { can_access: false, reason: 'No classes configured' };\n      }\n      const inClass = await Enrollment.exists({\n        student_id: studentId,\n        class_id: In(content.allowed_class_ids),\n        status: 'active'\n      });\n      return {\n        can_access: inClass,\n        reason: inClass ? undefined : 'Must be enrolled in this class'\n      };\n      \n    case AccessLevel.PAID:\n      const hasPurchased = await ContentPurchase.exists({\n        student_id: studentId,\n        content_id: contentId,\n        status: 'completed'\n      });\n      return {\n        can_access: hasPurchased,\n        reason: hasPurchased ? undefined : 'Must purchase this content'\n      };\n      \n    default:\n      return { can_access: false, reason: 'Unknown access level' };\n  }\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-4-student-consumption-tracking\">Phase 4: Student Consumption &amp; Tracking\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Deliver content and track learning progress\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Student\u003c/span>, System\u003c/p>\n\u003ch3 id=\"video-player-with-tracking\">Video Player with Tracking\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface VideoPlayerState {\n  content_id: string;\n  student_id: string;\n  \n  // Playback\n  current_time: number;\n  duration: number;\n  quality: '360p' | '480p' | '720p' | '1080p';\n  playback_rate: number;\n  \n  // Features\n  subtitles_enabled: boolean;\n  volume: number;\n  \n  // User actions\n  notes: Array&lt;{\n    timestamp: number;\n    note: string;\n  }&gt;;\n  bookmarks: number[];\n  \n  // Tracking\n  watch_progress: number; // 0-100%\n  total_watch_time: number; // seconds\n  completed: boolean;\n}\n\nasync function trackVideoProgress(\n  studentId: string,\n  contentId: string,\n  currentTime: number,\n  duration: number\n) {\n  const progress = Math.floor((currentTime / duration) * 100);\n  \n  let record = await ContentProgress.findOne({\n    student_id: studentId,\n    content_id: contentId\n  });\n  \n  if (!record) {\n    record = await ContentProgress.create({\n      student_id: studentId,\n      content_id: contentId,\n      started_at: new Date(),\n      progress: 0,\n      watch_time: 0\n    });\n  }\n  \n  // Update progress (only increase, never decrease)\n  record.progress = Math.max(record.progress, progress);\n  record.last_accessed_at = new Date();\n  record.watch_time += 5; // Assume 5 seconds since last update\n  \n  // Mark as completed if watched 90%+\n  if (progress &gt;= 90 &amp;&amp; !record.completed) {\n    record.completed = true;\n    record.completed_at = new Date();\n    \n    // Award points/badges\n    await awardCompletionReward(studentId, contentId);\n    \n    // Trigger AI recommendation\n    await generateNextRecommendations(studentId);\n  }\n  \n  await record.save();\n  \n  return record;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"document-reader-with-tracking\">Document Reader with Tracking\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface DocumentReaderState {\n  content_id: string;\n  student_id: string;\n  \n  // Reading\n  current_page: number;\n  total_pages: number;\n  \n  // Annotations\n  highlights: Array&lt;{\n    page: number;\n    text: string;\n    color: string;\n  }&gt;;\n  notes: Array&lt;{\n    page: number;\n    note: string;\n  }&gt;;\n  bookmarks: number[];\n  \n  // Progress\n  pages_read: number[];\n  reading_progress: number; // 0-100%\n}\n\nasync function trackDocumentProgress(\n  studentId: string,\n  contentId: string,\n  currentPage: number,\n  totalPages: number\n) {\n  let record = await ContentProgress.findOne({\n    student_id: studentId,\n    content_id: contentId\n  });\n  \n  if (!record) {\n    record = await ContentProgress.create({\n      student_id: studentId,\n      content_id: contentId,\n      started_at: new Date(),\n      progress: 0,\n      pages_read: []\n    });\n  }\n  \n  // Track unique pages read\n  if (!record.pages_read.includes(currentPage)) {\n    record.pages_read.push(currentPage);\n  }\n  \n  // Calculate progress\n  record.progress = Math.floor((record.pages_read.length / totalPages) * 100);\n  record.last_accessed_at = new Date();\n  \n  // Complete if read 80%+ pages\n  if (record.progress &gt;= 80 &amp;&amp; !record.completed) {\n    record.completed = true;\n    record.completed_at = new Date();\n    \n    await awardCompletionReward(studentId, contentId);\n    await generateNextRecommendations(studentId);\n  }\n  \n  await record.save();\n  \n  return record;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"interactive-content-tracking\">Interactive Content Tracking\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function trackInteractiveProgress(\n  studentId: string,\n  contentId: string,\n  attempt: InteractiveAttempt\n) {\n  // Save attempt\n  const attemptRecord = await InteractiveAttempt.create({\n    student_id: studentId,\n    content_id: contentId,\n    started_at: attempt.started_at,\n    completed_at: attempt.completed_at,\n    answers: attempt.answers,\n    score: attempt.score,\n    max_score: attempt.max_score,\n    passed: attempt.score &gt;= (attempt.max_score * 0.7) // 70% to pass\n  });\n  \n  // Update progress\n  let progress = await ContentProgress.findOne({\n    student_id: studentId,\n    content_id: contentId\n  });\n  \n  if (!progress) {\n    progress = await ContentProgress.create({\n      student_id: studentId,\n      content_id: contentId,\n      started_at: new Date(),\n      progress: 0\n    });\n  }\n  \n  progress.attempts_count += 1;\n  progress.best_score = Math.max(progress.best_score || 0, attempt.score);\n  progress.last_accessed_at = new Date();\n  \n  if (attemptRecord.passed &amp;&amp; !progress.completed) {\n    progress.completed = true;\n    progress.completed_at = new Date();\n    progress.progress = 100;\n    \n    await awardCompletionReward(studentId, contentId);\n  }\n  \n  await progress.save();\n  \n  return { attempt: attemptRecord, progress };\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-5-ai-recommendations\">Phase 5: AI Recommendations\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Personalize content discovery for each student\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: AI System, \u003cspan class=\"wl\">Student\u003c/span>\u003c/p>\n\u003ch3 id=\"recommendation-engine\">Recommendation Engine\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function generateRecommendations(studentId: string): Promise&lt;Content[]&gt; {\n  const student = await Student.findOne(studentId);\n  const enrollments = await getActiveEnrollments(studentId);\n  const viewHistory = await getViewHistory(studentId, 30); // Last 30 days\n  const progress = await getContentProgress(studentId);\n  \n  // 1. Get student's learning profile\n  const profile = {\n    level: student.level,\n    interests: extractInterests(viewHistory),\n    strengths: identifyStrengths(progress),\n    gaps: identifyGaps(progress),\n    preferred_content_types: getPreferredTypes(viewHistory),\n    active_programs: enrollments.map(e =&gt; e.program_id)\n  };\n  \n  // 2. Generate recommendations using multiple strategies\n  const recommendations = await Promise.all([\n    // Strategy 1: Continue where left off\n    getIncompleteContent(studentId),\n    \n    // Strategy 2: Next in sequence\n    getNextInSequence(studentId, enrollments),\n    \n    // Strategy 3: Fill knowledge gaps\n    getGapFillingContent(profile.gaps, profile.level),\n    \n    // Strategy 4: Similar to what student liked\n    getSimilarContent(viewHistory, 5),\n    \n    // Strategy 5: Popular among peers\n    getPopularAmongPeers(student.level, enrollments),\n    \n    // Strategy 6: AI-powered personalization\n    getAIRecommendations(profile)\n  ]);\n  \n  // 3. Deduplicate and rank\n  const uniqueContent = deduplicateContent(recommendations.flat());\n  const rankedContent = rankRecommendations(uniqueContent, profile);\n  \n  // 4. Return top 20\n  return rankedContent.slice(0, 20);\n}\n\nasync function getAIRecommendations(profile: StudentProfile): Promise&lt;Content[]&gt; {\n  const prompt = `\nDựa trên profile học viên sau, hãy recommend 10 nội dung học tập phù hợp:\n\nTrình độ: ${profile.level}\nSở thích: ${profile.interests.join(', ')}\nĐiểm mạnh: ${profile.strengths.join(', ')}\nCần cải thiện: ${profile.gaps.join(', ')}\nLoại nội dung ưa thích: ${profile.preferred_content_types.join(', ')}\n\nHãy chọn từ thư viện content có sẵn và xếp theo thứ tự ưu tiên.\nGiải thích tại sao recommend mỗi content.\n\nTrả về JSON:\n[\n  {\n    \"content_id\": \"...\",\n    \"reason\": \"...\"\n  }\n]\n  `;\n  \n  // Get available content\n  const availableContent = await getAccessibleContent(profile.student_id);\n  \n  // Call AI\n  const aiResponse = await callAI({\n    model: 'gpt-4',\n    prompt: prompt,\n    context: {\n      available_content: availableContent.map(c =&gt; ({\n        id: c.id,\n        title: c.title,\n        description: c.description,\n        tags: c.tags,\n        level: c.level\n      }))\n    }\n  });\n  \n  // Fetch recommended content\n  const contentIds = aiResponse.map(r =&gt; r.content_id);\n  return await Content.find({ id: In(contentIds) });\n}\u003c/code>\u003c/pre>\u003ch3 id=\"smart-playlist-generation\">Smart Playlist Generation\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function generateLearningPlaylist(\n  studentId: string,\n  topic: string,\n  duration_minutes: number\n): Promise&lt;LearningPlaylist&gt; {\n  const student = await Student.findOne(studentId);\n  \n  // Find content related to topic\n  const relatedContent = await searchContent({\n    query: topic,\n    level: student.level,\n    types: ['video', 'document', 'interactive'],\n    order_by: 'relevance'\n  });\n  \n  // Build playlist that fits duration\n  const playlist = buildPlaylist(relatedContent, duration_minutes);\n  \n  // Save playlist\n  const savedPlaylist = await LearningPlaylist.create({\n    student_id: studentId,\n    title: `Học ${topic} - ${duration_minutes} phút`,\n    description: `Playlist được tạo tự động cho chủ đề ${topic}`,\n    content_items: playlist.map((item, index) =&gt; ({\n      content_id: item.id,\n      order: index + 1,\n      estimated_duration: item.duration || estimateDuration(item)\n    })),\n    total_duration: playlist.reduce((sum, item) =&gt; \n      sum + (item.duration || estimateDuration(item)), 0\n    ),\n    created_at: new Date()\n  });\n  \n  return savedPlaylist;\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"phase-6-analytics-insights\">Phase 6: Analytics &amp; Insights\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Measure content effectiveness and student engagement\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, \u003cspan class=\"wl\">Academic Manager\u003c/span>, \u003cspan class=\"wl\">Librarian\u003c/span>\u003c/p>\n\u003ch3 id=\"content-analytics-dashboard\">Content Analytics Dashboard\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface ContentAnalytics {\n  content_id: string;\n  \n  // Usage metrics\n  views: number;\n  unique_viewers: number;\n  total_watch_time: number;\n  average_watch_time: number;\n  \n  // Engagement\n  completion_rate: number; // %\n  average_progress: number; // %\n  likes: number;\n  downloads: number;\n  shares: number;\n  \n  // Performance\n  average_grade?: number; // For interactive content\n  pass_rate?: number;\n  \n  // Trends\n  views_trend: TimeSeriesData[];\n  completion_trend: TimeSeriesData[];\n  \n  // Demographics\n  by_level: Record&lt;string, number&gt;;\n  by_program: Record&lt;string, number&gt;;\n}\n\nasync function getContentAnalytics(contentId: string): Promise&lt;ContentAnalytics&gt; {\n  const content = await Content.findOne(contentId);\n  \n  // Get all progress records\n  const progressRecords = await ContentProgress.find({ content_id: contentId });\n  \n  const analytics: ContentAnalytics = {\n    content_id: contentId,\n    \n    views: progressRecords.length,\n    unique_viewers: new Set(progressRecords.map(p =&gt; p.student_id)).size,\n    \n    total_watch_time: sumBy(progressRecords, 'watch_time'),\n    average_watch_time: averageBy(progressRecords, 'watch_time'),\n    \n    completion_rate: (progressRecords.filter(p =&gt; p.completed).length / progressRecords.length) * 100,\n    average_progress: averageBy(progressRecords, 'progress'),\n    \n    likes: await ContentLike.count({ content_id: contentId }),\n    downloads: await ContentDownload.count({ content_id: contentId }),\n    shares: await ContentShare.count({ content_id: contentId }),\n    \n    views_trend: await getViewsTrend(contentId, 30),\n    completion_trend: await getCompletionTrend(contentId, 30),\n    \n    by_level: await groupByLevel(progressRecords),\n    by_program: await groupByProgram(progressRecords)\n  };\n  \n  // For interactive content\n  if (content.type === 'interactive') {\n    const attempts = await InteractiveAttempt.find({ content_id: contentId });\n    analytics.average_grade = averageBy(attempts, 'score');\n    analytics.pass_rate = (attempts.filter(a =&gt; a.passed).length / attempts.length) * 100;\n  }\n  \n  return analytics;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"student-learning-dashboard\">Student Learning Dashboard\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">async function getStudentLearningDashboard(studentId: string) {\n  const student = await Student.findOne(studentId);\n  \n  // Get all content progress\n  const allProgress = await ContentProgress.find({ student_id: studentId });\n  \n  // Time-based stats\n  const last7Days = allProgress.filter(p =&gt; \n    isWithinDays(p.last_accessed_at, 7)\n  );\n  const last30Days = allProgress.filter(p =&gt;\n    isWithinDays(p.last_accessed_at, 30)\n  );\n  \n  return {\n    student_id: studentId,\n    student_name: student.name,\n    \n    // Overall stats\n    total_content_accessed: allProgress.length,\n    total_completed: allProgress.filter(p =&gt; p.completed).length,\n    total_watch_time: sumBy(allProgress, 'watch_time'),\n    \n    // Recent activity\n    last_7_days: {\n      content_accessed: last7Days.length,\n      completed: last7Days.filter(p =&gt; p.completed).length,\n      watch_time: sumBy(last7Days, 'watch_time')\n    },\n    \n    last_30_days: {\n      content_accessed: last30Days.length,\n      completed: last30Days.filter(p =&gt; p.completed).length,\n      watch_time: sumBy(last30Days, 'watch_time')\n    },\n    \n    // By type\n    by_content_type: {\n      video: countByType(allProgress, 'video'),\n      document: countByType(allProgress, 'document'),\n      audio: countByType(allProgress, 'audio'),\n      interactive: countByType(allProgress, 'interactive'),\n      ebook: countByType(allProgress, 'ebook')\n    },\n    \n    // Engagement score (0-100)\n    engagement_score: calculateEngagementScore(allProgress),\n    \n    // Learning streak\n    current_streak_days: calculateStreak(allProgress),\n    longest_streak_days: calculateLongestStreak(allProgress),\n    \n    // Recommendations\n    recommended_content: await generateRecommendations(studentId),\n    \n    // In progress\n    in_progress: allProgress.filter(p =&gt; \n      p.progress &gt; 0 &amp;&amp; p.progress &lt; 100 &amp;&amp; !p.completed\n    ).slice(0, 10)\n  };\n}\u003c/code>\u003c/pre>\u003chr>\n\u003ch2 id=\"success-metrics\">Success Metrics\u003c/h2>\n\u003ch3 id=\"content-engagement\">Content Engagement\u003c/h3>\u003cul>\u003cli>\u003cb>Average Completion Rate\u003c/b>: 70%+ (Target: 65%+)\u003c/li>\u003cli>\u003cb>Average Watch Time\u003c/b>: 80%+ of duration (Target: 75%+)\u003c/li>\u003cli>\u003cb>Daily Active Users\u003c/b>: 40%+ of enrolled students (Target: 35%+)\u003c/li>\u003cli>\u003cb>Content Likes\u003c/b>: 60%+ positive rating (Target: 55%+)\u003c/li>\u003c/ul>\n\u003ch3 id=\"content-quality\">Content Quality\u003c/h3>\u003cul>\u003cli>\u003cb>Processing Success Rate\u003c/b>: 98%+ (Target: 95%+)\u003c/li>\u003cli>\u003cb>Average Load Time\u003c/b>: &lt;2s for videos (Target: &lt;3s)\u003c/li>\u003cli>\u003cb>Uptime\u003c/b>: 99.5%+ (Target: 99%+)\u003c/li>\u003cli>\u003cb>User Satisfaction\u003c/b>: 4.2/5 (Target: 4.0/5)\u003c/li>\u003c/ul>\n\u003ch3 id=\"learning-outcomes\">Learning Outcomes\u003c/h3>\u003cul>\u003cli>\u003cb>Students with 80%+ completion\u003c/b>: 60%+ (Target: 50%+)\u003c/li>\u003cli>\u003cb>Average Learning Streak\u003c/b>: 5+ days (Target: 3+ days)\u003c/li>\u003cli>\u003cb>Content Sharing Rate\u003c/b>: 10%+ students share (Target: 5%+)\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-workflows\">Related Workflows\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">WF-02 Teaching &amp;amp; Learning Cycle\u003c/span> - Content used in lessons\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-05 Online &amp;amp; Hybrid Learning\u003c/span> - Recording management\u003c/li>\u003cli>\u003cspan class=\"wl\">WF-07 AI-Powered Assessment\u003c/span> - Interactive assessments\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"related-roles\">Related Roles\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"wl\">Teacher\u003c/span> - Upload and curate content\u003c/li>\u003cli>\u003cspan class=\"wl\">Student\u003c/span> - Consume content and learn\u003c/li>\u003cli>\u003cspan class=\"wl\">Librarian\u003c/span> - Organize and manage library\u003c/li>\u003cli>\u003cspan class=\"wl\">Academic Manager\u003c/span> - Quality control\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>\u003cb>Last Updated\u003c/b>: 2026-08-25 \u003cbr> \u003cb>Reviewed By\u003c/b>: Academic Manager, Librarian \u003cbr> \u003cb>Next Review\u003c/b>: 2026-09-25\u003c/p>"},{"id":"wf_06","file":"WF-07 AI-Powered Assessment & Grading.md","title":"WF-07: AI-Powered Assessment & Grading","category":"critical","phases":[{"title":"Assignment Creation","objective":"Tạo assignment với AI hoặc manual","trigger":"","actors":["Teacher, AI System"],"actions":[],"criteria":[]},{"title":"Student Submission","objective":"Students complete and submit assignments","trigger":"","actors":["Student, System"],"actions":[],"criteria":[]},{"title":"AI Grading","objective":"AI automatically grades submissions","trigger":"","actors":["AI System, Teacher"],"actions":["Code Quality (0-25 điểm)","Efficiency (0-25 điểm)"],"criteria":[]},{"title":"Teacher Review & Adjustment","objective":"Teacher verifies and adjusts AI grades","trigger":"","actors":["Teacher"],"actions":[],"criteria":[]},{"title":"Analytics & Insights","objective":"Generate insights from grading data","trigger":"","actors":["AI System, Teacher, Academic Manager"],"actions":[],"criteria":[]}],"estimated":"1-7 days per assignment cycle","scope":"P3","nodes":[{"id":"Start","label":"Assessment Lifecycle","shape":"round","role":"","p":0},{"id":"Create","label":"Tạo Assignment","shape":"rect","role":"","p":0},{"id":"CreateHow","label":"Tạo như thế nào?","shape":"diamond","role":"","p":0},{"id":"ManualCreate","label":"Giáo viên tự tạo","shape":"rect","role":"","p":0},{"id":"AIGenerate","label":"AI Generate","shape":"rect","role":"","p":2},{"id":"AIInput","label":"Input Requirements","shape":"rect","role":"","p":0},{"id":"AIProcess","label":"AI Tạo đề & đáp án","shape":"rect","role":"","p":2},{"id":"TeacherReview","label":"Giáo viên Review","shape":"rect","role":"","p":3},{"id":"SetType","label":"Assignment Type?","shape":"diamond","role":"","p":0},{"id":"MCSetup","label":"Setup MC Questions","shape":"rect","role":"","p":0},{"id":"EssaySetup","label":"Setup Essay Rubric","shape":"rect","role":"","p":0},{"id":"SpeakingSetup","label":"Setup Speaking Task","shape":"rect","role":"","p":0},{"id":"CodeSetup","label":"Setup Code Challenge","shape":"rect","role":"","p":2},{"id":"InteractiveSetup","label":"Setup Interactive","shape":"rect","role":"","p":0},{"id":"Publish","label":"Publish to Students","shape":"rect","role":"","p":1},{"id":"StudentWork","label":"Students Work","shape":"rect","role":"","p":1},{"id":"SubmitType","label":"Submission Type?","shape":"diamond","role":"","p":1},{"id":"AutoGrade","label":"Auto-grade Instantly","shape":"rect","role":"","p":0},{"id":"EssaySubmit","label":"Essay Submitted","shape":"rect","role":"","p":0},{"id":"AudioSubmit","label":"Audio Submitted","shape":"rect","role":"","p":0},{"id":"CodeSubmit","label":"Code Submitted","shape":"rect","role":"","p":2},{"id":"Graded","label":"Graded","shape":"rect","role":"","p":0},{"id":"AIGradeEssay","label":"AI Grade Essay","shape":"rect","role":"","p":2},{"id":"AIFeedbackEssay","label":"AI Generate Feedback","shape":"rect","role":"","p":2},{"id":"TeacherVerify1","label":"Teacher Review","shape":"rect","role":"","p":3},{"id":"SpeechToText","label":"Speech-to-Text","shape":"rect","role":"","p":0},{"id":"AIAnalyzeSpeaking","label":"AI Analyze Speaking","shape":"rect","role":"","p":2},{"id":"SpeakingScore","label":"Pronunciation + Fluency + Grammar","shape":"rect","role":"","p":0},{"id":"TeacherVerify2","label":"Teacher Review","shape":"rect","role":"","p":3},{"id":"RunTests","label":"Run Auto Tests","shape":"rect","role":"","p":0},{"id":"AICodeReview","label":"AI Code Review","shape":"rect","role":"","p":2},{"id":"CodeScore","label":"Tests + Quality + Performance","shape":"rect","role":"","p":2},{"id":"TeacherVerify3","label":"Teacher Review","shape":"rect","role":"","p":3},{"id":"AdjustGrade","label":"Adjust?","shape":"diamond","role":"","p":0},{"id":"ManualAdjust","label":"Adjust Grade/Feedback","shape":"rect","role":"","p":0},{"id":"Approve","label":"Approve","shape":"rect","role":"","p":0},{"id":"PublishGrade","label":"Publish to Student","shape":"rect","role":"","p":1},{"id":"StudentView","label":"Student Views","shape":"rect","role":"","p":1},{"id":"Analytics","label":"Analytics","shape":"rect","role":"","p":4},{"id":"AIInsights","label":"AI Insights","shape":"rect","role":"","p":2},{"id":"Insights","label":"Phát hiện gì?","shape":"diamond","role":"","p":0},{"id":"RecommendContent","label":"Recommend Content","shape":"rect","role":"","p":0},{"id":"EarlyIntervention","label":"Early Intervention","shape":"rect","role":"","p":0},{"id":"AdvancedContent","label":"Advanced Content","shape":"rect","role":"","p":0},{"id":"NextAssignment","label":"More Assignments?","shape":"diamond","role":"","p":1},{"id":"FinalGrade","label":"Final Grade","shape":"rect","role":"","p":0},{"id":"CompetencyReport","label":"Competency Report","shape":"rect","role":"","p":0},{"id":"End","label":"Complete","shape":"round","role":"","p":1}],"edges":[{"from":"Start","to":"Create","label":"","dashed":false},{"from":"Create","to":"CreateHow","label":"","dashed":false},{"from":"CreateHow","to":"ManualCreate","label":"Manual","dashed":false},{"from":"CreateHow","to":"AIGenerate","label":"AI Generate","dashed":false},{"from":"AIGenerate","to":"AIInput","label":"","dashed":false},{"from":"AIInput","to":"AIProcess","label":"","dashed":false},{"from":"AIProcess","to":"TeacherReview","label":"","dashed":false},{"from":"TeacherReview","to":"ManualCreate","label":"","dashed":false},{"from":"ManualCreate","to":"SetType","label":"","dashed":false},{"from":"SetType","to":"MCSetup","label":"Multiple Choice","dashed":false},{"from":"SetType","to":"EssaySetup","label":"Essay","dashed":false},{"from":"SetType","to":"SpeakingSetup","label":"Speaking","dashed":false},{"from":"SetType","to":"CodeSetup","label":"Code","dashed":false},{"from":"SetType","to":"InteractiveSetup","label":"Interactive","dashed":false},{"from":"MCSetup","to":"Publish","label":"","dashed":false},{"from":"EssaySetup","to":"Publish","label":"","dashed":false},{"from":"SpeakingSetup","to":"Publish","label":"","dashed":false},{"from":"CodeSetup","to":"Publish","label":"","dashed":false},{"from":"InteractiveSetup","to":"Publish","label":"","dashed":false},{"from":"Publish","to":"StudentWork","label":"","dashed":false},{"from":"StudentWork","to":"SubmitType","label":"","dashed":false},{"from":"SubmitType","to":"AutoGrade","label":"MC/Interactive","dashed":false},{"from":"SubmitType","to":"EssaySubmit","label":"Essay","dashed":false},{"from":"SubmitType","to":"AudioSubmit","label":"Speaking","dashed":false},{"from":"SubmitType","to":"CodeSubmit","label":"Code","dashed":false},{"from":"AutoGrade","to":"Graded","label":"","dashed":false},{"from":"EssaySubmit","to":"AIGradeEssay","label":"","dashed":false},{"from":"AIGradeEssay","to":"AIFeedbackEssay","label":"","dashed":false},{"from":"AIFeedbackEssay","to":"TeacherVerify1","label":"","dashed":false},{"from":"AudioSubmit","to":"SpeechToText","label":"","dashed":false},{"from":"SpeechToText","to":"AIAnalyzeSpeaking","label":"","dashed":false},{"from":"AIAnalyzeSpeaking","to":"SpeakingScore","label":"","dashed":false},{"from":"SpeakingScore","to":"TeacherVerify2","label":"","dashed":false},{"from":"CodeSubmit","to":"RunTests","label":"","dashed":false},{"from":"RunTests","to":"AICodeReview","label":"","dashed":false},{"from":"AICodeReview","to":"CodeScore","label":"","dashed":false},{"from":"CodeScore","to":"TeacherVerify3","label":"","dashed":false},{"from":"TeacherVerify1","to":"AdjustGrade","label":"","dashed":false},{"from":"TeacherVerify2","to":"AdjustGrade","label":"","dashed":false},{"from":"TeacherVerify3","to":"AdjustGrade","label":"","dashed":false},{"from":"AdjustGrade","to":"ManualAdjust","label":"Yes","dashed":false},{"from":"AdjustGrade","to":"Approve","label":"No","dashed":false},{"from":"ManualAdjust","to":"Graded","label":"","dashed":false},{"from":"Approve","to":"Graded","label":"","dashed":false},{"from":"Graded","to":"PublishGrade","label":"","dashed":false},{"from":"PublishGrade","to":"StudentView","label":"","dashed":false},{"from":"StudentView","to":"Analytics","label":"","dashed":false},{"from":"Analytics","to":"AIInsights","label":"","dashed":false},{"from":"AIInsights","to":"Insights","label":"","dashed":false},{"from":"Insights","to":"RecommendContent","label":"Knowledge Gap","dashed":false},{"from":"Insights","to":"EarlyIntervention","label":"Low Performance","dashed":false},{"from":"Insights","to":"AdvancedContent","label":"High Performance","dashed":false},{"from":"RecommendContent","to":"NextAssignment","label":"","dashed":false},{"from":"EarlyIntervention","to":"NextAssignment","label":"","dashed":false},{"from":"AdvancedContent","to":"NextAssignment","label":"","dashed":false},{"from":"NextAssignment","to":"Create","label":"Yes","dashed":false},{"from":"NextAssignment","to":"FinalGrade","label":"No","dashed":false},{"from":"FinalGrade","to":"CompetencyReport","label":"","dashed":false},{"from":"CompetencyReport","to":"End","label":"","dashed":false}],"doc":"\u003ch1 id=\"wf-07-ai-powered-assessment-grading\">🤖 WF-07: AI-Powered Assessment &amp; Grading\u003c/h1>\n\u003cblockquote>🧭 \u003cb>Triển khai\u003c/b>: xem \u003ca href=\"./IMPLEMENTATION-MAP.md\" target=\"_blank\" rel=\"noopener\">\u003ccode>IMPLEMENTATION-MAP.md\u003c/code>\u003c/a> §7 · \u003cb>Scope\u003c/b>: 🚧 Roadmap P3 (không AI trong MVP)\u003c/blockquote>\n\u003ch2 id=\"overview\">Overview\u003c/h2>\n\u003cp>\u003cb>Workflow ID\u003c/b>: \u003ccode>wf_07\u003c/code> \u003cbr> \u003cb>Category\u003c/b>: Critical - AI-Enhanced Learning \u003cbr> \u003cb>Phases\u003c/b>: 5 stages \u003cbr> \u003cb>Duration\u003c/b>: 1-7 days per assignment cycle \u003cbr> \u003cb>Frequency\u003c/b>: Weekly \u003cbr> \u003cb>MVP Scope\u003c/b>: ✅ Phase 3 (AI Integration)\u003c/p>\n\u003chr>\n\u003ch2 id=\"description\">Description\u003c/h2>\n\u003cp>AI-Powered Assessment workflow tự động hóa quy trình tạo đề, chấm bài, và đưa feedback cho học viên sử dụng AI. Giảm 50-70% thời gian chấm bài của giáo viên đồng thời cung cấp feedback chi tiết và cá nhân hóa cho từng học viên.\u003c/p>\n\u003cp>\u003cb>Business Impact\u003c/b>: \u003c/p>\u003cul>\u003cli>Giáo viên tiết kiệm 50-70% thời gian chấm bài\u003c/li>\u003cli>Feedback nhanh hơn (từ 7 ngày → 1 ngày)\u003c/li>\u003cli>Feedback chi tiết và cá nhân hóa\u003c/li>\u003cli>Phát hiện học viên yếu sớm\u003c/li>\u003cli>Adaptive testing cá nhân hóa\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"workflow-diagram-mermaid\">Workflow Diagram (Mermaid)\u003c/h2>\u003cdiv class=\"md-hint\">📐 Sơ đồ tương tác của workflow này nằm ở chế độ \u003cb>Sơ đồ\u003c/b> (nút phía trên).\u003c/div>\u003chr>\n\u003ch2 id=\"phase-1-assignment-creation\">Phase 1: Assignment Creation\u003c/h2>\n\u003cp>\u003cb>Objective\u003c/b>: Tạo assignment với AI hoặc manual\u003c/p>\n\u003cp>\u003cb>Actors\u003c/b>: \u003cspan class=\"wl\">Teacher\u003c/span>, AI System\u003c/p>\n\u003ch3 id=\"option-1-ai-generated-assignment\">Option 1: AI-Generated Assignment\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface AIAssignmentRequest {\n  topic: string;\n  level: 'beginner' | 'intermediate' | 'advanced';\n  type: 'multiple_choice' | 'essay' | 'speaking' | 'code' | 'mixed';\n  question_count: number;\n  duration_minutes: number;\n  focus_areas?: string[]; // ['grammar', 'vocabulary', 'reading']\n  learning_objectives?: string[];\n}\n\nasync function generateAssignmentWithAI(\n  request: AIAssignmentRequest,\n  teacherId: string\n) {\n  // 1. Build AI prompt\n  const prompt = `\nTạo bài tập tiếng Anh với yêu cầu sau:\n\nChủ đề: ${request.topic}\nTrình độ: ${request.level}\nLoại câu hỏi: ${request.type}\nSố lượng: ${request.question_count} câu\nThời gian: ${request.duration_minutes} phút\nTập trung vào: ${request.focus_areas?.join(', ') || 'Tất cả kỹ năng'}\nMục tiêu học tập: ${request.learning_objectives?.join(', ') || 'Đánh giá tổng quát'}\n\nYêu cầu:\n1. Câu hỏi phải phù hợp với trình độ\n2. Độ khó tăng dần\n3. Đa dạng dạng bài\n4. Có đáp án chi tiết\n5. Có rubric chấm điểm (nếu là essay)\n\nTrả về JSON theo format:\n{\n  \"title\": \"...\",\n  \"instructions\": \"...\",\n  \"questions\": [\n    {\n      \"type\": \"multiple_choice\",\n      \"question\": \"...\",\n      \"options\": [\"A\", \"B\", \"C\", \"D\"],\n      \"correct_answer\": \"B\",\n      \"explanation\": \"...\",\n      \"points\": 1\n    }\n  ],\n  \"total_points\": 10,\n  \"rubric\": {...} // if essay\n}\n  `;\n  \n  // 2. Call AI\n  const aiResponse = await callAI({\n    model: 'gpt-4',\n    prompt: prompt,\n    response_format: 'json',\n    temperature: 0.7 // Some creativity\n  });\n  \n  // 3. Create draft assignment\n  const assignment = await Assignment.create({\n    title: aiResponse.title,\n    instructions: aiResponse.instructions,\n    type: request.type,\n    questions: aiResponse.questions,\n    total_points: aiResponse.total_points,\n    rubric: aiResponse.rubric,\n    duration_minutes: request.duration_minutes,\n    \n    // Metadata\n    teacher_id: teacherId,\n    ai_generated: true,\n    ai_prompt: request,\n    status: 'draft',\n    created_at: new Date()\n  });\n  \n  // 4. Notify teacher to review\n  await notifyTeacher(teacherId, {\n    title: 'Bài tập AI đã tạo xong',\n    message: 'Vui lòng review trước khi publish',\n    assignment_id: assignment.id,\n    action: 'review'\n  });\n  \n  return assignment;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"option-2-manual-creation\">Option 2: Manual Creation\u003c/h3>\u003cpre>\u003ccode class=\"lang-typescript\">interface ManualAssignment {\n  title: string;\n  instructions: string;\n  type: AssignmentType;\n  questions: Question[];\n  \n  // Grading\n  rubric?: GradingRubric;\n  total_points: number;\n  passing_score: number;\n  \n  // Settings\n  duration_minutes?: number;\n  max_attempts: number;\n  show_correct_answers: boolean;\n  allow_late_submission: boolean;\n  late_penalty_percent: number;\n  \n  // AI features\n  enable_ai_grading: boolean;\n  require_teacher_review: boolean;\n}\n\nasync function createManualAssignment(\n  data: ManualAssignment,\n  classId: string,\n  teacherId: string\n) {\n  const assignment = await Assignment.create({\n    ...data,\n    class_id: classId,\n    teacher_id: teacherId,\n    ai_generated: false,\n    status: 'draft',\n    created_at: new Date()\n  });\n  \n  return assignment;\n}\u003c/code>\u003c/pre>\u003ch3 id=\"question-types-setup\">Question Types Setup\u003c/h3>\n\u003cp>\u003cb>Multiple Choice\u003c/b>:\u003c/p>\u003cpre>\u003ccode class=\"lang-typescript\">interface MultipleChoiceQuestion {\n  question: string;\n  options: string[];\n  correc
