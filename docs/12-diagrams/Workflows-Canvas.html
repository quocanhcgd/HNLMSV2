<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduCenter LMS — Hệ thống Workflow (Canvas)</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#111a2e; --panel:#151f37; --panel2:#1b2742;
    --line:#23324f; --text:#e5e7eb; --muted:#94a3b8; --dim:#64748b;
    --accent:#6366f1; --accent2:#8b5cf6;
    --mvp:#34d399; --p2:#fbbf24; --p3:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(90deg,var(--bg2),var(--panel));border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .brand h1{font-size:15px;font-weight:700}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--text);border-color:var(--dim)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tab .scope{font-size:9px;opacity:.85}
  #navbtns{display:flex;gap:6px;margin-left:auto}
  .nbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:14px}
  .nbtn:hover{background:var(--panel2)}
  .nbtn:disabled{opacity:.35;cursor:default}

  main{position:relative;flex:1;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  #toolbar{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .tl{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .tl:hover{background:var(--panel2)}

  #legend{position:absolute;left:16px;bottom:16px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #legend .lrow{display:flex;align-items:center;gap:8px;margin:3px 0}
  #legend .sw{width:11px;height:11px;border-radius:3px}
  #legend b{color:var(--text);font-weight:600}

  #badge{position:absolute;left:16px;top:14px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #badge h2{font-size:14px;margin-bottom:2px}
  #badge .meta{color:var(--muted);font-size:11px}

  #detail{position:absolute;right:16px;top:14px;width:250px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  #detail.open{display:block}
  #detail .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #detail h3{font-size:13px}
  #detail .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:16px}
  #detail .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  #detail .row:last-child{border:none}
  #detail .k{color:var(--muted)}
  #detail .v{color:var(--text);text-align:right;max-width:150px}
  #detail .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600;color:#0b1220}

  #overview{position:absolute;inset:0;overflow:auto;padding:34px;z-index:4;background:
    radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.14), transparent),
    radial-gradient(900px 500px at 90% 10%, rgba(139,92,246,.12), transparent),
    var(--bg)}
  .ovh{max-width:1180px;margin:0 auto 22px}
  .ovh h1{font-size:24px;font-weight:800}
  .ovh p{color:var(--muted);margin-top:6px;max-width:760px;font-size:13px;line-height:1.6}
  .ov{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--dim);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card .sc{position:absolute;top:14px;right:14px;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;color:#0b1220}
  .card h3{font-size:15px;margin-bottom:6px;padding-right:70px}
  .card .n{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  .card .meta{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}
  .card .bar{height:4px;border-radius:99px;margin-top:12px;background:var(--line);overflow:hidden}
  .card .bar>div{height:100%;border-radius:99px}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;color:var(--dim);font-size:11px;background:rgba(17,26,46,.7);padding:4px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:20;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">📘</div>
      <div><h1>EduCenter LMS</h1><small>Hệ thống Workflow · Canvas</small></div>
    </div>
    <nav id="tabs"></nav>
    <div id="navbtns">
      <button class="nbtn" id="prev" title="Workflow trước">‹</button>
      <button class="nbtn" id="next" title="Workflow sau">›</button>
    </div>
  </header>

  <main>
    <div id="badge">
      <h2 id="bTitle">Tổng quan</h2>
      <div class="meta" id="bMeta"></div>
    </div>
    <div id="detail"></div>
    <canvas id="cv"></canvas>
    <div id="overview"></div>
    <div id="toolbar">
      <button class="tl" id="zin" title="Phóng to">＋</button>
      <button class="tl" id="zout" title="Thu nhỏ">－</button>
      <button class="tl" id="zfit" title="Vừa khung">⤢</button>
      <button class="tl" id="zreset" title="Trang chủ">⌂</button>
    </div>
    <div id="legend"></div>
    <div id="hint">Kéo = di chuyển · Lăn = zoom · Click node = chi tiết · ←/→ hoặc Esc</div>
  </main>
</div>
<div id="loading">Đang tải…</div>

function buildCards(){
  const h=document.createElement('div');h.className='ovh';
  h.innerHTML='<h1>🔄 Hệ thống Workflow — EduCenter LMS</h1><p>'+WORKFLOWS.length+' quy trình nghiệp vụ, tự động layout trên Canvas. Nhấn vào thẻ để mở từng workflow, click node để xem chi tiết, kéo + lăn chuột để điều hướng.</p>';
  ov.appendChild(h);
  const grid=document.createElement('div');grid.className='ov';
  WORKFLOWS.forEach((w,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<span class="sc" style="background:'+SCOPE_COLOR[w.scope]+'">'+(SCOPE_LABEL[w.scope]||'')+'</span>'
      +'<h3>'+w.id.toUpperCase()+' — '+escHtml(w.title)+'</h3>'
      +'<div class="n">'+w.id+'</div>'
      +'<div class="meta">'+w.nodes.length+' node · '+w.edges.length+' nối'+(w.category?'<br>'+escHtml(w.category):'')+(w.phases?' · '+escHtml(w.phases)+' giai đoạn':'')+(w.estimated?'<br>'+escHtml(w.estimated):'')+'</div>'
      +'<div class="bar"><div style="width:'+Math.min(100,Math.round((i+1)/WORKFLOWS.length*100))+'%;background:'+wfAccent[w.id]+'"></div></div>';
    c.onclick=()=>openWorkflow(i);grid.appendChild(c);
  });
  ov.appendChild(grid);
}
function buildLegend(){
  const rows=['comp','finance','admin','system','teacher','student'].filter(r=>ROLE_COLOR[r]);
  let html='<b>Màu theo vai trò</b>';
  rows.forEach(r=>{html+='<div class="lrow"><span class="sw" style="background:'+ROLE_COLOR[r]+'"></span>'+r+'</div>';});
  html+='<div class="lrow" style="margin-top:6px"><span class="sw" style="background:var(--mvp)"></span>MVP</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p2)"></span>Roadmap P2</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p3)"></span>Roadmap P3</div>';
  legend.innerHTML=html;
}
size();buildTabs();buildCards();buildLegend();showOverview();
setTimeout(()=>{const ld=$('loading');if(ld)ld.remove();},100);
})();
</script>
