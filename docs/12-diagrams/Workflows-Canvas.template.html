<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduCenter LMS — Hệ thống Workflow (Canvas)</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#111a2e; --panel:#151f37; --panel2:#1b2742;
    --line:#23324f; --text:#e5e7eb; --muted:#94a3b8; --dim:#64748b;
    --accent:#6366f1; --accent2:#8b5cf6;
    --mvp:#34d399; --p2:#fbbf24; --p3:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(90deg,var(--bg2),var(--panel));border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .brand h1{font-size:15px;font-weight:700}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--text);border-color:var(--dim)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tab .scope{font-size:9px;opacity:.85}
  #navbtns{display:flex;gap:6px;margin-left:auto}
  .nbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:14px}
  .nbtn:hover{background:var(--panel2)}
  .nbtn:disabled{opacity:.35;cursor:default}

  main{position:relative;flex:1;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  #toolbar{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .tl{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .tl:hover{background:var(--panel2)}

  #legend{position:absolute;left:16px;bottom:16px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #legend .lrow{display:flex;align-items:center;gap:8px;margin:3px 0}
  #legend .sw{width:11px;height:11px;border-radius:3px}
  #legend b{color:var(--text);font-weight:600}

  #badge{position:absolute;left:16px;top:14px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #badge h2{font-size:14px;margin-bottom:2px}
  #badge .meta{color:var(--muted);font-size:11px}

  #detail{position:absolute;right:16px;top:14px;width:250px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  #detail.open{display:block}
  #detail .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #detail h3{font-size:13px}
  #detail .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:16px}
  #detail .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  #detail .row:last-child{border:none}
  #detail .k{color:var(--muted)}
  #detail .v{color:var(--text);text-align:right;max-width:150px}
  #detail .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600;color:#0b1220}

  #overview{position:absolute;inset:0;overflow:auto;padding:34px;z-index:4;background:
    radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.14), transparent),
    radial-gradient(900px 500px at 90% 10%, rgba(139,92,246,.12), transparent),
    var(--bg)}
  .ovh{max-width:1180px;margin:0 auto 22px}
  .ovh h1{font-size:24px;font-weight:800}
  .ovh p{color:var(--muted);margin-top:6px;max-width:760px;font-size:13px;line-height:1.6}
  .ov{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--dim);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .card .sc{position:absolute;top:14px;right:14px;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;color:#0b1220}
  .card h3{font-size:15px;margin-bottom:6px;padding-right:70px}
  .card .n{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  .card .meta{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}
  .card .bar{height:4px;border-radius:99px;margin-top:12px;background:var(--line);overflow:hidden}
  .card .bar>div{height:100%;border-radius:99px}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;color:var(--dim);font-size:11px;background:rgba(17,26,46,.7);padding:4px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:20;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">📘</div>
      <div><h1>EduCenter LMS</h1><small>Hệ thống Workflow · Canvas</small></div>
    </div>
    <nav id="tabs"></nav>
    <div id="navbtns">
      <button class="nbtn" id="prev" title="Workflow trước">‹</button>
      <button class="nbtn" id="next" title="Workflow sau">›</button>
    </div>
  </header>

  <main>
    <div id="badge">
      <h2 id="bTitle">Tổng quan</h2>
      <div class="meta" id="bMeta"></div>
    </div>
    <div id="detail"></div>
    <canvas id="cv"></canvas>
    <div id="overview"></div>
    <div id="toolbar">
      <button class="tl" id="zin" title="Phóng to">＋</button>
      <button class="tl" id="zout" title="Thu nhỏ">－</button>
      <button class="tl" id="zfit" title="Vừa khung">⤢</button>
      <button class="tl" id="zreset" title="Trang chủ">⌂</button>
    </div>
    <div id="legend"></div>
    <div id="hint">Kéo = di chuyển · Lăn = zoom · Click node = chi tiết · ←/→ hoặc Esc</div>
  </main>
</div>
<div id="loading">Đang tải…</div>

<script>
const WORKFLOWS = __DATA__;
(function(){
"use strict";
const ROLE_COLOR={consultant:'#f472b6',finance:'#34d399',admin:'#60a5fa',system:'#94a3b8',student:'#c084fc',teacher:'#fb923c'};
const DEFAULT='#818cf8';
const SCOPE_COLOR={MVP:'var(--mvp)',P2:'var(--p2)',P3:'var(--p3)'};
const SCOPE_LABEL={MVP:'MVP',P2:'Roadmap · P2',P3:'Roadmap · P3'};
const ACCENT=['#f43f5e','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#fb923c'];
const wfAccent={};WORKFLOWS.forEach((w,i)=>wfAccent[w.id]=ACCENT[i%ACCENT.length]);

const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const tabs=$('tabs'),ov=$('overview'),detail=$('detail'),legend=$('legend');
const bTitle=$('bTitle'),bMeta=$('bMeta');
let vw=0,vh=0,dpr=1;
const lay={};
let cur=-1;
let T={s:1,tx:0,ty:0};
let hover=null,sel=null,drag=null;

function size(){vw=cv.clientWidth;vh=cv.clientHeight;dpr=window.devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;}
function resize(){size();if(cur>=0)fit(cur);draw();}
addEventListener('resize',resize);

const ROWH=108,GAP=40,PAD=14;
function computeLayout(i){
  const w=WORKFLOWS[i],n=w.nodes,e=w.edges;
  const layer={};n.forEach(x=>layer[x.id]=0);
  for(let k=0;k<n.length+8;k++){let ch=false;e.forEach(ed=>{if(layer[ed.to]<=layer[ed.from]){layer[ed.to]=layer[ed.from]+1;ch=true;}});if(!ch)break;}
  const byLayer={};n.forEach(x=>{(byLayer[layer[x.id]]=byLayer[layer[x.id]]||[]).push(x);});
  const lk=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  let maxW=0;
  lk.forEach(L=>{const row=byLayer[L];row.forEach(x=>{x.w=Math.max(78,Math.min(172,(x.label||x.id).length*7.8+30));x.h=30;if(x.shape==='diamond')x.w=Math.max(x.w,106);});const tw=row.reduce((s,x)=>s+x.w,0)+(row.length-1)*GAP;maxW=Math.max(maxW,tw);});
  const byId={};n.forEach(x=>byId[x.id]=x);
  lk.forEach(L=>{const row=byLayer[L];const tw=row.reduce((s,x)=>s+x.w,0)+(row.length-1)*GAP;let cx0=-tw/2;row.forEach(x=>{x.x=cx0+x.w/2;x.y=L*ROWH+PAD;cx0+=x.w+GAP;});});
  const H=lk.length*ROWH+10;
  lay[i]={byLayer,lk,maxW,H,byId,nodes:n,edges:e};
}
function nodeColor(n){return n.role?(ROLE_COLOR[n.role]||'#818cf8'):'#818cf8';}
function shapePath(x,y,w,h,shape){
  cx.beginPath();
  if(shape==='diamond'){const hw=w/2,hh=h*1.05;cx.moveTo(x,y-hh);cx.lineTo(x+hw,y);cx.lineTo(x,y+hh);cx.lineTo(x-hw,y);cx.closePath();}
  else if(shape==='circle'){cx.arc(x,y,Math.max(w/2,24),0,7);}
  else if(shape==='hex'){const hw=w/2,hh=h*1.15;cx.moveTo(x-hw+9,y-hh);cx.lineTo(x+hw-9,y-hh);cx.lineTo(x+hw,y);cx.lineTo(x+hw-9,y+hh);cx.lineTo(x-hw+9,y+hh);cx.lineTo(x-hw,y);cx.closePath();}
  else{cx.roundRect(x-w/2,y-h/2,w,h,shape==='round'?h/2:9);}
}
function wrap(t,x,y,max){
  t=String(t);const words=t.split(' ');let line='',lines=[];
  for(const wd of words){const test=line?line+' '+wd:wd;if(cx.measureText(test).width>max&&line){lines.push(line);line=wd;}else line=test;}
  lines.push(line);const lh=12,start=y-((lines.length-1)*lh)/2;
  lines.forEach((l,i)=>cx.fillText(l,x,start+i*lh));
}
function drawNode(n){
  const c=nodeColor(n);
  const selThis=sel&&sel.id===n.id,hovThis=hover&&hover.id===n.id;
  cx.save();
  if(selThis){cx.shadowColor=c;cx.shadowBlur=22;}
  cx.fillStyle=c;cx.globalAlpha=0.16;shapePath(n.x,n.y,n.w,n.h,n.shape);cx.fill();cx.globalAlpha=1;
  cx.strokeStyle=c;cx.lineWidth=hovThis?2.6:1.7;shapePath(n.x,n.y,n.w,n.h,n.shape);cx.stroke();
  cx.restore();
  cx.fillStyle='#e7eaf2';cx.font='600 11px system-ui';cx.textAlign='center';cx.textBaseline='middle';
  wrap(n.label,n.x,n.y,n.w-12);
  cx.fillStyle='rgba(148,163,184,0.66)';cx.font='500 8px ui-monospace';cx.fillText(n.id,n.x,n.y-n.h/2-7);
}
function drawEdge(e){
  const w=lay[cur],a=w.byId[e.from],b=w.byId[e.to];if(!a||!b)return;
  const x1=a.x,y1=a.y+a.h/2,x2=b.x,y2=b.y-b.h/2,my=(y1+y2)/2;
  cx.save();
  if(e.dashed)cx.setLineDash([5,5]);else cx.setLineDash([]);
  cx.strokeStyle='rgba(148,163,184,0.5)';cx.lineWidth=1.4;
  cx.beginPath();cx.moveTo(x1,y1);cx.bezierCurveTo(x1,my,x2,my,x2,y2);cx.stroke();cx.setLineDash([]);
  const ang=Math.atan2(y2-y1,x2-x1);
  cx.fillStyle='rgba(148,163,184,0.75)';
  cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2-9*Math.cos(ang-.4),y2-9*Math.sin(ang-.4));cx.lineTo(x2-9*Math.cos(ang+.4),y2-9*Math.sin(ang+.4));cx.closePath();cx.fill();
  if(e.label){cx.fillStyle='#9ca3af';cx.font='500 9px system-ui';cx.textAlign='center';cx.fillText(e.label,(x1+x2)/2,my-4);}
  cx.restore();
}
function draw(){
  cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,vw,vh);
  if(cur<0){cx.restore();return;}
  cx.setTransform(dpr*T.s,0,0,dpr*T.s,dpr*T.tx,dpr*T.ty);
  const L=lay[cur];L.edges.forEach(drawEdge);L.nodes.forEach(drawNode);
  cx.restore();
}
function toWorld(sx,sy){return{x:(sx-T.tx)/T.s,y:(sy-T.ty)/T.s};}
function fit(i){const L=lay[i];const s=Math.min(vw/(L.maxW+60),vh/(L.H+40),1.15);T.s=Math.max(s,0.12);T.tx=vw/2;T.ty=(vh-L.H*T.s)/2+10;}
function hit(sx,sy){const L=lay[cur];if(!L)return null;const p=toWorld(sx,sy);let best=null,bd=1e9;L.nodes.forEach(n=>{const d=Math.hypot(p.x-n.x,p.y-n.y);if(d<Math.max(n.w/2,30)+6&&d<bd){bd=d;best=n;}});return best;}
cv.addEventListener('mousemove',e=>{if(drag)return;hover=hit(e.clientX,e.clientY);draw();cv.style.cursor=hover?'pointer':'grab';});
cv.addEventListener('mousedown',e=>{drag={sx:e.clientX,sy:e.clientY,ox:T.tx,oy:T.ty};cv.style.cursor='grabbing';});
addEventListener('mouseup',()=>{drag=null;cv.style.cursor=hover?'pointer':'grab';});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?0.9:1.11;const m=toWorld(e.clientX,e.clientY);T.s=Math.max(0.12,Math.min(3,T.s*f));T.tx=e.clientX-m.x*T.s;T.ty=e.clientY-m.y*T.s;draw();},{passive:false});
cv.addEventListener('click',e=>{if(drag){drag=null;return;}const h=hit(e.clientX,e.clientY);if(h)showDetail(h);else hideDetail();draw();});
$('zin').onclick=()=>zoomBy(1.25);$('zout').onclick=()=>zoomBy(0.8);
function zoomBy(f){const m=toWorld(vw/2,vh/2);T.s=Math.max(0.12,Math.min(3,T.s*f));T.tx=vw/2-m.x*T.s;T.ty=vh/2-m.y*T.s;draw();}
$('zfit').onclick=()=>{if(cur>=0){fit(cur);draw();}};
$('zreset').onclick=showOverview;
$('prev').onclick=()=>{if(cur>0)openWorkflow(cur-1);};
$('next').onclick=()=>{if(cur<WORKFLOWS.length-1)openWorkflow(cur+1);};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(cur>=0)showOverview();else if(sel)hideDetail();}
  else if(e.key==='ArrowRight'&&cur<WORKFLOWS.length-1)openWorkflow(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)openWorkflow(cur-1);
});
function escHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showDetail(n){
  sel=n;const w=WORKFLOWS[cur];const role=n.role?('<span class="chip" style="background:'+(ROLE_COLOR[n.role]||'#818cf8')+'">'+escHtml(n.role)+'</span>'):'—';
  const outN=w.edges.filter(e=>e.from===n.id).length, inN=w.edges.filter(e=>e.to===n.id).length;
  detail.innerHTML='<div class="dh"><h3>'+escHtml(n.label)+'</h3><button class="x" onclick="window.closeDetail()">✕</button></div>'
    +'<div class="row"><span class="k">Node ID</span><span class="v">'+n.id+'</span></div>'
    +'<div class="row"><span class="k">Hình dạng</span><span class="v">'+n.shape+'</span></div>'
    +'<div class="row"><span class="k">Vai trò</span><span class="v">'+role+'</span></div>'
    +'<div class="row"><span class="k">Nối ra</span><span class="v">'+outN+'</span></div>'
    +'<div class="row"><span class="k">Nối vào</span><span class="v">'+inN+'</span></div>';
  detail.classList.add('open');
}
function hideDetail(){sel=null;detail.classList.remove('open');}
window.closeDetail=hideDetail;
function buildTabs(){
  const ov=document.createElement('button');ov.className='tab';ov.textContent='🏠 Tổng quan';ov.onclick=showOverview;tabs.appendChild(ov);
  WORKFLOWS.forEach((w,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=escHtml(w.title)+' <span class="scope">· '+(SCOPE_LABEL[w.scope]||'')+'</span>';b.onclick=()=>openWorkflow(i);tabs.appendChild(b);});
}
function markTabs(){[...tabs.children].forEach((t,i)=>t.classList.toggle('active',i===cur+1));$('prev').disabled=cur<=0;$('next').disabled=cur>=WORKFLOWS.length-1;}
function openWorkflow(i){
  cur=i;if(!lay[i])computeLayout(i);
  ov.style.display='none';hideDetail();
  bTitle.textContent=WORKFLOWS[i].id.toUpperCase()+' · '+WORKFLOWS[i].title;
  bMeta.textContent=WORKFLOWS[i].nodes.length+' node · '+WORKFLOWS[i].edges.length+' nối · '+(SCOPE_LABEL[WORKFLOWS[i].scope]||'');
  markTabs();fit(i);draw();
}
function showOverview(){
  cur=-1;hideDetail();ov.style.display='block';
  bTitle.textContent='Tổng quan hệ thống';bMeta.textContent=WORKFLOWS.length+' workflow · '+WORKFLOWS.reduce((s,w)=>s+w.nodes.length,0)+' node';
  markTabs();draw();
}
function buildCards(){
  const h=document.createElement('div');h.className='ovh';
  h.innerHTML='<h1>🔄 Hệ thống Workflow — EduCenter LMS</h1><p>'+WORKFLOWS.length+' quy trình nghiệp vụ, tự động layout trên Canvas. Nhấn vào thẻ để mở từng workflow, click node để xem chi tiết, kéo + lăn chuột để điều hướng.</p>';
  ov.appendChild(h);
  const grid=document.createElement('div');grid.className='ov';
  WORKFLOWS.forEach((w,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<span class="sc" style="background:'+SCOPE_COLOR[w.scope]+'">'+(SCOPE_LABEL[w.scope]||'')+'</span>'
      +'<h3>'+w.id.toUpperCase()+' — '+escHtml(w.title)+'</h3>'
      +'<div class="n">'+w.id+'</div>'
      +'<div class="meta">'+w.nodes.length+' node · '+w.edges.length+' nối'+(w.category?'<br>'+escHtml(w.category):'')+(w.phases?' · '+escHtml(w.phases)+' giai đoạn':'')+(w.estimated?'<br>'+escHtml(w.estimated):'')+'</div>'
      +'<div class="bar"><div style="width:'+Math.min(100,Math.round((i+1)/WORKFLOWS.length*100))+'%;background:'+wfAccent[w.id]+'"></div></div>';
    c.onclick=()=>openWorkflow(i);grid.appendChild(c);
  });
  ov.appendChild(grid);
}
function buildLegend(){
  const rows=['comp','finance','admin','system','teacher','student'].filter(r=>ROLE_COLOR[r]);
  let html='<b>Màu theo vai trò</b>';
  rows.forEach(r=>{html+='<div class="lrow"><span class="sw" style="background:'+ROLE_COLOR[r]+'"></span>'+r+'</div>';});
  html+='<div class="lrow" style="margin-top:6px"><span class="sw" style="background:var(--mvp)"></span>MVP</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p2)"></span>Roadmap P2</div>';
  html+='<div class="lrow"><span class="sw" style="background:var(--p3)"></span>Roadmap P3</div>';
  legend.innerHTML=html;
}
size();buildTabs();buildCards();buildLegend();showOverview();
setTimeout(()=>{const ld=$('loading');if(ld)ld.remove();},100);
})();
</script>
</body>
</html>
