<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - EduCenter LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        :root {
            --primary: #0d9488; --primary-light: #5eead4; --secondary: #10b981;
            --accent: #f59e0b; --purple: #8b5cf6; --pink: #ec4899;
            --bg-1: #ffffff; --bg-2: #f9fafb; --bg-3: #f3f4f6;
            --text-1: #111827; --text-2: #6b7280; --text-3: #9ca3af; --border: #e5e7eb;
        }
        html.dark {
            --bg-1: #1e293b; --bg-2: #0f172a; --bg-3: #334155;
            --text-1: #f1f5f9; --text-2: #94a3b8; --text-3: #64748b; --border: #334155;
        }
        body { background: var(--bg-2); color: var(--text-1); transition: background .3s, color .3s; }
        .gradient-teal { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); }
        .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 1rem; transition: background .3s, border-color .3s; }
        .surface { background: var(--bg-1); }
        .track { background: var(--bg-3); }
        .text-soft { color: var(--text-2); }
        .text-faint { color: var(--text-3); }
        .badge { display: inline-flex; align-items: center; padding: .25rem .75rem; border-radius: 9999px; font-size: .75rem; font-weight: 700; }
        .badge-primary { background: rgba(13,148,136,.15); color: var(--primary); }
        .badge-success { background: rgba(16,185,129,.15); color: var(--secondary); }
        .badge-warning { background: rgba(245,158,11,.15); color: var(--accent); }
        .badge-gray { background: var(--bg-3); color: var(--text-2); }
        .nav-item { display: flex; align-items: center; padding: .75rem 1rem; margin: .25rem .5rem; border-radius: .75rem; transition: all .2s; cursor: pointer; color: var(--text-2); font-size: .875rem; }
        .nav-item:hover { background: var(--bg-2); }
        .nav-item.active { background: linear-gradient(135deg, rgba(13,148,136,.12) 0%, rgba(16,185,129,.12) 100%); color: var(--primary); font-weight: 600; }
        .nav-locked { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: #fff; padding: .65rem 1.25rem; border-radius: .75rem; font-weight: 600; transition: all .3s; border: none; cursor: pointer; font-size: .875rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13,148,136,.3); }
        .btn-outline { border: 2px solid var(--border); padding: .6rem 1.25rem; border-radius: .75rem; font-weight: 600; color: var(--text-2); background: var(--bg-1); cursor: pointer; transition: all .2s; font-size: .875rem; }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .sidebar { background: var(--bg-1); border-right: 1px solid var(--border); }
        .stat-icon { width: 46px; height: 46px; border-radius: .9rem; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; }
        .lang-btn { padding: .3rem .7rem; font-size: .75rem; font-weight: 700; color: var(--text-2); background: transparent; border: none; cursor: pointer; }
        .lang-btn.on { background: var(--primary); color: #fff; }
        .theme-btn { width: 36px; height: 34px; border-radius: .5rem; border: 2px solid var(--border); background: var(--bg-1); cursor: pointer; font-size: .95rem; display: inline-flex; align-items: center; justify-content: center; }
        .menu-pop { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; padding: .55rem .8rem; border-radius: .6rem; font-size: .85rem; color: var(--text-1); background: transparent; cursor: pointer; }
        .menu-pop:hover { background: var(--bg-2); }
        .alert-red { background: rgba(239,68,68,.08); border: 1px solid #fecaca; }
        .alert-amber { background: rgba(245,158,11,.1); border: 1px solid #fde68a; }
        .alert-blue { background: rgba(59,130,246,.08); border: 1px solid #bfdbfe; }
        html.dark .alert-red { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.45); }
        html.dark .alert-amber { background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.45); }
        html.dark .alert-blue { background: rgba(59,130,246,.15); border-color: rgba(59,130,246,.45); }
    </style>
</head>
<body>
<aside class="sidebar fixed top-0 left-0 w-64 h-screen z-20 overflow-y-auto">
    <div class="flex items-center space-x-3 p-5 border-b" style="border-color: var(--border);">
        <div class="w-10 h-10 rounded-xl gradient-teal text-white flex items-center justify-center font-bold">E</div>
        <div><p class="font-bold text-sm">EduCenter LMS</p><p class="text-xs text-faint" data-i18n="org_name"></p></div>
    </div>
    <nav class="p-2 pt-3">
        <div class="nav-item active"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span data-i18n="nav_dashboard"></span></div>
        <p class="px-3 pt-2 pb-1 text-xs font-bold uppercase text-faint" data-i18n="grp_admin"></p>
        <div class="nav-item" onclick="go('org')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg><span data-i18n="nav_org"></span></div>
        <div class="nav-item" onclick="go('license')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg><span data-i18n="nav_license"></span></div>
        <div class="nav-item" onclick="go('users')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span data-i18n="nav_users"></span></div>
        <p class="px-3 pt-3 pb-1 text-xs font-bold uppercase text-faint" data-i18n="grp_biz"></p>
        <div class="nav-item" onclick="go('academic')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span data-i18n="nav_academic"></span></div>
        <div class="nav-item" onclick="go('enroll')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span data-i18n="nav_enroll"></span></div>
        <div class="nav-item" onclick="go('finance')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg><span data-i18n="nav_finance"></span></div>
        <div class="nav-item" onclick="go('reports')"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span data-i18n="nav_reports"></span></div>
        <p class="px-3 pt-3 pb-1 text-xs font-bold uppercase text-faint" data-i18n="grp_addon"></p>
        <div class="nav-item nav-locked"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span data-i18n="nav_crm"></span><span class="ml-auto badge badge-warning" data-i18n="not_activated"></span></div>
        <div class="nav-item nav-locked"><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span data-i18n="nav_hrm"></span><span class="ml-auto badge badge-warning" data-i18n="not_activated"></span></div>
    </nav>
</aside>

<div class="ml-64 min-h-screen">
    <div class="surface border-b sticky top-0 z-10" style="border-color: var(--border);">
        <div class="px-8 py-4 flex items-center justify-between">
            <div><h2 class="text-xl font-bold" data-i18n="page_dash"></h2><p class="text-sm text-soft" data-i18n="page_sub"></p></div>
            <div class="flex items-center space-x-3">
                <select id="branchSel" class="text-sm px-3 py-2 rounded-lg border surface" style="border-color: var(--border);" onchange="switchBranch()">
                    <option value="all" data-i18n="all_branches"></option>
                    <option value="hn" data-i18n="br_hn"></option>
                    <option value="hcm" data-i18n="br_hcm"></option>
                </select>
                <button class="relative text-xl" onclick="toast(t('toast_notif'))">🔔<span class="absolute -top-1.5 -right-2 text-[10px] font-bold text-white rounded-full px-1.5" style="background: #ef4444;">3</span></button>
                <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="Dark/Light">🌙</button>
                <button id="langBtn" class="theme-btn !w-auto px-3" onclick="toggleLang()" title="Language">🌐 EN</button>
                <div class="relative" id="userMenu">
                    <button onclick="toggleUserMenu(event)" class="flex items-center gap-2.5 rounded-xl border px-2.5 py-1.5 transition hover:border-teal-600" style="border-color: var(--border); background: var(--bg-1);">
                        <div class="w-8 h-8 rounded-lg gradient-teal text-white flex items-center justify-center text-xs font-bold flex-none">NV</div>
                        <div class="text-left leading-tight hidden sm:block">
                            <p class="text-xs font-bold" data-i18n="user_name"></p>
                            <p class="text-[10px] text-faint" data-i18n="user_role"></p>
                        </div>
                    </button>
                    <div id="userDropdown" class="hidden absolute right-0 top-[52px] card shadow-xl w-56 p-2 z-30">
                        <div class="px-3 py-2.5 mb-1 border-b" style="border-color: var(--border);">
                            <p class="text-sm font-bold" data-i18n="user_name"></p>
                            <p class="text-xs text-faint" data-i18n="user_role"></p>
                        </div>
                        <button class="menu-pop" onclick="demoMenu('user_profile')"><span>👤</span><span data-i18n="user_profile"></span></button>
                        <button class="menu-pop" onclick="demoMenu('user_settings')"><span>⚙️</span><span data-i18n="user_settings"></span></button>
                        <button class="menu-pop" onclick="demoMenu('user_password')"><span>🔑</span><span data-i18n="user_password"></span></button>
                        <div class="border-t my-1" style="border-color: var(--border);"></div>
                        <button class="menu-pop" style="color: #dc2626;" onclick="demoMenu('user_logout')"><span>🚪</span><span data-i18n="user_logout"></span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="p-8">
        <!-- KPI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5 mb-6">
            <div class="card p-5">
                <div class="flex items-start justify-between">
                    <div><p class="text-sm text-soft" data-i18n="kpi_students"></p><p class="text-3xl font-extrabold mt-1 num-change" id="st_students">1.120</p></div>
                    <div class="stat-icon" style="background: rgba(13,148,136,.12);">🎓</div>
                </div>
                <p class="text-xs mt-2 font-semibold" style="color: var(--secondary);" data-i18n="tr_students"></p>
            </div>
            <div class="card p-5">
                <div class="flex items-start justify-between">
                    <div><p class="text-sm text-soft" data-i18n="kpi_classes"></p><p class="text-3xl font-extrabold mt-1 num-change" id="st_classes">36</p></div>
                    <div class="stat-icon" style="background: rgba(139,92,246,.12);">📚</div>
                </div>
                <p class="text-xs mt-2 font-semibold" style="color: var(--secondary);" data-i18n="tr_classes"></p>
            </div>
            <div class="card p-5">
                <div class="flex items-start justify-between">
                    <div><p class="text-sm text-soft" data-i18n="kpi_revenue"></p><p class="text-3xl font-extrabold mt-1 num-change" id="st_revenue">1,42 tỷ ₫</p></div>
                    <div class="stat-icon" style="background: rgba(245,158,11,.15);">💰</div>
                </div>
                <p class="text-xs mt-2 font-semibold" style="color: var(--secondary);" data-i18n="tr_revenue"></p>
            </div>
            <div class="card p-5">
                <div class="flex items-start justify-between">
                    <div><p class="text-sm text-soft" data-i18n="kpi_debt"></p><p class="text-3xl font-extrabold mt-1 num-change" id="st_debt">186 triệu ₫</p></div>
                    <div class="stat-icon" style="background: rgba(239,68,68,.1);">⏳</div>
                </div>
                <p class="text-xs mt-2 font-semibold" style="color: #dc2626;" data-i18n="tr_debt"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-6">
            <div class="card p-6 xl:col-span-2">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="font-bold"><span data-i18n="ch_enroll"></span> <span class="text-xs font-normal text-faint" data-i18n="ch_year"></span></h3>
                    <span class="badge badge-primary">+23% YoY</span>
                </div>
                <div class="flex items-end gap-3 h-44" id="enrollChart"></div>
            </div>
            <div class="card p-6">
                <h3 class="font-bold mb-5" data-i18n="don_title"></h3>
                <div class="flex justify-center mb-4">
                    <div class="w-40 h-40 rounded-full relative" style="background: conic-gradient(#0d9488 0 62%, #10b981 62% 84%, #f59e0b 84% 95%, #ef4444 95% 100%);">
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <p class="w-24 h-24 rounded-full bg-white flex flex-col items-center justify-center" style="background: var(--bg-1);">
                                <b class="text-lg">1,42 tỷ</b><span class="text-[10px] text-faint" data-i18n="don_total"></span>
                            </p>
                        </div>
                    </div>
                </div>
                <ul class="text-sm space-y-2">
                    <li class="flex items-center"><span class="w-3 h-3 rounded mr-2" style="background: #0d9488;"></span><span data-i18n="don_vnpay"></span></li>
                    <li class="flex items-center"><span class="w-3 h-3 rounded mr-2" style="background: #10b981;"></span><span data-i18n="don_cash"></span></li>
                    <li class="flex items-center"><span class="w-3 h-3 rounded mr-2" style="background: #f59e0b;"></span><span data-i18n="don_bank"></span></li>
                    <li class="flex items-center"><span class="w-3 h-3 rounded mr-2" style="background: #ef4444;"></span><span data-i18n="don_momo"></span></li>
                </ul>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-6">
            <div class="card p-6 xl:col-span-2">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold" data-i18n="rec_title"></h3>
                    <button class="btn-outline text-xs px-4 py-1.5" onclick="toast(t('toast_view_all'))" data-i18n="rec_all"></button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm" id="enrollTable"></table>
                </div>
            </div>
            <div class="card p-6">
                <h3 class="font-bold mb-4" data-i18n="al_title"></h3>
                <div class="alert-red p-3.5 rounded-xl mb-3 text-sm">
                    <b class="block" data-i18n="al_overdue"></b><span class="text-soft" data-i18n="al_overdue_sub"></span>
                </div>
                <div class="alert-amber p-3.5 rounded-xl mb-3 text-sm">
                    <b class="block" data-i18n="al_addon"></b><span class="text-soft" data-i18n="al_addon_sub"></span>
                </div>
                <div class="alert-blue p-3.5 rounded-xl mb-3 text-sm">
                    <b class="block" data-i18n="al_storage"></b><span class="text-soft" data-i18n="al_storage_sub"></span>
                </div>
                <div class="alert-blue p-3.5 rounded-xl text-sm">
                    <b class="block" data-i18n="al_class"></b><span class="text-soft" data-i18n="al_class_sub"></span>
                </div>
            </div>
        </div>

        <div class="card p-6">
            <h3 class="font-bold mb-4" data-i18n="qa_title"></h3>
            <div class="flex flex-wrap gap-3">
                <button class="btn-primary" onclick="demoToast('qa_enroll')">+ <span data-i18n="qa_enroll"></span></button>
                <button class="btn-outline" onclick="demoToast('qa_class')">+ <span data-i18n="qa_class"></span></button>
                <button class="btn-outline" onclick="demoToast('qa_fee')">+ <span data-i18n="qa_fee"></span></button>
                <button class="btn-outline" onclick="demoToast('qa_report')">📄 <span data-i18n="qa_report"></span></button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="hidden fixed top-20 right-8 z-50 card px-5 py-3.5 text-sm font-semibold shadow-xl" style="border-left: 4px solid var(--primary);"></div>

<script>
    var I18N = {
        vi: {
            org_name: 'Trung tâm Ngoại ngữ ABC',
            grp_admin: 'Quản trị', grp_biz: 'Nghiệp vụ', grp_addon: 'Addon',
            nav_dashboard: 'Dashboard', nav_org: 'Tổ chức & Chi nhánh', nav_license: 'License',
            nav_users: 'Người dùng & Vai trò', nav_academic: 'Đào tạo', nav_enroll: 'Học viên & Ghi danh',
            nav_finance: 'Tài chính', nav_reports: 'Báo cáo', nav_crm: 'Tuyển sinh & CRM', nav_hrm: 'Nhân sự & Lương',
            not_activated: 'Chưa kích hoạt',
            user_name: 'Nguyễn Văn Admin', user_role: 'Organization Admin',
            user_profile: 'Hồ sơ', user_settings: 'Cài đặt', user_password: 'Đổi mật khẩu', user_logout: 'Đăng xuất',
            all_branches: 'Tất cả chi nhánh', br_hn: 'Chi nhánh Hà Nội', br_hcm: 'Chi nhánh TP.HCM',
            page_dash: 'Dashboard', page_sub: 'Tổng quan hoạt động toàn tổ chức',
            kpi_students: 'Học viên đang theo học', kpi_classes: 'Lớp đang mở', kpi_revenue: 'Doanh thu tháng này', kpi_debt: 'Công nợ phải thu',
            tr_students: '▲ 8,2% so với tháng trước', tr_classes: '▲ 3 lớp mới tuần này',
            tr_revenue: '▲ 12,4% (mục tiêu 1,3 tỷ)', tr_debt: '▼ 5 hóa đơn quá hạn > 30 ngày',
            ch_enroll: '📈 Ghi danh theo tháng', ch_year: 'Năm 2026',
            m: ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12', 'T1'],

    var LANG = localStorage.getItem('ec-lang') || 'vi';
    var THEME = localStorage.getItem('ec-theme') || 'light';
    var branch = 'all';
    function t(k) { return (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : k; }

    function applyTheme() {
        document.documentElement.classList.toggle('dark', THEME === 'dark');
        var b = document.getElementById('themeBtn'); if (b) b.textContent = THEME === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() { THEME = THEME === 'dark' ? 'light' : 'dark'; localStorage.setItem('ec-theme', THEME); applyTheme(); }
    function toggleLang() { setLang(LANG === 'vi' ? 'en' : 'vi'); }
    function updateLangBtns() {
        var b = document.getElementById('langBtn'); if (b) b.textContent = '🌐 ' + (LANG === 'vi' ? 'EN' : 'VI');
    }
    function setLang(l) {
        LANG = l; localStorage.setItem('ec-lang', l);
        document.documentElement.lang = l;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = I18N[l][el.getAttribute('data-i18n')]; });
        updateLangBtns(); renderEnrollTable();
    }

    var toastTimer = null;
    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg; el.classList.remove('hidden');
        clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 2600);
    }
    function demoToast(key) { toast(t('toast_demo') + t(key)); }
    function go(p) { toast(t('toast_demo') + p + ' — dashboard'); }

    var DATA = {
        all: { students: '1.120', classes: '36', revenue: '1,42 tỷ ₫', debt: '186 triệu ₫' },
        hn: { students: '640', classes: '20', revenue: '790 triệu ₫', debt: '98 triệu ₫' },
        hcm: { students: '480', classes: '16', revenue: '630 triệu ₫', debt: '88 triệu ₫' }
    };
    var CHARTS = {
        all: [38, 42, 45, 50, 48, 55, 61, 58, 66, 70, 74, 81],
        hn: [22, 24, 26, 28, 27, 31, 33, 32, 37, 39, 41, 45],
        hcm: [16, 18, 19, 22, 21, 24, 28, 26, 29, 31, 33, 36]
    };
    var RECENT = [
        { s: 'Nguyễn Minh Anh', c: 'EN-B1-26 (K41)', b: 'br_hn', f: '3.500.000 ₫', paid: false },
        { s: 'Trần Quốc Bảo', c: 'IT-Python-09', b: 'br_hcm', f: '4.200.000 ₫', paid: true },
        { s: 'Lê Thu Hà', c: 'EN-A2-12 (K40)', b: 'br_hn', f: '3.200.000 ₫', paid: true },
        { s: 'Phạm Đức Huy', c: 'IELTS-6.5-03', b: 'br_hcm', f: '6.800.000 ₫', paid: false },
        { s: 'Vũ Ngọc Mai', c: 'EN-B1-26 (K41)', b: 'br_hn', f: '3.500.000 ₫', paid: true }
    ];
    function renderEnrollTable() {
        var h = '<thead><tr class="text-left text-soft" style="border-bottom: 1px solid var(--border);">' +
            ['col_student', 'col_class', 'col_branch', 'col_fee', 'col_status'].map(function (k) {
                return '<th class="py-2.5 px-3 font-semibold">' + t(k) + '</th>';
            }).join('') + '</tr></thead><tbody>';
        RECENT.forEach(function (r, i) {
            h += '<tr class="border-b" style="border-color: var(--border);">' +
                '<td class="py-3 px-3"><b>' + r.s + '</b></td>' +
                '<td class="py-3 px-3">' + r.c + '</td>' +
                '<td class="py-3 px-3">' + t(r.b) + '</td>' +
                '<td class="py-3 px-3">' + r.f + '</td>' +
                '<td class="py-3 px-3">' + (r.paid ? '<span class="badge badge-success">' + t('st_paid') + '</span>' : '<span class="badge badge-warning">' + t('st_pending') + '</span>') + '</td></tr>';
        });
        h += '</tbody>';
        document.getElementById('enrollTable').innerHTML = h;
    }
    function renderChart(arr) {
        var c = document.getElementById('enrollChart'); c.innerHTML = '';
        var max = Math.max.apply(null, arr);
        arr.forEach(function (v, i) {
            var col = document.createElement('div');
            col.className = 'flex-1 flex flex-col items-center gap-1.5';
            col.innerHTML = '<div class="w-full max-w-[42px] rounded-t-md" style="height:' + Math.round(v / max * 150) + 'px; background: linear-gradient(180deg, ' + (i === arr.length - 1 ? 'var(--secondary), var(--primary)' : 'var(--primary-light), var(--primary)') + ');"></div>' +
                '<span class="text-[10px] text-faint">' + t('m')[i] + '</span>';
            c.appendChild(col);
        });
    }
    function switchBranch() {
        branch = document.getElementById('branchSel').value;
        var d = DATA[branch], ids = ['st_students', 'st_classes', 'st_revenue', 'st_debt'], vals = [d.students, d.classes, d.revenue, d.debt];
        ids.forEach(function (id, i) {
            var el = document.getElementById(id);
            el.style.opacity = '.3';
            setTimeout(function () { el.textContent = vals[i]; el.style.opacity = '1'; }, 250);
        });
        renderChart(CHARTS[branch]);
        toast(t('toast_switch') + t(branch === 'all' ? 'all_branches' : branch === 'hn' ? 'br_hn' : 'br_hcm'));
    }

    /* ===== user menu (popup) ===== */
    function toggleUserMenu(e) {
        e.stopPropagation();
        document.getElementById('userDropdown').classList.toggle('hidden');
    }
    document.addEventListener('click', function (e) {
        var d = document.getElementById('userDropdown');
        if (d && !d.classList.contains('hidden') && !e.target.closest('#userMenu')) d.classList.add('hidden');
    });
    function demoMenu(key) {
        var d = document.getElementById('userDropdown'); if (d) d.classList.add('hidden');
        toast(t(key));
    }

    applyTheme(); setLang(LANG); renderChart(CHARTS.all); renderEnrollTable();
</script>
